        /* ===================================================================
           AGENDA
           Responde "onde eu vou?" para um dia escolhido: todas as casas, o
           horário, quanto custa entrar e as promoções, sem precisar abrir
           nenhuma casa. Hoje, amanhã, o fim de semana ou um dia da semana.
           =================================================================== */

        let agendaDia = 'hoje';     // 'hoje' | 'amanha' | 'fds' | 'd:AAAA-MM-DD'

        function inicioDoDia(d) {
            return new Date(d.getFullYear(), d.getMonth(), d.getDate());
        }

        function chaveDia(d) {
            return `d:${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
        }

        function diaDaChave(chave) {
            const [a, m, d] = chave.slice(2).split('-').map(Number);
            return new Date(a, m - 1, d);
        }

        // Sexta, sábado e domingo a partir de hoje, sem passar da próxima segunda.
        function diasDoFimDeSemana(ref) {
            const hoje = inicioDoDia(ref);
            const dias = [];
            for (let i = 0; i < 7; i++) {
                const d = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate() + i);
                if (i > 0 && d.getDay() === 1) break;
                if ([5, 6, 0].includes(d.getDay())) dias.push(d);
            }
            return dias;
        }

        function diasDaSelecao(sel, ref) {
            const hoje = inicioDoDia(ref);
            if (sel === 'hoje') return [hoje];
            if (sel === 'amanha') return [new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate() + 1)];
            if (sel === 'fds') return diasDoFimDeSemana(ref);
            return [diaDaChave(sel)];
        }

        // Noites de um dia de calendário. Em "hoje", a noite de ontem que ainda
        // não acabou também entra: às 2h da manhã, o rolê de ontem é o de agora.
        function noitesDoDia(dia, ref) {
            const lista = [];
            const incluir = (house, prog, base) => {
                const inicio = new Date(base.getFullYear(), base.getMonth(), base.getDate(), ...prog.inicio.split(':').map(Number));
                const fim = new Date(inicio.getTime() + duracaoMin(prog) * 60000);
                let estado = 'futura';
                if (ref >= fim) estado = 'encerrada';
                else if (ref >= inicio) estado = 'agora';
                lista.push({ house, prog, occ: { inicio, fim }, estado });
            };
            const ontem = new Date(dia.getFullYear(), dia.getMonth(), dia.getDate() - 1);
            const ehHoje = mesmoDia(dia, ref);

            housesData.forEach(house => {
                (house.programacao || []).forEach(prog => {
                    if (prog.diaSemana === dia.getDay()) incluir(house, prog, dia);
                    if (ehHoje && prog.diaSemana === ontem.getDay()) {
                        const antes = lista.length;
                        incluir(house, prog, ontem);
                        if (lista[antes].estado !== 'agora') lista.pop();
                    }
                });
            });

            const peso = { agora: 0, futura: 1, encerrada: 2 };
            return lista.sort((a, b) => (peso[a.estado] - peso[b.estado]) || (a.occ.inicio - b.occ.inicio));
        }

        function rotuloChipAgenda(sel, ref) {
            if (sel === 'hoje') return 'Hoje';
            if (sel === 'amanha') return 'Amanhã';
            if (sel === 'fds') return 'Fim de semana';
            const d = diaDaChave(sel);
            return `${DIAS_ABREV[d.getDay()]} ${d.getDate()}`;
        }

        function opcoesAgenda(ref) {
            const hoje = inicioDoDia(ref);
            const opcoes = ['hoje', 'amanha', 'fds'];
            for (let i = 2; i < 7; i++) {
                opcoes.push(chaveDia(new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate() + i)));
            }
            return opcoes;
        }

        function selecionarDiaAgenda(sel) {
            agendaDia = sel;
            renderAgenda();
            window.scrollTo(0, 0);
        }

        function abrirAgenda(sel) {
            agendaDia = sel;
            switchTab('agenda');
        }

        function tempoPromoAgenda(promo, pst, estadoNoite) {
            if (estadoNoite === 'agora') return tempoPromo(promo, pst);
            const j = pst.janela;
            if (promo.fim) return { texto: `até ${fmtHora(j.fim)}`, classe: 'c-2' };
            if (promo.inicio) return { texto: `a partir de ${fmtHora(j.inicio)}`, classe: 'c-2' };
            return { texto: 'a noite toda', classe: 'c-2' };
        }

        function cartaoAgendaHtml(item, ref) {
            const { house, prog, occ, estado } = item;
            const ent = infoEntrada(prog, occ, ref);
            const promos = promosDaNoite(prog, occ, ref);
            const valendo = promos.filter(x => x.st.estado !== 'expirada');
            const encerradas = promos.length - valendo.length;
            const generos = house.especialidade.split(',').slice(0, 2).map(s => s.trim()).join(', ');

            let status;
            if (estado === 'agora') status = `<span class="t-foot font-semibold c-live flex items-center gap-1.5 shrink-0"><span class="dot pulse"></span>Agora</span>`;
            else if (estado === 'encerrada') status = `<span class="t-foot c-3 shrink-0">Encerrou</span>`;
            else if (mesmoDia(occ.inicio, ref) && (occ.inicio - ref) <= 7200000) status = `<span class="t-foot font-semibold c-accent shrink-0">em ${fmtDuracao(Math.round((occ.inicio - ref) / 60000))}</span>`;
            else status = `<span class="t-foot font-semibold shrink-0">${fmtHora(occ.inicio)}</span>`;

            const detalheEntrada = estado === 'agora' ? ent.detalheCurto : (ent.detalheCurto || '').replace(/^faltam [^·]+· /, '');

            const promosHtml = (valendo.length || encerradas) ? `
                <div class="border-t-[0.5px] border-white/10 mx-3.5 py-2.5 space-y-2">
                    ${valendo.map(({ promo, st }) => {
                        const t = tempoPromoAgenda(promo, st, estado);
                        return `
                            <div class="flex items-center gap-2.5">
                                <i data-lucide="${iconePromo(promo)}" class="w-4 h-4 c-accent shrink-0"></i>
                                <span class="t-foot flex-1 min-w-0 truncate">${promo.nome}</span>
                                <span class="t-foot shrink-0 ${t.classe}">${t.texto}</span>
                            </div>`;
                    }).join('')}
                    ${encerradas ? `<p class="t-foot c-3">${encerradas} ${encerradas === 1 ? 'promoção encerrada' : 'promoções encerradas'}</p>` : ''}
                </div>` : '';

            return `
                <a href="?casa=${house.id}" onclick="openHouseDetail('${house.id}', '${prog.id}'); return false;"
                   class="press block rounded-[18px] bg-[#1c1c1e] overflow-hidden ${estado === 'encerrada' ? 'opacity-50' : ''}">
                    <div class="flex gap-3.5 p-3.5">
                        ${midiaHtml(house, 'w-[72px] h-[72px] rounded-xl shrink-0', 'thumb')}
                        <div class="flex-1 min-w-0 flex flex-col">
                            <div class="flex items-center justify-between gap-2">
                                <span class="t-foot c-2 truncate">${nomeCasa(house)} · ${house.setor}</span>
                                ${status}
                            </div>
                            <p class="t-headline">${nomeNoite(prog)}</p>
                            <p class="t-foot c-2 truncate">${fmtHora(occ.inicio)} – ${fmtHora(occ.fim)} · ${generos}</p>
                            <p class="t-sub font-semibold pt-1 ${ent.urgente && estado === 'agora' ? 'c-accent' : ''}">${ent.principal}${detalheEntrada ? `<span class="font-normal c-2"> · ${detalheEntrada}</span>` : ''}</p>
                        </div>
                    </div>
                    ${promosHtml}
                </a>`;
        }

        function resumoDoDia(itens) {
            const casas = new Set(itens.map(i => i.house.id)).size;
            if (!casas) return 'Nenhuma casa com programação';
            const free = itens.filter(i => (i.prog.entrada || [])[0] && i.prog.entrada[0].valor === 0).length;
            const promos = itens.reduce((acc, i) => acc + (i.prog.promocoes || []).length, 0);
            const partes = [`${casas} ${casas === 1 ? 'casa' : 'casas'}`];
            if (free) partes.push(`${free} com entrada free`);
            if (promos) partes.push(`${promos} ${promos === 1 ? 'promoção' : 'promoções'}`);
            return partes.join(' · ');
        }

        function blocoDiaHtml(dia, ref, comCabecalho) {
            const itens = noitesDoDia(dia, ref);
            const comNoite = new Set(itens.map(i => i.house.id));
            const fechadas = housesData.filter(h => !comNoite.has(h.id)).map(nomeCasa);

            const cabecalho = comCabecalho ? `
                <div class="bar-top sticky z-20 -mx-4 px-4 py-2.5" style="top: calc(env(safe-area-inset-top) + 44px);">
                    <p class="t-headline">${diaRelativo(dia, ref) === 'Hoje' || diaRelativo(dia, ref) === 'Amanhã' ? `${diaRelativo(dia, ref)} · ` : ''}${DIAS_TITULO[dia.getDay()]}, ${dia.getDate()} de ${MESES_LONGO[dia.getMonth()]}</p>
                    <p class="t-foot c-2">${resumoDoDia(itens)}</p>
                </div>` : '';

            const lista = itens.length
                ? `<div class="space-y-3">${itens.map(i => cartaoAgendaHtml(i, ref)).join('')}</div>`
                : `<div class="group-list px-4 py-8 text-center space-y-1">
                       <p class="t-headline">Nada programado</p>
                       <p class="t-sub c-2">Nenhuma casa publicou programação para este dia.</p>
                   </div>`;

            const rodape = itens.length && fechadas.length
                ? `<p class="t-foot c-3 px-1">Sem programação neste dia: ${fechadas.join(', ')}.</p>` : '';

            return `<section class="space-y-3">${cabecalho}${lista}${rodape}</section>`;
        }

        function renderAgenda() {
            const view = document.getElementById('agenda-lista');
            if (!view) return;
            const ref = agora();

            const opcoes = opcoesAgenda(ref);
            if (!opcoes.includes(agendaDia)) agendaDia = 'hoje';

            const rail = document.getElementById('agenda-dias');
            const railScroll = rail.scrollLeft;
            rail.innerHTML = opcoes.map(sel => {
                const dias = diasDaSelecao(sel, ref);
                const casas = new Set(dias.flatMap(d => noitesDoDia(d, ref).map(i => i.house.id))).size;
                const ativo = sel === agendaDia;
                return `
                    <button onclick="selecionarDiaAgenda('${sel}')" aria-pressed="${ativo}"
                            class="press shrink-0 rounded-2xl px-3.5 py-2 min-w-[76px] flex flex-col items-start ${ativo ? 'bg-white text-black' : 'bg-[#1c1c1e] text-white'}">
                        <span class="t-sub font-semibold whitespace-nowrap">${rotuloChipAgenda(sel, ref)}</span>
                        <span class="t-foot ${ativo ? 'text-black/60' : 'c-2'}">${casas ? `${casas} ${casas === 1 ? 'casa' : 'casas'}` : 'nada'}</span>
                    </button>`;
            }).join('');
            rail.scrollLeft = railScroll;

            const dias = diasDaSelecao(agendaDia, ref);
            const unico = dias.length === 1;
            const [primeiro, ultimo] = [dias[0], dias[dias.length - 1]];
            const resumo = unico
                ? `${DIAS_TITULO[primeiro.getDay()]}, ${primeiro.getDate()} de ${MESES_LONGO[primeiro.getMonth()]}`
                : `${DIAS_TITULO[primeiro.getDay()]} ${primeiro.getDate()} a ${DIAS_TITULO[ultimo.getDay()].toLowerCase()} ${ultimo.getDate()} de ${MESES_LONGO[ultimo.getMonth()]}`;
            document.getElementById('agenda-resumo').innerText = resumo;

            const noMapa = agendaModo === 'mapa';
            document.getElementById('seg-agenda-lista').setAttribute('aria-selected', String(!noMapa));
            document.getElementById('seg-agenda-mapa').setAttribute('aria-selected', String(noMapa));
            view.classList.toggle('hidden', noMapa);
            document.getElementById('agenda-mapa').classList.toggle('hidden', !noMapa);

            if (noMapa) atualizarMapaAgenda(dias, ref);
            else { limparRota(); }
            if (!noMapa) view.innerHTML = dias.map(d => blocoDiaHtml(d, ref, !unico)).join('');
            lucide.createIcons();
        }

        /* ===================================================================
           MAPA E DISTÂNCIA
           A posição das casas é aproximada (centro do bairro) até termos o
           endereço exato. A localização do cliente só é pedida quando ele abre
           o mapa ou toca em "ver distância". Sem permissão, ou longe de Goiânia,
           usamos um ponto de demonstração e dizemos isso na tela.
           =================================================================== */

        const CENTRO_GOIANIA = { lat: -16.6869, lng: -49.2648 };
        const ORIGEM_DEMO = { lat: -16.6936, lng: -49.2706, nome: 'Praça Tamandaré' };
        const RAIO_CIDADE_KM = 60;
        const FATOR_RUA = 1.35;          // rua não é linha reta
        const VELOCIDADE_NOITE_KMH = 28; // trânsito da noite em Goiânia (julgamento, não medido)

        let minhaPosicao = null;              // { lat, lng }
        let origemTipo = 'desconhecida';      // desconhecida | pedindo | real | demo
        let origemMotivo = '';
        const CHAVE_MODO_AGENDA = 'godrinking.agendaModo';
        let agendaModo = (() => {             // lista | mapa — lembra a última escolha neste navegador
            try { return localStorage.getItem(CHAVE_MODO_AGENDA) === 'mapa' ? 'mapa' : 'lista'; } catch (e) { return 'lista'; }
        })();
        let camadaRota = null;
        let mapaAgenda = null, camadaPinos = null, marcadorEu = null;
        let mapaCasa = null;
        let pinoSelecionado = null;
        let itensMapaAtual = [];

        function distanciaKm(a, b) {
            const rad = x => x * Math.PI / 180;
            const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
            const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
            return 2 * 6371 * Math.asin(Math.sqrt(h));
        }

        function origemAtual() {
            return origemTipo === 'real' ? minhaPosicao : (origemTipo === 'demo' ? ORIGEM_DEMO : null);
        }

        // "2,4 km · ~7 min de carro". null se ainda não sabemos de onde o cliente sai.
        function trajeto(house) {
            const o = origemAtual();
            if (!o || !house.geo) return null;
            const km = distanciaKm(o, house.geo) * FATOR_RUA;
            const min = Math.max(3, Math.round(km / VELOCIDADE_NOITE_KMH * 60) + 2);
            const kmTxt = km < 1 ? `${Math.round(km * 1000 / 50) * 50} m` : `${km.toFixed(1).replace('.', ',')} km`;
            return { km, min, texto: `${kmTxt} · ~${min} min de carro` };
        }

        function linkMaps(house) {
            return `https://www.google.com/maps/dir/?api=1&destination=${house.geo.lat},${house.geo.lng}&travelmode=driving`;
        }

        function linkUber(house) {
            const p = new URLSearchParams({
                action: 'setPickup', pickup: 'my_location',
                'dropoff[latitude]': house.geo.lat, 'dropoff[longitude]': house.geo.lng,
                'dropoff[nickname]': nomeCasa(house)
            });
            return `https://m.uber.com/ul/?${p}`;
        }

        function botoesRotaHtml(house) {
            return `
                <a href="${linkMaps(house)}" target="_blank" rel="noopener" class="press btn-secondary flex-1 justify-center">
                    <i data-lucide="navigation" class="w-4 h-4"></i>Maps
                </a>
                <a href="${linkUber(house)}" target="_blank" rel="noopener" class="press btn-secondary flex-1 justify-center">
                    <i data-lucide="car" class="w-4 h-4"></i>Uber
                </a>`;
        }

        function pedirLocalizacao() {
            if (origemTipo === 'pedindo') return;
            const usarDemo = motivo => { origemTipo = 'demo'; origemMotivo = motivo; aoMudarOrigem(); };
            if (!navigator.geolocation) return usarDemo('sem-suporte');
            origemTipo = 'pedindo';
            aoMudarOrigem();
            navigator.geolocation.getCurrentPosition(pos => {
                const p = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                if (distanciaKm(p, CENTRO_GOIANIA) > RAIO_CIDADE_KM) return usarDemo('longe');
                minhaPosicao = p;
                origemTipo = 'real';
                origemMotivo = '';
                aoMudarOrigem();
            }, () => usarDemo('negada'), { enableHighAccuracy: false, timeout: 8000, maximumAge: 300000 });
        }

        function textoOrigem() {
            if (origemTipo === 'real') return 'Distância a partir de onde você está.';
            if (origemTipo === 'pedindo') return 'Buscando sua localização…';
            if (origemTipo === 'demo') {
                const porque = origemMotivo === 'longe' ? 'Você está fora de Goiânia' : 'Sem acesso à sua localização';
                return `${porque}: distância a partir da ${ORIGEM_DEMO.nome}, para demonstração.`;
            }
            return '';
        }

        // Atualiza só o que depende da origem, sem redesenhar a tela inteira.
        function aoMudarOrigem() {
            if (currentTab === 'agenda' && agendaModo === 'mapa') {
                desenharEu();
                desenharPinos();
                desenharRodapeMapa();
                if (pinoSelecionado) mostrarCartaoMapa(pinoSelecionado);
                const casaSel = pinoSelecionado && housesData.find(h => h.id === pinoSelecionado);
                if (casaSel) desenharRota(casaSel, true);
                else if (origemTipo === 'real') centralizarMapaAgenda();
            }
            const alvo = document.getElementById('casa-distancia');
            if (alvo && currentTab === 'casa') alvo.innerHTML = distanciaCasaHtml(housesData.find(h => h.id === activeHouseId));
        }

        function anelDoEstado(estado) {
            if (estado === 'agora') return 'var(--live)';
            if (estado === 'futura') return 'var(--accent)';
            return '#636366';
        }

        function iconePino(house, estado, opts) {
            opts = opts || {};
            const classes = ['pino-envelope'];
            if (opts.selecionado) classes.push('sel');
            if (!estado || estado === 'encerrada') classes.push('apagado');
            return L.divIcon({
                className: '',
                iconSize: [44, 44],
                iconAnchor: [22, 22],
                html: `
                    <span class="${classes.join(' ')}">
                        <span class="pino" style="--anel: ${anelDoEstado(estado)}">
                            <span class="pino-ini">${escHtml(nomeCasa(house).charAt(0))}</span>
                            <img src="logo-casas/${house.id}.jpg" alt="" onerror="this.remove()">
                        </span>
                        ${opts.minutos ? `<span class="pino-min">${opts.minutos} min</span>` : ''}
                        ${opts.semNome ? '' : `<span class="pino-nome">${escHtml(nomeCasa(house))}</span>`}
                    </span>`
            });
        }

        function criarMapaBase(elemento, opcoes) {
            const mapa = L.map(elemento, Object.assign({ zoomControl: false, attributionControl: false }, opcoes || {}));
            // Base cinza-escura da Esri: não exige chave. (A CARTO passou a exigir e devolve marca d'água.)
            const esri = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/';
            L.tileLayer(esri + 'World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 16, attribution: 'Mapa © <a href="https://www.esri.com">Esri</a>, OpenStreetMap e colaboradores'
            }).addTo(mapa);
            L.tileLayer(esri + 'World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16 }).addTo(mapa);
            L.control.attribution({ prefix: false, position: opcoes && opcoes.atribuicaoEmCima ? 'topleft' : 'bottomright' }).addTo(mapa);
            return mapa;
        }

        function setAgendaModo(modo) {
            agendaModo = modo;
            try { localStorage.setItem(CHAVE_MODO_AGENDA, modo); } catch (e) { /* navegação privada: só não lembra */ }
            pinoSelecionado = null;
            renderAgenda();
            window.scrollTo(0, 0);
        }

        // Uma entrada por casa fixa: a noite mais relevante da seleção (agora > mais cedo).
        function itensDoMapa(dias, ref) {
            const porCasa = new Map();
            dias.forEach(d => noitesDoDia(d, ref).forEach(i => {
                const atual = porCasa.get(i.house.id);
                const peso = { agora: 0, futura: 1, encerrada: 2 };
                if (!atual || peso[i.estado] < peso[atual.estado]) porCasa.set(i.house.id, i);
            }));
            const fixas = housesData.filter(h => h.geo).map(h => porCasa.get(h.id) || { house: h, prog: null, occ: null, estado: null });
            const itinerantes = [...porCasa.values()].filter(i => !i.house.geo).map(i => i.house);
            return { fixas, itinerantes };
        }

        function atualizarMapaAgenda(dias, ref) {
            if (typeof L === 'undefined') {
                document.getElementById('mapa-agenda').innerHTML = '<p class="t-sub c-2 p-6 text-center">Não foi possível carregar o mapa. Verifique a conexão.</p>';
                return;
            }
            const primeiraVez = !mapaAgenda;
            if (primeiraVez) {
                mapaAgenda = criarMapaBase('mapa-agenda');
                camadaPinos = L.layerGroup().addTo(mapaAgenda);
                camadaRota = L.layerGroup().addTo(mapaAgenda);
                mapaAgenda.on('click', () => { pinoSelecionado = null; desenharPinos(); esconderCartaoMapa(); limparRota(); });
            }
            const { fixas, itinerantes } = itensDoMapa(dias, ref);
            itensMapaAtual = fixas;
            mapaAgenda._itinerantes = itinerantes;
            desenharPinos();
            desenharEu();
            desenharRodapeMapa();
            if (pinoSelecionado) mostrarCartaoMapa(pinoSelecionado); else esconderCartaoMapa();
            const casaSel = pinoSelecionado && housesData.find(h => h.id === pinoSelecionado);
            if (casaSel) desenharRota(casaSel, false); else limparRota();

            // O contêiner acabou de aparecer: o Leaflet precisa medir de novo antes de
            // enquadrar. Enquadrar com tamanho zero abre o mapa no zoom mínimo.
            if (primeiraVez) mapaAgenda.setView([CENTRO_GOIANIA.lat, CENTRO_GOIANIA.lng], 14);
            setTimeout(() => {
                mapaAgenda.invalidateSize();
                if (primeiraVez) centralizarMapaAgenda();
            }, 60);
            if (origemTipo === 'desconhecida') pedirLocalizacao();
        }

        function desenharPinos() {
            camadaPinos.clearLayers();
            itensMapaAtual.forEach(item => {
                const sel = pinoSelecionado === item.house.id;
                const m = L.marker([item.house.geo.lat, item.house.geo.lng], {
                    icon: iconePino(item.house, item.estado, { selecionado: sel, minutos: (trajeto(item.house) || {}).min }),
                    zIndexOffset: sel ? 1000 : (item.estado === 'agora' ? 500 : 0),
                    keyboard: true, title: nomeCasa(item.house)
                });
                m.on('click', e => {
                    L.DomEvent.stopPropagation(e);
                    pinoSelecionado = item.house.id;
                    desenharPinos();
                    mostrarCartaoMapa(item.house.id);
                    if (!desenharRota(item.house, true)) mapaAgenda.panTo([item.house.geo.lat, item.house.geo.lng], { animate: true });
                });
                camadaPinos.addLayer(m);
            });
        }

        // Linha ilustrativa (não é o trajeto real pelas ruas): uma curva suave da
        // origem até a casa, tracejada e "andando" em direção ao bar.
        function desenharRota(house, enquadrar) {
            if (!camadaRota) return false;
            limparRota();
            const o = origemAtual();
            if (!o || !house.geo) return false;
            const a = [o.lat, o.lng], b = [house.geo.lat, house.geo.lng];
            const meio = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
            const dx = b[1] - a[1], dy = b[0] - a[0];
            const ctrl = [meio[0] - dx * 0.25, meio[1] + dy * 0.25]; // empurra o meio para o lado: vira arco
            const pontos = [];
            for (let i = 0; i <= 32; i++) {
                const t = i / 32, u = 1 - t;
                pontos.push([u * u * a[0] + 2 * u * t * ctrl[0] + t * t * b[0], u * u * a[1] + 2 * u * t * ctrl[1] + t * t * b[1]]);
            }
            const cor = (house.theme && house.theme.primary) || '#ff9f0a';
            const camada = (estilo) => {
                const linha = L.polyline(pontos, Object.assign({ interactive: false, lineCap: 'round' }, estilo)).addTo(camadaRota);
                const el = linha.getElement();
                if (el) el.setAttribute('pathLength', '100');
                return el;
            };
            const halo = camada({ color: cor, weight: 20, opacity: 0.7, className: 'rota-onda halo rota-trilho' });
            const nucleo = camada({ color: cor, weight: 4.5, opacity: 1, className: 'rota-onda rota-trilho' });
            animarOnda(a, b, cor, nucleo, halo);
            if (enquadrar) mapaAgenda.fitBounds([a, b], { paddingTopLeft: [56, 56], paddingBottomRight: [56, 230], maxZoom: 15 });
            return true;
        }

        // Estilo "AI Mode": a linha inteira é um gradiente da cor do bar, que flui sem parar da origem para a casa. O halo usa o
        // mesmo gradiente, desfocado, e respira. spreadMethod=reflect evita emenda.
        let ondaRaf = null;
        let ondaZoomHandler = null;

        function limparRota() {
            if (ondaRaf) cancelAnimationFrame(ondaRaf);
            ondaRaf = null;
            if (ondaZoomHandler && mapaAgenda) mapaAgenda.off('zoomend', ondaZoomHandler);
            ondaZoomHandler = null;
            if (camadaRota) camadaRota.clearLayers();
        }

        function hexParaHsl(hex) {
            const n = parseInt(hex.replace('#', ''), 16);
            const r = ((n >> 16) & 255) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
            const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2;
            if (max === min) return { h: 0, s: 0, l };
            const d = max - min;
            const s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
            const h = max === r ? (g - b) / d + (g < b ? 6 : 0) : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
            return { h: h * 60, s, l };
        }

        // Uma cor só: a do bar. O que corre pela linha é a claridade dela,
        // do tom mais fundo até um brilho quase branco da mesma cor.
        function paletaEnergia(cor) {
            const { h, s } = hexParaHsl(cor);
            const sat = Math.round(Math.max(s, 0.75) * 100);
            const tom = l => `hsl(${Math.round(h)}, ${sat}%, ${l}%)`;
            return [tom(38), tom(50), tom(62), tom(78), tom(62)];
        }

        function animarOnda(a, b, cor, nucleo, halo) {
            const svg = nucleo && nucleo.ownerSVGElement;
            if (!svg) return;
            const NS = 'http://www.w3.org/2000/svg';
            let defs = svg.querySelector('defs');
            if (!defs) { defs = document.createElementNS(NS, 'defs'); svg.insertBefore(defs, svg.firstChild); }
            const antigo = svg.querySelector('#onda-rota');
            if (antigo) antigo.remove();
            const grad = document.createElementNS(NS, 'linearGradient');
            grad.id = 'onda-rota';
            grad.setAttribute('gradientUnits', 'userSpaceOnUse');
            grad.setAttribute('spreadMethod', 'reflect');
            const cores = paletaEnergia(cor);
            cores.forEach((c, i) => {
                const st = document.createElementNS(NS, 'stop');
                st.setAttribute('offset', i / (cores.length - 1));
                st.setAttribute('stop-color', c);
                grad.appendChild(st);
            });
            defs.appendChild(grad);
            [nucleo, halo].forEach(el => el && el.setAttribute('stroke', 'url(#onda-rota)'));

            // Um período do gradiente cobre 45% do trajeto; ele desliza na direção do bar.
            let pa, dir, periodo;
            const posicionar = () => {
                pa = mapaAgenda.latLngToLayerPoint(a);
                const pb = mapaAgenda.latLngToLayerPoint(b);
                const dx = pb.x - pa.x, dy = pb.y - pa.y;
                const comp = Math.max(1, Math.hypot(dx, dy));
                dir = { x: dx / comp, y: dy / comp };
                periodo = comp * 0.45;
                grad.setAttribute('x1', pa.x); grad.setAttribute('y1', pa.y);
                grad.setAttribute('x2', pa.x + dir.x * periodo); grad.setAttribute('y2', pa.y + dir.y * periodo);
            };
            posicionar();
            ondaZoomHandler = posicionar;
            mapaAgenda.on('zoomend', ondaZoomHandler);

            if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;

            const VOLTA = 3200;  // ms para o gradiente andar um ciclo completo (2 períodos com reflect)
            const RESPIRO = 2800;
            const quadro = agora => {
                const fase = (agora % VOLTA) / VOLTA;
                const passo = fase * periodo * 2;
                grad.setAttribute('gradientTransform', `translate(${dir.x * passo} ${dir.y * passo})`);
                if (halo) halo.style.opacity = (0.45 + 0.3 * (0.5 + 0.5 * Math.sin(agora / RESPIRO * Math.PI * 2))).toFixed(3);
                ondaRaf = requestAnimationFrame(quadro);
            };
            ondaRaf = requestAnimationFrame(quadro);
        }

        function clarear(hex, quanto) {
            const n = parseInt(hex.replace('#', ''), 16);
            const canal = d => Math.round(((n >> d) & 255) + (255 - ((n >> d) & 255)) * quanto);
            return `rgb(${canal(16)}, ${canal(8)}, ${canal(0)})`;
        }

        function desenharEu() {
            if (!mapaAgenda) return;
            const o = origemAtual();
            if (marcadorEu) { marcadorEu.remove(); marcadorEu = null; }
            if (!o) return;
            marcadorEu = L.marker([o.lat, o.lng], {
                icon: L.divIcon({ className: '', iconSize: [18, 18], iconAnchor: [9, 9], html: '<span class="eu-ponto block"></span>' }),
                interactive: false, zIndexOffset: -100
            }).addTo(mapaAgenda);
        }

        function centralizarMapaAgenda() {
            if (!mapaAgenda) return;
            const pontos = itensMapaAtual.map(i => [i.house.geo.lat, i.house.geo.lng]);
            const o = origemAtual();
            if (o) pontos.push([o.lat, o.lng]);
            if (!pontos.length) return mapaAgenda.setView([CENTRO_GOIANIA.lat, CENTRO_GOIANIA.lng], 13);
            mapaAgenda.invalidateSize();
            mapaAgenda.fitBounds(pontos, { padding: [56, 56], maxZoom: 15 });
        }

        function desenharRodapeMapa() {
            const el = document.getElementById('mapa-rodape');
            if (!el) return;
            const linhas = [];
            const origem = textoOrigem();
            if (origem) linhas.push(origemTipo === 'demo'
                ? `${origem} <button type="button" onclick="pedirLocalizacao()" class="c-accent font-semibold">Usar a minha</button>`
                : origem);
            const itin = (mapaAgenda && mapaAgenda._itinerantes) || [];
            if (itin.length) linhas.push(`${itin.map(nomeCasa).join(' e ')} ${itin.length === 1 ? 'muda' : 'mudam'} de local a cada edição e não ${itin.length === 1 ? 'aparece' : 'aparecem'} no mapa.`);
            el.innerHTML = linhas.map(l => `<span class="block">${l}</span>`).join('');
        }

        function esconderCartaoMapa() {
            const c = document.getElementById('mapa-cartao');
            if (c) { c.classList.add('hidden'); c.innerHTML = ''; }
        }

        function mostrarCartaoMapa(houseId) {
            const item = itensMapaAtual.find(i => i.house.id === houseId);
            const c = document.getElementById('mapa-cartao');
            if (!item || !c) return;
            const { house, prog, occ, estado } = item;
            const ref = agora();
            const t = trajeto(house);

            let status = '', noite = '', entrada = '';
            const selo = (txt, classe) => `<span class="selo ${classe}">${txt}</span>`;
            if (prog) {
                status = estado === 'agora'
                    ? `${selo('<span class="dot pulse"></span>Aberto', 'aberto')}<span class="c-2">até ${fmtHora(occ.fim)}</span>`
                    : estado === 'encerrada'
                    ? `${selo('Fechado', 'fechado')}<span class="c-2">encerrou às ${fmtHora(occ.fim)}</span>`
                    : `${selo('Fechado', 'fechado')}<span class="c-2">abre ${diaRelativo(occ.inicio, ref).toLowerCase()} às ${fmtHora(occ.inicio)}</span>`;
                noite = `${nomeNoite(prog)} · ${fmtHora(occ.inicio)} – ${fmtHora(occ.fim)}`;
                entrada = infoEntrada(prog, occ, ref).principal;
            } else {
                status = `${selo('Fechado', 'fechado')}<span class="c-2">sem programação nestes dias</span>`;
            }

            c.innerHTML = `
                <div class="glass rounded-[18px] p-3 space-y-3 shadow-2xl">
                    <button type="button" onclick="openHouseDetail('${house.id}'${prog ? `, '${prog.id}'` : ''})" class="press w-full flex gap-3 text-left">
                        ${midiaHtml(house, 'w-16 h-16 rounded-xl shrink-0', 'thumb')}
                        <span class="flex-1 min-w-0 flex flex-col">
                            <span class="t-foot flex items-center gap-2">${status}</span>
                            <span class="t-headline truncate">${nomeCasa(house)}</span>
                            ${noite ? `<span class="t-foot c-2 truncate">${noite}</span>` : ''}
                            ${entrada ? `<span class="t-sub font-semibold">${entrada}</span>` : ''}
                        </span>
                        <i data-lucide="chevron-right" class="w-4 h-4 text-[#636366] shrink-0 self-center"></i>
                    </button>
                    <p class="t-foot c-2 flex items-center gap-1.5">
                        <i data-lucide="map-pin" class="w-3.5 h-3.5 shrink-0"></i>
                        ${t ? t.texto : (origemTipo === 'pedindo' ? 'Calculando distância…' : escHtml(house.endereco || house.setor))}
                    </p>
                    <div class="flex gap-2">${botoesRotaHtml(house)}</div>
                </div>`;
            c.classList.remove('hidden');
            lucide.createIcons();
        }

        // Página da casa: bloco "Como chegar"
        function distanciaCasaHtml(house) {
            if (!house || !house.geo) return '';
            const t = trajeto(house);
            if (t) return `${t.texto}${origemTipo === 'demo' ? ` <span class="c-3">(a partir da ${ORIGEM_DEMO.nome})</span>` : ''}`;
            if (origemTipo === 'pedindo') return 'Buscando sua localização…';
            return `<button type="button" onclick="pedirLocalizacao()" class="c-accent font-semibold">Ver a distância daqui</button>`;
        }

        function comoChegarHtml(house) {
            if (!house.geo) {
                return `
                    <section class="space-y-2.5">
                        <h2 class="t-title3">Onde é</h2>
                        <div class="group-list px-4 py-3.5">
                            <p class="t-sub c-2">O local muda a cada edição. A produtora divulga o endereço no Instagram.</p>
                        </div>
                    </section>`;
            }
            return `
                <section class="space-y-2.5">
                    <h2 class="t-title3">Como chegar</h2>
                    <div class="mapa-moldura rounded-[18px] bg-[#1c1c1e] overflow-hidden">
                        <div id="mapa-casa" class="h-[160px]"></div>
                        <div class="px-4 py-3.5 space-y-3">
                            <div class="space-y-0.5">
                                <p class="t-callout font-semibold">${escHtml(house.endereco || house.setor)}</p>
                                <p id="casa-distancia" class="t-foot c-2">${distanciaCasaHtml(house)}</p>
                            </div>
                            <div class="flex gap-2">${botoesRotaHtml(house)}</div>
                        </div>
                    </div>
                </section>`;
        }

        function montarMapaCasa(house, estado) {
            if (mapaCasa) { mapaCasa.remove(); mapaCasa = null; }
            const el = document.getElementById('mapa-casa');
            if (!el || !house.geo || typeof L === 'undefined') return;
            mapaCasa = criarMapaBase(el, {
                dragging: false, touchZoom: false, scrollWheelZoom: false, doubleClickZoom: false,
                boxZoom: false, keyboard: false, tap: false, atribuicaoEmCima: true
            });
            mapaCasa.setView([house.geo.lat, house.geo.lng], 15);
            L.marker([house.geo.lat, house.geo.lng], { icon: iconePino(house, estado || 'futura', { semNome: true }), interactive: false }).addTo(mapaCasa);
            setTimeout(() => { if (mapaCasa) { mapaCasa.invalidateSize(); mapaCasa.setView([house.geo.lat, house.geo.lng], 15); } }, 60);
        }

        /* ===================================================================
           NAVEGAÇÃO
           =================================================================== */

        const VIEWS = {
            hoje: 'tab-hoje-view',
            agenda: 'tab-agenda-view',
            vibes: 'tab-vibes-view',
            ingressos: 'tab-ingressos-view',
            casa: 'house-detail-view',
            gerente: 'manager-dashboard-view',
            freelas: 'tab-freelas-view'
        };
        const ALIAS_ABAS = { discover: 'hoje', promos: 'hoje', reservas: 'ingressos' };
        const TITULO_COMPACTO = { hoje: 'Hoje', agenda: 'Agenda', ingressos: 'Ingressos', freelas: 'Trabalhe na noite', gerente: 'Painel da casa' };

        function mostrarView(nome) {
            if (nome !== 'agenda' && typeof limparRota === 'function') limparRota(); // a animação da rota não roda escondida
            Object.entries(VIEWS).forEach(([k, id]) => {
                document.getElementById(id).classList.toggle('hidden', k !== nome);
            });

            if (nome !== 'vibes') {
                document.querySelectorAll('.vibes-card video').forEach(vid => vid.pause());
                document.body.style.overflow = '';
            } else {
                document.body.style.overflow = 'hidden'; // evita o "quique" da página no iOS
            }

            document.getElementById('casa-topo').classList.toggle('hidden', nome !== 'casa');
            document.getElementById('casa-cta').classList.toggle('hidden', nome !== 'casa');
            document.getElementById('tabbar').classList.toggle('hidden', nome === 'casa' || nome === 'gerente');

            const ativa = { hoje: 'hoje', freelas: 'hoje', agenda: 'agenda', vibes: 'vibes', ingressos: 'ingressos' }[nome];
            ['hoje', 'agenda', 'vibes', 'ingressos'].forEach(t => {
                const btn = document.getElementById('nav-' + t);
                btn.classList.toggle('on', t === ativa);
                if (t === ativa) btn.setAttribute('aria-current', 'page');
                else btn.removeAttribute('aria-current');
            });

            atualizarBarraCompacta();
        }

        function switchTab(tab) {
            const pedido = tab;
            tab = ALIAS_ABAS[tab] || tab;

            if (isManagerMode) {
                isManagerMode = false;
                sincronizarToggleGerente();
            }
            if (['hoje', 'agenda', 'vibes', 'ingressos'].includes(tab)) abaAnterior = tab;
            currentTab = tab;
            mostrarView(tab);

            if (tab === 'hoje') {
                renderHoje();
            } else if (tab === 'agenda') {
                renderAgenda();
            } else if (tab === 'vibes') {
                initVibesEngine(); // Lazy-initialize the observer, audio mute states and event listeners
            } else if (tab === 'ingressos') {
                updateReservasUI();
            } else if (tab === 'freelas') {
                // Sem item próprio na barra inferior: é outro público (ver base/07, seção 6)
                renderFreelas();
            }

            if (tab !== 'vibes') window.scrollTo(0, 0);
            if (pedido === 'promos') {
                const secao = document.getElementById('secao-valendo');
                if (secao) secao.scrollIntoView();
            }
            lucide.createIcons();
        }

        // Título pequeno no topo quando o título grande (ou a capa da casa) sai da tela.
        function atualizarBarraCompacta() {
            const barra = document.getElementById('barra-compacta');
            if (!barra) return;
            let texto = TITULO_COMPACTO[currentTab];
            let limite = 60;
            if (currentTab === 'casa' && activeHouseId) {
                texto = nomeCasa(housesData.find(h => h.id === activeHouseId));
                limite = 380;
            }
            const visivel = !!texto && currentTab !== 'vibes' && window.scrollY > limite;
            document.getElementById('barra-compacta-titulo').innerText = texto || '';
            barra.classList.toggle('opacity-0', !visivel);
        }

        /* ===================================================================
           CASA
           =================================================================== */

        let noiteSelecionadaId = null;

        function openHouseDetail(houseId, progId, opts) {
            opts = opts || {};
            const house = housesData.find(h => h.id === houseId);
            if (!house) return;
            if (houseId !== activeHouseId) noiteSelecionadaId = null;
            if (progId) noiteSelecionadaId = progId;
            activeHouseId = houseId;
            if (isManagerMode) {
                isManagerMode = false;
                sincronizarToggleGerente();
            }
            currentTab = 'casa';
            mostrarView('casa');

            const view = document.getElementById('house-detail-view');
            const ref = agora();

            // A semana começa onde o cliente está, não na segunda-feira.
            const agenda = agendaOrdenada(house, ref);
            const st = agenda.find(s => s.prog.id === noiteSelecionadaId) || agenda[0];
            const proxima = agenda[0];

            let status;
            if (proxima && proxima.estado === 'agora') {
                status = `<span class="dot pulse"></span><span class="c-live font-semibold">Rolando agora</span><span class="c-2">· até ${fmtHora(proxima.fim)}</span>`;
            } else if (proxima) {
                status = `<span class="dot idle"></span><span class="c-2">Abre ${diaRelativo(proxima.inicio, ref).toLowerCase()} às ${fmtHora(proxima.inicio)}</span>`;
            } else {
                status = `<span class="dot idle"></span><span class="c-2">Sem programação publicada</span>`;
            }

            let noiteHtml = '';
            if (st) {
                const prog = st.prog;
                const promos = promosDaNoite(prog, st.occ, ref);
                const ehHoje = diaRelativo(st.inicio, ref) === 'Hoje';

                let comeca = '';
                if (st.estado !== 'agora' && st.emMin <= 720) comeca = `<p class="t-sub c-accent">Começa em ${fmtDuracao(st.emMin)}</p>`;

                noiteHtml = `
                    <section class="space-y-2.5">
                        <p class="t-cap c-2">${rotuloDataNoite(st.inicio, ref)}</p>
                        <div class="rounded-[18px] bg-[#1c1c1e] px-4 py-[18px] space-y-4">
                            <div class="space-y-1">
                                <h2 class="t-title2">${nomeNoite(prog)}</h2>
                                <p class="t-sub c-2">${fmtHora(st.inicio)} – ${fmtHora(st.fim)}</p>
                                ${comeca}
                            </div>
                            <div class="group-list on-fill">${faixasEntradaHtml(prog, st.occ, ref)}</div>
                            ${prog.descricao ? `<p class="t-sub text-[#ebebf5]">${prog.descricao}</p>` : ''}
                            ${prog.djs ? `
                            <div class="space-y-1">
                                <p class="t-foot c-2">Line-up</p>
                                <p class="t-sub font-medium">${titulo(prog.djs).split(',').map(s => s.trim()).join(', ')}</p>
                            </div>` : ''}
                        </div>
                    </section>

                    ${promos.length ? `
                    <section class="space-y-2.5">
                        <h2 class="t-title3">${!ehHoje ? 'Promoções da noite' : promos.some(x => x.st.estado !== 'expirada') ? 'Valendo hoje' : 'Promoções de hoje'}</h2>
                        <div class="group-list">
                            ${promos.map(({ promo, st: pst }) => {
                                const t = tempoPromo(promo, pst);
                                return `
                                    <div class="row ${pst.estado === 'expirada' ? 'opacity-40' : ''}" style="--inset: 64px;">
                                        <span class="w-9 h-9 rounded-[10px] bg-[#2c2c2e] flex items-center justify-center shrink-0 c-accent">
                                            <i data-lucide="${iconePromo(promo)}" class="w-5 h-5"></i>
                                        </span>
                                        <span class="flex-1 min-w-0 flex flex-col gap-0.5">
                                            <span class="t-callout font-semibold">${promo.nome}</span>
                                            ${promo.detalhe ? `<span class="t-foot c-2">${promo.detalhe}</span>` : ''}
                                        </span>
                                        <span class="t-foot shrink-0 text-right ${t.classe}">${t.texto}</span>
                                    </div>`;
                            }).join('')}
                        </div>
                    </section>` : ''}`;
            }

            const outras = agenda.filter(s => !st || s.prog.id !== st.prog.id);
            const outrasHtml = outras.length ? `
                <section class="space-y-2.5">
                    <h2 class="t-title3">Outras noites</h2>
                    <div class="group-list">
                        ${outras.map(s => `
                            <button onclick="openHouseDetail('${house.id}', '${s.prog.id}')" class="press row" style="--inset: 74px;">
                                <span class="w-11 flex flex-col items-center shrink-0">
                                    <span class="text-[11px] font-semibold c-accent">${s.estado === 'agora' ? 'AGORA' : DIAS_ABREV[s.inicio.getDay()].toUpperCase()}</span>
                                    <span class="text-[22px] font-bold leading-7">${s.inicio.getDate()}</span>
                                </span>
                                <span class="flex-1 min-w-0 flex flex-col gap-0.5">
                                    <span class="t-callout font-semibold truncate">${nomeNoite(s.prog)}</span>
                                    <span class="t-foot c-2 truncate">${fmtHora(s.inicio)} · ${infoEntrada(s.prog, s.occ, ref).curto}</span>
                                </span>
                                <i data-lucide="chevron-right" class="w-4 h-4 text-[#636366] shrink-0"></i>
                            </button>`).join('')}
                    </div>
                </section>` : '';

            const vibesHtml = house.videoUrl ? `
                <section class="space-y-2.5">
                    <h2 class="t-title3">Vibes</h2>
                    <button onclick="abrirVibesDaCasa('${house.id}')" aria-label="Ver o vídeo de ${escHtml(nomeCasa(house))}" class="press relative block w-[120px] h-[212px] rounded-[14px] overflow-hidden">
                        ${midiaHtml(house, 'absolute inset-0')}
                        <span class="glass absolute left-2.5 bottom-2.5 w-[30px] h-[30px] rounded-full flex items-center justify-center">
                            <i data-lucide="play" class="w-3 h-3 fill-white"></i>
                        </span>
                    </button>
                </section>` : '';

            if (mapaCasa) { mapaCasa.remove(); mapaCasa = null; }
            view.innerHTML = `
                <div class="relative h-[460px]">
                    ${midiaHtml(house, 'absolute inset-0')}
                    <div class="absolute inset-0 scrim-casa"></div>
                    <div class="absolute left-4 right-4 bottom-5 flex flex-col gap-2.5">
                        ${logoHtml(house, 'w-[52px] h-[52px] border-2 border-white/20')}
                        <h1 class="t-large">${nomeCasa(house)}</h1>
                        <p class="t-sub text-[#aeaeb2]">${house.especialidade} · ${house.setor}</p>
                    </div>
                </div>
                <div class="px-4 pt-2 pb-16 space-y-7">
                    <p class="t-sub flex items-center gap-2">${status}</p>
                    ${noiteHtml}
                    ${vibesHtml}
                    ${comoChegarHtml(house)}
                    ${outrasHtml}
                    ${house.instagram ? `
                    <a href="https://instagram.com/${house.instagram.replace('@', '')}" target="_blank" rel="noopener" class="press group-list row">
                        <i data-lucide="at-sign" class="w-5 h-5 c-2"></i>
                        <span class="flex-1 t-callout">${house.instagram.replace('@', '')}</span>
                        <i data-lucide="arrow-up-right" class="w-4 h-4 text-[#636366]"></i>
                    </a>` : ''}
                </div>
            `;

            montarMapaCasa(house, proxima && proxima.estado);

            // Ação principal fixa no rodapé
            const cta = document.getElementById('casa-cta');
            if (st) {
                const ent = infoEntrada(st.prog, st.occ, ref);
                const rel = diaRelativo(st.inicio, ref);
                const principal = document.getElementById('casa-cta-principal');
                principal.innerText = ent.principal;
                principal.classList.toggle('c-accent', ent.urgente);
                document.getElementById('casa-cta-detalhe').innerText =
                    rel === 'Hoje' ? (ent.detalheCurto || `${fmtHora(st.inicio)} – ${fmtHora(st.fim)}`) : `${rel} às ${fmtHora(st.inicio)}`;
                const botao = document.getElementById('casa-cta-botao');
                botao.innerText = house.categoria === 'bar' ? 'Reservar mesa' : 'Entrar na lista';
                botao.onclick = () => openReservationModal(st.prog.id, house.id);
            } else {
                cta.classList.add('hidden');
            }

            if (!opts.manterScroll) window.scrollTo(0, 0);
            atualizarBarraCompacta();
            lucide.createIcons();
        }

        function backToDiscover() {
            activeHouseId = null;
            noiteSelecionadaId = null;
            switchTab(abaAnterior || 'hoje');
        }

        function compartilharCasa() {
            const house = housesData.find(h => h.id === activeHouseId);
            if (!house) return;
            const url = `${location.href.split('?')[0]}?casa=${house.id}`;
            if (navigator.share) {
                navigator.share({ title: nomeCasa(house), url }).catch(() => { /* cancelado */ });
            } else if (navigator.clipboard) {
                navigator.clipboard.writeText(url).then(() => showSuccessToast('Link copiado'));
            }
        }

        function abrirVibesDaCasa(houseId) {
            switchTab('vibes');
            requestAnimationFrame(() => {
                const card = document.querySelector(`.vibes-card[data-house="${houseId}"]`);
                const container = document.getElementById('vibes-scroll-container');
                if (card && container) container.scrollTop = card.offsetTop;
            });
        }

        /* ===================================================================
           ENTRAR NA LISTA / RESERVAR
           =================================================================== */

        let pessoasReserva = 2;

        function rotuloPessoas(n) {
            return n === 1 ? '1 pessoa' : `${n} pessoas`;
        }

        function alterarPessoas(delta) {
            pessoasReserva = Math.min(10, Math.max(1, pessoasReserva + delta));
            document.getElementById('res-guests').value = pessoasReserva;
            document.getElementById('res-guests-label').innerText = pessoasReserva;
            document.getElementById('res-menos').disabled = pessoasReserva <= 1;
            document.getElementById('res-mais').disabled = pessoasReserva >= 10;
            const house = housesData.find(h => h.id === document.getElementById('modal-house-id').value);
            const verbo = house && house.categoria === 'bar' ? 'Reservar' : 'Confirmar';
            document.getElementById('res-submit').innerText = `${verbo} · ${rotuloPessoas(pessoasReserva)}`;
        }

        function openReservationModal(eventId, houseId) {
            const house = housesData.find(h => h.id === houseId);
            const p = house.programacao.find(prog => prog.id === eventId);
            const ref = agora();
            const st = statusNoite(p, ref);
            const isBar = house.categoria === 'bar';

            document.getElementById('modal-event-id').value = eventId;
            document.getElementById('modal-house-id').value = houseId;
            document.getElementById('modal-event-title').innerText = nomeNoite(p);
            document.getElementById('modal-house-title').innerText = st
                ? `${nomeCasa(house)} · ${diaRelativo(st.inicio, ref).toLowerCase()}, ${fmtHora(st.inicio)} – ${fmtHora(st.fim)}`
                : nomeCasa(house);
            const logo = document.getElementById('modal-house-logo');
            logo.style.visibility = '';
            logo.onerror = () => { logo.style.visibility = 'hidden'; };
            logo.src = `logo-casas/${house.id}.jpg`;

            document.getElementById('res-name').value = USUARIO.nome;
            document.getElementById('res-phone').value = USUARIO.telefone;

            // O cliente confirma sabendo quanto vai pagar e o que ainda vai pegar.
            const caixa = document.getElementById('modal-event-rules');
            if (st) {
                const ent = infoEntrada(p, st.occ, ref);
                const emCurso = ref >= st.occ.inicio;
                let dica = '';
                if (ent.gratisAte && ref < ent.gratisAte) {
                    dica = `Chegue até ${fmtHora(ent.gratisAte)} para entrar sem pagar.${emCurso ? ` Faltam ${fmtDuracao(ent.restam)}.` : ''}`;
                }
                const valendo = promosDaNoite(p, st.occ, ref).filter(x => x.st.estado !== 'expirada');

                caixa.innerHTML = `
                    <div class="space-y-2">
                        <p class="t-cap c-2 px-4">Entrada</p>
                        <div class="group-list on-fill">${faixasEntradaHtml(p, st.occ, ref)}</div>
                        ${dica ? `
                        <p class="flex items-center gap-2 px-4 t-foot c-accent">
                            <i data-lucide="clock" class="w-3.5 h-3.5 shrink-0"></i><span>${dica}</span>
                        </p>` : ''}
                    </div>
                    ${valendo.length ? `
                    <div class="space-y-2">
                        <p class="t-cap c-2 px-4">${diaRelativo(st.inicio, ref) === 'Hoje' ? 'Valendo hoje' : 'Promoções da noite'}</p>
                        <div class="group-list on-fill">
                            ${valendo.map(x => `
                                <div class="row justify-between">
                                    <span class="t-sub min-w-0">${x.promo.nome}</span>
                                    <span class="t-foot c-2 shrink-0">${x.promo.fim ? `até ${fmtHora(x.st.janela.fim)}` : 'a noite toda'}</span>
                                </div>`).join('')}
                        </div>

        // QR ilustrativo e estável por reserva: mesmo id, mesmo desenho.
        function qrSvg(semente) {
            const n = 25;
            let seed = 0;
            for (const c of semente) seed = (seed * 31 + c.charCodeAt(0)) % 2147483647;
            seed = seed || 1;
            const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
            const ancoras = [[0, 0], [0, n - 7], [n - 7, 0]];
            const fixo = (r, c) => {
                for (const [R, C] of ancoras) {
                    if (r >= R && r < R + 7 && c >= C && c < C + 7) {
                        return Math.max(Math.abs(r - R - 3), Math.abs(c - C - 3)) === 2 ? 0 : 1;
                    }
                    if (r >= R - 1 && r <= R + 7 && c >= C - 1 && c <= C + 7) return 0;
                }
                if (r === 6) return c % 2 === 0 ? 1 : 0;
                if (c === 6) return r % 2 === 0 ? 1 : 0;
                return null;
            };
            let rects = '';
            for (let r = 0; r < n; r++) {
                for (let c = 0; c < n; c++) {
                    const f = fixo(r, c);
                    const ligado = f === null ? rnd() > 0.52 : f === 1;
                    if (ligado) rects += `<rect x="${c}" y="${r}" width="1" height="1"/>`;
                }
            }
            return `<svg viewBox="0 0 ${n} ${n}" width="150" height="150" shape-rendering="crispEdges" role="img" aria-label="QR code da entrada"><rect width="${n}" height="${n}" fill="#fff"/><g fill="#000">${rects}</g></svg>`;
        }

        function contrasteNoPreto(hex) {
            const v = parseInt((hex || '#000000').slice(1), 16);
            const canal = x => { x /= 255; return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4); };
            const L = 0.2126 * canal((v >> 16) & 255) + 0.7152 * canal((v >> 8) & 255) + 0.0722 * canal(v & 255);
            return (L + 0.05) / 0.05;
        }

        // --- SISTEMA REELS/TIKTOK VIBES DE ALTA PERFORMANCE ---
        // Começa mutado: iOS bloqueia autoplay com áudio, e o desbloqueio só é permitido
        // dentro de um gesto do usuário (o toque no botão de som).
        let isVibesMuted = true;
        let vibesObserver = null;
        let vibesEngineInitialized = false;

        function toggleVibesAudio(event) {
            if (event) {
                event.stopPropagation();
                event.preventDefault();
            }
            
            isVibesMuted = !isVibesMuted;
            
            // Sync all video elements' mute state
            const videos = document.querySelectorAll('.vibes-card video');
            videos.forEach(vid => {
                vid.muted = isVibesMuted;
            });
            
            // Dynamic premium UI feedback for audio button
            document.querySelectorAll('.sound-toggle-btn').forEach(btn => {
                const muteIcon = btn.querySelector('.mute-icon');
                const unmuteIcon = btn.querySelector('.unmute-icon');
                if (isVibesMuted) {
                    muteIcon.classList.remove('hidden');
                    unmuteIcon.classList.add('hidden');
                } else {
                    muteIcon.classList.add('hidden');
                    unmuteIcon.classList.remove('hidden');
                }
            });
            
            showSuccessToast(isVibesMuted ? "Áudio Mutado" : "Áudio Ativado");
        }

        function initVibesEngine() {
            if (!vibesEngineInitialized) {
                renderVibes(); // Renderiza dinamicamente as mídias da base centralizada!
            }
            
            if (vibesEngineInitialized) {
                // Ensure audio icon reflects current state upon returning to the tab
                document.querySelectorAll('.sound-toggle-btn').forEach(btn => {
                    const muteIcon = btn.querySelector('.mute-icon');
                    const unmuteIcon = btn.querySelector('.unmute-icon');
                    if (isVibesMuted) {
                        muteIcon.classList.remove('hidden');
                        unmuteIcon.classList.add('hidden');
                    } else {
                        muteIcon.classList.add('hidden');
                        unmuteIcon.classList.remove('hidden');
                    }
                });
                
                // Play active video
                triggerVisibleVideoPlay();
                return;
            }
            
            vibesEngineInitialized = true;
            
            // --- 1. CONFIGURAR INTERSECTION OBSERVER (PLAY/PAUSE ON SCROLL) ---
            const cards = document.querySelectorAll('.vibes-card');
            const options = {
                root: document.getElementById('vibes-scroll-container'),
                threshold: 0.6 // Starts playing when card occupies at least 60% of viewport
            };
            
            vibesObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target.querySelector('video');
                    const bar = entry.target.querySelector('.vibes-progress-bar');
                    
                    if (!video) return;
                    
                    if (entry.isIntersecting) {
                        // Com preload="none" o iOS só busca a mídia quando pedimos explicitamente
                        if (video.preload === 'none') {
                            video.preload = 'auto';
                            video.load();
                        }

                        video.muted = isVibesMuted;

                        // Handle browser autoplay policy elegantly
                        const playPromise = video.play();
                        if (playPromise !== undefined) {
                            playPromise.catch(error => {
                                console.log("Autoplay blocked, running muted fallback:", error);
                                video.muted = true;
                                video.play().catch(e => console.error("Fallback play failed:", e));
                            });
                        }

                        // Real-time progress bar sync
                        video.ontimeupdate = () => {
                            if (video.duration) {
                                const pct = (video.currentTime / video.duration) * 100;
                                if (bar) bar.style.width = `${pct}%`;
                            }
                        };
                    } else {
                        video.pause();
                        // Só rebobina se já houver metadados; no iOS mexer em currentTime
                        // antes disso dispara InvalidStateError.
                        if (video.readyState > 0) video.currentTime = 0;
                        video.ontimeupdate = null;
                        if (bar) bar.style.width = '0%';
                    }
                });
            }, options);
            
            cards.forEach(card => vibesObserver.observe(card));

            // --- 2. DOUBLE CLICK / SINGLE TAP PARA PAUSAR E EXIBIR CORAÇÃO/PLAY ---
            cards.forEach(card => {
                const video = card.querySelector('video');
                
                card.addEventListener('click', (e) => {
                    // Ignore clicks on actionable items like buttons or svg icons
                    if (e.target.closest('button') || e.target.closest('a')) return;
                    
                    if (video.paused) {
                        video.play().catch(err => console.log("Play blocked: ", err));
                        showPlayPauseOverlay(card, 'play');
                    } else {
                        video.pause();
                        showPlayPauseOverlay(card, 'pause');
                    }
                });
            });
            
            lucide.createIcons();
        }

        // Helper triggers playing of currently visible video
        function triggerVisibleVideoPlay() {
            const container = document.getElementById('vibes-scroll-container');
            const cards = document.querySelectorAll('.vibes-card');
            cards.forEach(card => {
                const rect = card.getBoundingClientRect();
                const containerRect = container.getBoundingClientRect();
                
                // Check if card is visible inside container
                const isVisible = (rect.top >= containerRect.top - 50 && rect.bottom <= containerRect.bottom + 50);
                const video = card.querySelector('video');
                
                if (isVisible && video) {
                    video.muted = isVibesMuted;
                    video.play().catch(err => console.log("Autoplay failed on tab switch:", err));
                }
            });
        }

        // Immersive overlay animation on single-tap
        function showPlayPauseOverlay(card, type) {
            let overlay = card.querySelector('.play-pause-indicator');
            if (!overlay) {
                overlay = document.createElement('div');
                overlay.className = "play-pause-indicator absolute inset-0 flex items-center justify-center z-40 pointer-events-none opacity-0 transition-all duration-300 transform scale-50";
                overlay.innerHTML = `
                    <div class="w-16 h-16 rounded-full bg-black/60 backdrop-blur-md flex items-center justify-center text-white">
                        <i data-lucide="${type}" class="w-6 h-6"></i>
                    </div>
                `;
                card.appendChild(overlay);
                lucide.createIcons({
                    attrs: { class: 'w-6 h-6' },
                    nameAttr: 'data-lucide'
                });
            } else {
                overlay.innerHTML = `
                    <div class="w-16 h-16 rounded-full bg-black/60 backdrop-blur-md flex items-center justify-center text-white">
                        <i data-lucide="${type}" class="w-6 h-6"></i>
                    </div>
                `;
                lucide.createIcons({
                    attrs: { class: 'w-6 h-6' },
                    nameAttr: 'data-lucide'
                });
            }
            
            // Start scale up and fade in
            overlay.classList.remove('opacity-0', 'scale-50');
            overlay.classList.add('opacity-100', 'scale-110');
            
            setTimeout(() => {
                overlay.classList.remove('opacity-100', 'scale-110');
                overlay.classList.add('opacity-0', 'scale-50');
            }, 600);
        }

        function openManagerDashboard() {
            currentTab = 'gerente';
            mostrarView('gerente');
            const view = document.getElementById('manager-dashboard-view');

            const houseId = activeHouseId || 'moi';
            const house = housesData.find(h => h.id === houseId);

            const totalPessoas = houseReservas.reduce((acc, r) => acc + r.guestsCount, 0);
            const presentes = houseReservas.filter(r => r.status === 'presente').reduce((acc, r) => acc + r.guestsCount, 0);

            let listReservasHtml;
            if (houseReservas.length === 0) {
                listReservasHtml = `
                    <div class="group-list px-4 py-6 text-center t-sub c-2">

                    </div>`;
            } else {
                listReservasHtml = `<div class="group-list">${houseReservas.map(r => {
                    const acao = r.status === 'presente'
