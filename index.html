                        : `<button onclick="confirmPresence('${r.id}')" class="press btn-primary sm shrink-0" style="height: 36px; padding: 0 14px;">Validar entrada</button>`;
                    const quando = r.eventDate ? diaRelativo(new Date(r.eventDate)) : '';
                    return `
                        <div class="row" style="min-height: 64px;">
                            <span class="flex-1 min-w-0 flex flex-col gap-0.5">
                                <span class="t-callout font-semibold truncate">${escHtml(r.userName)}</span>
                                <span class="t-foot c-2 truncate">${rotuloPessoas(r.guestsCount)} · ${escHtml(r.userPhone)}</span>
                                ${quando ? `<span class="t-foot c-accent">${quando}</span>` : ''}
                            </span>
                            ${acao}
                        </div>`;
                }).join('')}</div>`;
            }

            const refPainel = agora();
            const opcoesDia = DIAS_TITULO.map((d, i) =>
                `<option value="${i}" ${i === refPainel.getDay() ? 'selected' : ''}>${d}</option>`).join('');

            view.innerHTML = `
                <div class="flex items-end justify-between gap-3">
                    <div class="min-w-0">
                        <p class="t-sub c-2">Painel da casa · portaria</p>
                        <h1 class="t-large truncate">${nomeCasa(house)}</h1>
                    </div>
                    <button onclick="exitManagerMode()" class="press btn-secondary shrink-0 mb-1">Sair</button>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div class="rounded-[18px] bg-[#1c1c1e] p-4 space-y-1">
                        <p class="t-foot c-2">Na lista</p>
                        <p class="t-large">${totalPessoas}</p>
                    </div>
                    <div class="rounded-[18px] bg-[#1c1c1e] p-4 space-y-1">
                        <p class="t-foot c-2">Já entraram</p>
                        <p class="t-large">${presentes}</p>
                    </div>
                </div>

                <section class="space-y-2.5">
                    <h2 class="t-title3">Nomes confirmados</h2>
                    ${listReservasHtml}
                </section>

                ${htmlEquipeFreela(houseId)}

                <!-- Relógio de demonstração: a reunião raramente acontece às 22h de sexta.
                     Sem isto, a demo abre com tudo fechado e o app parece vazio. -->
                <section class="space-y-2">
                    <p class="t-cap c-2 px-4">Simular horário</p>
                    <div class="group-list">
                        <label class="row justify-between">
                            <span class="t-body shrink-0">Dia</span>
                            <select id="sim-dia" class="bare t-body c-2 text-right flex-1 cursor-pointer" style="text-align-last: right;">${opcoesDia}</select>
                        </label>
                        <label class="row justify-between">
                            <span class="t-body shrink-0">Hora</span>
                            <input type="time" id="sim-hora" value="${pad2(refPainel.getHours())}:${pad2(refPainel.getMinutes())}" class="bare t-body c-2 text-right">
                        </label>
                        <button onclick="aplicarSimulacaoDoPainel()" class="press row"><span class="t-body c-accent">Aplicar horário</span></button>
                        ${simulacaoAtiva() ? `<button onclick="limparSimulacao(); openManagerDashboard();" class="press row"><span class="t-body c-accent">Voltar ao tempo real</span></button>` : ''}
                    </div>
                </section>
            `;
            lucide.createIcons();
        }

        function aplicarSimulacaoDoPainel() {
            const dia = parseInt(document.getElementById('sim-dia').value);
            const hora = document.getElementById('sim-hora').value || '21:00';
            aplicarSimulacao(dia, hora);
            showSuccessToast(`Simulando ${DIAS_TITULO[dia].toLowerCase()}, ${hora}`);
            openManagerDashboard();
        }

        function confirmPresence(id) {
            const rIndex = reservations.findIndex(r => r.id === id);
            if (rIndex !== -1) {
                reservations[rIndex].status = 'presente';
                localStorage.setItem('gyn_reservas', JSON.stringify(reservations));
                showSuccessToast("Entrada Validada");
                openManagerDashboard();
            }
        }

        /* ===================================================================
           MÓDULO FREELAS — "TRABALHE NA NOITE" (pós-MVP, ver base/07)
           Demonstra o fluxo completo: vaga → termos → aprovação → contrato
           assinado → check-in/out na portaria → nota fiscal → contabilidade.
           A demo cobre só MEI, que é a versão enxuta proposta no documento.
           =================================================================== */

        // A vaga não tem data digitada: herda a próxima ocorrência da noite
        // (progId), igual à programação. Assim a demo nunca mostra vaga vencida.
        const vagasData = [
            {
                id: "vaga-moi-garcom", houseId: "moi", progId: "moi-sexta",
                funcao: "Garçom", valor: 180, vagas: 4, antesMin: 60, depoisMin: 30,
                requisitos: ["Experiência mínima de 6 meses em salão", "Camisa preta lisa, calça preta e sapato fechado", "Maior de 18 anos"]
            },
            {
                id: "vaga-moi-bartender", houseId: "moi", progId: "moi-sexta",
                funcao: "Bartender", valor: 220, vagas: 2, antesMin: 90, depoisMin: 30,
                requisitos: ["Domínio de drinks clássicos e gin tônica", "Agilidade em bar de alto volume", "Maior de 18 anos"]
            },
            {
                id: "vaga-caju-garcom", houseId: "cajuina", progId: "caju-sexta",
                funcao: "Garçom", valor: 170, vagas: 2, antesMin: 60, depoisMin: 30,
                requisitos: ["Experiência em atendimento de mesa", "Traje preto", "Maior de 18 anos"]
            },
            {
                id: "vaga-fluxo-caixa", houseId: "fluxo", progId: "fluxo-sabado",
                funcao: "Caixa", valor: 170, vagas: 1, antesMin: 60, depoisMin: 45,
                requisitos: ["Experiência com maquininha e fechamento de caixa", "Maior de 18 anos"]
            },
            {
                id: "vaga-mosaic-recepcao", houseId: "mosaic", progId: "mosaic-sabado",
                funcao: "Recepção", valor: 160, vagas: 2, antesMin: 60, depoisMin: 0,
                requisitos: ["Boa comunicação", "Conferência de lista pelo app da portaria", "Maior de 18 anos"]
            },
            {
                id: "vaga-beat-apoio", houseId: "beatproibido", progId: "beat-main",
                funcao: "Apoio de bar", valor: 150, vagas: 3, antesMin: 60, depoisMin: 60,
                requisitos: ["Reposição de gelo, copos e bebidas", "Disposição para carregar peso", "Maior de 18 anos"]
            }
        ];

        // Perfil fictício do freela na demo. No produto, o CNPJ é validado por API pública.
        const freelaDemo = { nome: "Salvador", cnpj: "12.345.678/0001-90", modalidade: "MEI" };

        const ESCALA_ETAPAS = [
            { id: 'assinado', label: 'Assinado' },
            { id: 'em_turno', label: 'No turno' },
            { id: 'concluido', label: 'Concluído' },
            { id: 'nota_enviada', label: 'Nota enviada' }
        ];

        let escalas = [];
        try { escalas = JSON.parse(localStorage.getItem('gyn_escalas')) || []; } catch (e) { escalas = []; }
        let freelaFiltro = 'todas';
        let vagaModalState = { vagaId: null, etapa: 'termos', aceite: false };

        function salvarEscalas() {
            try { localStorage.setItem('gyn_escalas', JSON.stringify(escalas)); } catch (e) { /* demo segue sem persistir */ }
        }

        function fmtReais(v) {
            return `R$${v.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`;
        }

        function fmtDataHora(d) {
            return `${pad2(d.getDate())}/${pad2(d.getMonth() + 1)} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
        }

        // Soma dias úteis (sem feriados; suficiente para a demo).
        function somarDiasUteis(d, n) {
            const r = new Date(d);
            while (n > 0) {
                r.setDate(r.getDate() + 1);
                if (r.getDay() !== 0 && r.getDay() !== 6) n--;
            }
            return r;
        }

        function contextoVaga(vaga) {
            const house = housesData.find(h => h.id === vaga.houseId);
            const prog = house && house.programacao.find(p => p.id === vaga.progId);
            const occ = prog && ocorrencia(prog);
            if (!occ) return null;
            return {
                house, prog,
                inicio: new Date(occ.inicio.getTime() - vaga.antesMin * 60000),
                fim: new Date(occ.fim.getTime() + vaga.depoisMin * 60000)
            };
        }

        // A escala guarda as datas do momento da assinatura: o contrato é daquela
        // noite específica, mesmo que o relógio da demo ande depois.
        function contextoEscala(esc) {
            const vaga = vagasData.find(v => v.id === esc.vagaId);
            const house = housesData.find(h => h.id === vaga.houseId);
            return { vaga, house, inicio: new Date(esc.inicio), fim: new Date(esc.fim) };
        }

        function escalaDaVaga(vagaId) {
            return escalas.find(e => e.vagaId === vagaId);
        }

        function renderFreelas() {
            const view = document.getElementById('tab-freelas-view');
            const funcoes = ['todas', ...new Set(vagasData.map(v => v.funcao))];

            const chips = funcoes.map(f => {
                const ativo = f === freelaFiltro;
                return `<button onclick="filtrarFreelas('${f}')" aria-pressed="${ativo}" class="press shrink-0 h-9 px-4 rounded-full t-sub font-semibold ${ativo ? 'bg-white text-black' : 'bg-[#1c1c1e] text-white'}">${f === 'todas' ? 'Todas' : f}</button>`;
            }).join('');

            const vagasHtml = vagasData
                .filter(v => freelaFiltro === 'todas' || v.funcao === freelaFiltro)
                .map(v => ({ v, ctx: contextoVaga(v) }))
                .filter(x => x.ctx)
                .sort((a, b) => a.ctx.inicio - b.ctx.inicio)
                .map(({ v, ctx }) => {
                    const esc = escalaDaVaga(v.id);
                    const acao = esc
                        ? `<span class="t-sub font-semibold c-live flex items-center gap-1.5 shrink-0"><i data-lucide="check" class="w-4 h-4"></i>Escalado</span>`
                        : `<button onclick="openVagaModal('${v.id}')" class="press btn-primary sm shrink-0">Ver termos</button>`;
                    return `
                        <article class="rounded-[18px] bg-[#1c1c1e] p-4 space-y-4 ${esc ? 'opacity-60' : ''}">
                            <div class="flex items-center gap-3">
                                ${logoHtml(ctx.house, 'w-10 h-10')}
                                <div class="flex-1 min-w-0">
                                    <p class="t-headline">${v.funcao}</p>
                                    <p class="t-foot c-2 truncate">${nomeCasa(ctx.house)} · ${nomeNoite(ctx.prog)}</p>
                                </div>
                                <div class="text-right shrink-0">
                                    <p class="t-headline">${fmtReais(v.valor)}</p>
                                    <p class="t-foot c-2">por turno</p>
                                </div>
                            </div>
                            <div class="flex items-center justify-between gap-3">
                                <div class="min-w-0">
                                    <p class="t-sub">${diaRelativo(ctx.inicio)} · ${fmtHora(ctx.inicio)} – ${fmtHora(ctx.fim)}</p>
                                    <p class="t-foot c-2">${v.vagas} ${v.vagas === 1 ? 'vaga' : 'vagas'}</p>
                                </div>
                                ${acao}
                            </div>
                        </article>`;
                }).join('') || `<div class="group-list px-4 py-6 text-center t-sub c-2">Nenhuma vaga para essa função agora.</div>`;

            view.innerHTML = `
                <div class="space-y-3">
                    <button onclick="switchTab('hoje')" class="press flex items-center gap-0.5 h-9 -ml-1.5 t-body c-accent">
                        <i data-lucide="chevron-left" class="w-6 h-6"></i><span>Hoje</span>
                    </button>
                    <h1 class="t-large">Trabalhe na noite</h1>
                    <p class="t-sub c-2">Vagas de freela nas casas parceiras. Termos claros, contrato assinado no app e pagamento combinado antes do turno.</p>
                </div>

                <div class="group-list row" style="min-height: 72px;">
                    <span class="w-11 h-11 rounded-full bg-[#3a3a3c] flex items-center justify-center t-headline shrink-0">${freelaDemo.nome[0]}</span>
                    <span class="flex-1 min-w-0 flex flex-col gap-0.5">
                        <span class="t-headline">${freelaDemo.nome}</span>
                        <span class="t-foot c-2">${freelaDemo.modalidade} · ${freelaDemo.cnpj}</span>
                    </span>
                    <span class="chip-glass shrink-0" style="background: rgba(48,209,88,0.18); color: var(--live);"><i data-lucide="badge-check" class="w-3.5 h-3.5"></i>CNPJ validado</span>
                </div>

                ${htmlMinhasEscalas()}

                <section class="space-y-3">
                    <h2 class="t-title2">Vagas abertas</h2>
                    <div class="flex gap-2 overflow-x-auto no-scrollbar -mx-4 px-4">${chips}</div>
                    <div class="space-y-3">${vagasHtml}</div>
                </section>

                <p class="t-foot c-3 pb-2">
                    Nesta versão, a contratação é como Microempreendedor Individual (MEI): você emite a nota fiscal depois do turno e a contabilidade da casa confere. Segurança não é oferecida como freela, porque é atividade regulada.
                </p>
            `;
            lucide.createIcons();
        }

        function htmlMinhasEscalas() {
            if (escalas.length === 0) return '';
            const cards = escalas
                .map(e => ({ e, ctx: contextoEscala(e) }))
                .sort((a, b) => a.ctx.inicio - b.ctx.inicio)
                .map(({ e, ctx }) => {
                    const idx = ESCALA_ETAPAS.findIndex(s => s.id === e.status);
                    const etapas = ESCALA_ETAPAS.map((s, i) => `
                        <div class="flex-1 space-y-1.5">
                            <div class="h-1 rounded-full ${i <= idx ? 'bg-white' : 'bg-[#3a3a3c]'}"></div>
                            <p class="text-[11px] leading-4 ${i <= idx ? 'text-white font-semibold' : 'c-3'}">${s.label}</p>
                        </div>`).join('');

                    let rodape = '';
                    if (e.status === 'assinado') {
                        rodape = `<p class="t-sub c-2">Mostre seu QR na portaria para registrar a entrada no turno.</p>`;
                    } else if (e.status === 'em_turno') {
                        rodape = `<p class="t-sub c-2">Entrada registrada às ${fmtHora(new Date(e.checkinEm))}. A saída é registrada na portaria.</p>`;
                    } else if (e.status === 'concluido') {
                        rodape = `
                            <div class="flex items-center justify-between gap-3">
                                <p class="t-sub c-2">Turno fechado. Emita a nota de ${fmtReais(ctx.vaga.valor)}.</p>
                                <button onclick="enviarNotaFiscal('${e.id}')" class="press btn-primary sm shrink-0">Enviar nota</button>
                            </div>`;
                    } else if (e.status === 'nota_enviada') {
                        rodape = `<p class="t-sub c-live">Nota recebida. Pix de ${fmtReais(ctx.vaga.valor)} previsto até ${diaRelativo(new Date(e.pagamentoAte)).toLowerCase()}.</p>`;
                    }

                    return `
                        <article class="rounded-[18px] bg-[#1c1c1e] p-4 space-y-4">
                            <div class="flex items-center gap-3">
                                ${logoHtml(ctx.house, 'w-10 h-10')}
                                <div class="flex-1 min-w-0">
                                    <p class="t-headline truncate">${ctx.vaga.funcao} · ${nomeCasa(ctx.house)}</p>
                                    <p class="t-foot c-2">${diaRelativo(ctx.inicio)} · ${fmtHora(ctx.inicio)} – ${fmtHora(ctx.fim)}</p>
                                </div>
                                <button onclick="openVagaModal('${ctx.vaga.id}', 'assinado')" class="press btn-secondary shrink-0">Contrato</button>
                            </div>
                            <div class="flex gap-1.5">${etapas}</div>
                            ${rodape}
                        </article>`;
                }).join('');

            return `
                <section class="space-y-3">
                    <h2 class="t-title2">Minhas escalas</h2>
                    ${cards}
                </section>`;
        }

        function filtrarFreelas(funcao) {
            freelaFiltro = funcao;
            renderFreelas();
        }

        function openVagaModal(vagaId, etapa) {
            vagaModalState = { vagaId, etapa: etapa || 'termos', aceite: false };
            renderVagaModal();
            document.getElementById('vaga-modal').classList.remove('hidden');
        }

        function closeVagaModal() {
            document.getElementById('vaga-modal').classList.add('hidden');
            if (currentTab === 'freelas') renderFreelas();
        }

        function textoContrato(vaga, house, inicio, fim) {
            return [
                `<strong>Contratante:</strong> ${nomeCasa(house)}. <strong>Contratado:</strong> ${freelaDemo.nome}, ${freelaDemo.modalidade}, CNPJ ${freelaDemo.cnpj}.`,
                `<strong>1. Objeto.</strong> Prestação de serviço de ${vaga.funcao.toLowerCase()} em evento único, sem exclusividade.`,
                `<strong>2. Data e horário.</strong> ${DIAS_LONGO[inicio.getDay()].toLowerCase()}, ${pad2(inicio.getDate())}/${pad2(inicio.getMonth() + 1)}/${inicio.getFullYear()}, das ${fmtHora(inicio)} às ${fmtHora(fim)}, com registro de entrada e saída na portaria.`,
                `<strong>3. Remuneração.</strong> ${fmtReais(vaga.valor)} pelo turno, pagos via Pix em até 2 dias úteis após o recebimento da nota fiscal.`,
                `<strong>4. Tributos.</strong> O contratado emite a Nota Fiscal de Serviço eletrônica e recolhe os próprios tributos como MEI.`,
                `<strong>5. Cancelamento.</strong> Sem ônus para as partes até 24h antes do início. Depois disso, conforme política da casa.`,
                `<strong>6. Autonomia.</strong> O contratado define como executa o serviço dentro dos padrões de atendimento informados nos termos.`
            ].map(p => `<p>${p}</p>`).join('');
        }

        function renderVagaModal() {
            const { vagaId, etapa, aceite } = vagaModalState;
            const vaga = vagasData.find(v => v.id === vagaId);
            const esc = escalaDaVaga(vagaId);
            const ctx = esc ? contextoEscala(esc) : contextoVaga(vaga);
            const house = ctx.house;
            const el = document.getElementById('vaga-modal-content');

            const cabecalho = `
                <div class="flex items-center gap-3 pr-10">
                    ${logoHtml(house, 'w-11 h-11')}
                    <div class="min-w-0">
                        <h3 class="t-headline">${vaga.funcao}</h3>
                        <p class="t-foot c-2 truncate">${nomeCasa(house)}</p>
                    </div>
                </div>`;

            const caixaContrato = (titulo_) => `
                <div class="rounded-[14px] bg-[#2c2c2e] p-4 max-h-56 overflow-y-auto no-scrollbar space-y-2.5 t-foot text-[#ebebf5]">
                    ${titulo_ ? `<p class="t-cap c-2">${titulo_}</p>` : ''}
                    ${textoContrato(vaga, house, ctx.inicio, ctx.fim)}
                </div>`;

            if (etapa === 'termos') {
                const pagamentoAte = somarDiasUteis(ctx.fim, 2);
                el.innerHTML = `
                    <div class="space-y-6">
                        ${cabecalho}
                        <div class="group-list on-fill">
                            ${[
                                ['Data', `${diaRelativo(ctx.inicio)}, ${pad2(ctx.inicio.getDate())}/${pad2(ctx.inicio.getMonth() + 1)}`],
                                ['Turno', `${fmtHora(ctx.inicio)} – ${fmtHora(ctx.fim)}`],
                                ['Valor do turno', fmtReais(vaga.valor)],
                                ['Pagamento', `Pix até ${pad2(pagamentoAte.getDate())}/${pad2(pagamentoAte.getMonth() + 1)}`]
                            ].map(([k, v]) => `
                                <div class="row justify-between">
                                    <span class="t-body">${k}</span>
                                    <span class="t-body font-semibold text-right">${v}</span>
                                </div>`).join('')}
                        </div>
                        <div class="space-y-2">
                            <p class="t-cap c-2 px-4">Requisitos</p>
                            <div class="group-list on-fill">
                                ${vaga.requisitos.map(r => `
                                    <div class="row" style="--inset: 48px;">
                                        <i data-lucide="check" class="w-5 h-5 c-live shrink-0"></i>
                                        <span class="t-sub">${r}</span>
                                    </div>`).join('')}
                            </div>
                        </div>
                        <div class="space-y-1.5 px-4 t-foot c-2">
                            <p><span class="text-white font-semibold">Tributos:</span> contratação como MEI, sem retenção na fonte. Você emite a nota fiscal depois do turno.</p>
                            <p><span class="text-white font-semibold">Cancelamento:</span> sem custo até 24h antes do início.</p>
                        </div>
                        <button onclick="candidatarVaga()" class="press btn-primary w-full" style="height: 54px; border-radius: 27px;">Quero essa vaga</button>
                    </div>`;
            } else if (etapa === 'aprovando') {
                el.innerHTML = `
                    <div class="space-y-6">
                        ${cabecalho}
                        <div class="flex flex-col items-center gap-4 py-12 text-center">
                            <div class="w-9 h-9 border-[3px] border-[#3a3a3c] border-t-white rounded-full animate-spin"></div>
                            <p class="t-sub c-2">Candidatura enviada.<br>Aguardando a aprovação de ${nomeCasa(house)}…</p>
                        </div>
                    </div>`;
            } else if (etapa === 'contrato') {
                el.innerHTML = `
                    <div class="space-y-5">
                        ${cabecalho}
                        <p class="flex items-center gap-2 t-sub font-semibold c-live">
                            <i data-lucide="badge-check" class="w-5 h-5"></i><span>A casa aprovou sua candidatura</span>
                        </p>
                        ${caixaContrato('Contrato de prestação de serviço')}
                        <label class="group-list on-fill row cursor-pointer">
                            <input type="checkbox" ${aceite ? 'checked' : ''} onchange="vagaModalState.aceite = this.checked; renderVagaModal();" class="w-5 h-5 shrink-0 accent-[#30d158]">
                            <span class="t-sub">Li o contrato e concordo com os termos.</span>
                        </label>
                        <button onclick="assinarContrato()" ${aceite ? '' : 'disabled'} class="press btn-primary w-full" style="height: 54px; border-radius: 27px;">Assinar contrato</button>
                        <p class="t-foot c-3 text-center">Assinatura eletrônica com validade jurídica (Lei 14.063/2020).</p>
                    </div>`;
            } else if (etapa === 'assinado') {
                el.innerHTML = `
                    <div class="space-y-5">
                        ${cabecalho}
                        <div class="flex flex-col items-center text-center gap-2 py-2">
                            <span class="w-14 h-14 rounded-full flex items-center justify-center c-live" style="background: rgba(48,209,88,0.18);"><i data-lucide="file-check" class="w-6 h-6"></i></span>
                            <p class="t-title3 pt-1">Contrato assinado</p>
                            <p class="mono t-foot c-3">${fmtDataHora(new Date(esc.assinadoEm))} · código ${esc.codigo}</p>
                        </div>
                        ${caixaContrato('')}
                        <button onclick="closeVagaModal()" class="press btn-primary w-full" style="height: 54px; border-radius: 27px;">Ver minhas escalas</button>
                    </div>`;
            }
            lucide.createIcons();
        }

        // Na demo a casa aprova sozinha em 1,5s; no produto é o gerente no painel.
        function candidatarVaga() {
            vagaModalState.etapa = 'aprovando';
            renderVagaModal();
            setTimeout(() => {
                if (vagaModalState.etapa !== 'aprovando') return;
                vagaModalState.etapa = 'contrato';
                renderVagaModal();
            }, 1500);
        }

        function assinarContrato() {
            const vaga = vagasData.find(v => v.id === vagaModalState.vagaId);
            const ctx = contextoVaga(vaga);
            escalas.push({
                id: 'esc-' + Date.now(),
                vagaId: vaga.id,
                status: 'assinado',
                inicio: ctx.inicio.toISOString(),
                fim: ctx.fim.toISOString(),
                assinadoEm: agora().toISOString(),
                codigo: Math.random().toString(16).slice(2, 10).toUpperCase()
            });
            salvarEscalas();
            vagaModalState.etapa = 'assinado';
            renderVagaModal();
            showSuccessToast("Contrato assinado");
        }

        function enviarNotaFiscal(escId) {
            const esc = escalas.find(e => e.id === escId);
            if (!esc) return;
            esc.status = 'nota_enviada';
            esc.pagamentoAte = somarDiasUteis(agora(), 2).toISOString();
            salvarEscalas();
            showSuccessToast("Nota fiscal enviada");
            renderFreelas();
        }

        // --- Lado da casa: equipe freela no painel da portaria ---

        function htmlEquipeFreela(houseId) {
            const daCasa = escalas
                .map(e => ({ e, ctx: contextoEscala(e) }))
                .filter(x => x.ctx.house.id === houseId)
                .sort((a, b) => a.ctx.inicio - b.ctx.inicio);
            const publicadas = vagasData.filter(v => v.houseId === houseId).length;

            if (daCasa.length === 0) {
                return `
                    <section class="space-y-2.5">
                        <h2 class="t-title3">Equipe freela</h2>
                        <div class="group-list px-4 py-6 text-center space-y-2">
                            <p class="t-sub c-2">Nenhum freela escalado. ${publicadas} ${publicadas === 1 ? 'vaga publicada' : 'vagas publicadas'}.</p>
                            ${publicadas ? `<button onclick="switchTab('freelas')" class="press t-sub c-accent">Ver como o freela vê</button>` : ''}
                        </div>
                    </section>`;
            }

            const linhas = daCasa.map(({ e, ctx }) => {
                let acao;
                if (e.status === 'assinado') {
                    acao = `<button onclick="registrarTurno('${e.id}', 'entrada')" class="press btn-primary sm shrink-0" style="height: 36px; padding: 0 14px;">Registrar entrada</button>`;
                } else if (e.status === 'em_turno') {
                    acao = `<button onclick="registrarTurno('${e.id}', 'saida')" class="press btn-secondary shrink-0">Registrar saída</button>`;
                } else {
                    acao = `<span class="t-foot shrink-0 ${e.status === 'nota_enviada' ? 'c-live' : 'c-accent'}">${e.status === 'nota_enviada' ? 'Nota recebida' : 'Aguardando nota'}</span>`;
                }
                return `
                    <div class="row" style="min-height: 64px;">
                        <span class="flex-1 min-w-0 flex flex-col gap-0.5">
                            <span class="t-callout font-semibold">${freelaDemo.nome}</span>
                            <span class="t-foot c-2 truncate">${ctx.vaga.funcao} · ${diaRelativo(ctx.inicio)} ${fmtHora(ctx.inicio)} – ${fmtHora(ctx.fim)}</span>
                            <span class="mono t-foot c-3">Contrato ${e.codigo}</span>
                        </span>
                        ${acao}
                    </div>`;
            }).join('');

            const fechados = daCasa.filter(x => x.e.status === 'concluido' || x.e.status === 'nota_enviada');
            const bruto = fechados.reduce((acc, x) => acc + x.ctx.vaga.valor, 0);
            const notas = fechados.filter(x => x.e.status === 'nota_enviada').length;

            const fechamento = fechados.length === 0 ? '' : `
                <div class="space-y-2 pt-3">
                    <p class="t-cap c-2 px-4">Fechamento para a contabilidade</p>
                    <div class="group-list">
                        <div class="row justify-between"><span class="t-sub">Turnos fechados</span><span class="t-sub font-semibold">${fechados.length}</span></div>
                        <div class="row justify-between"><span class="t-sub">Valor bruto</span><span class="t-sub font-semibold">${fmtReais(bruto)}</span></div>
                        <div class="row justify-between"><span class="t-sub">Retenções (MEI)</span><span class="t-sub font-semibold">${fmtReais(0)}</span></div>
                        <div class="row justify-between"><span class="t-sub">Notas fiscais recebidas</span>
                            <span class="t-sub font-semibold ${notas === fechados.length ? 'c-live' : 'c-accent'}">${notas}/${fechados.length}</span></div>
                        <button onclick="showSuccessToast('Planilha enviada à contabilidade')" class="press row">
                            <i data-lucide="file-spreadsheet" class="w-5 h-5 c-accent"></i><span class="t-body c-accent">Exportar para a contabilidade</span>
                        </button>
                    </div>
                </div>`;

            return `
                <section class="space-y-2.5">
                    <h2 class="t-title3">Equipe freela</h2>
                    <div class="group-list">${linhas}</div>
                    ${fechamento}
                </section>`;
        }

        function registrarTurno(escId, tipo) {
            const esc = escalas.find(e => e.id === escId);
            if (!esc) return;
            if (tipo === 'entrada') {
                esc.status = 'em_turno';
                esc.checkinEm = agora().toISOString();
                showSuccessToast("Entrada do freela registrada");
            } else {
                esc.status = 'concluido';
                esc.checkoutEm = agora().toISOString();
                showSuccessToast("Turno fechado");
            }
            salvarEscalas();
            openManagerDashboard();
        }

        // --- VIBES: FEED DE VÍDEOS (TikTok de Baladas) ---
        function renderVibes() {
            const container = document.getElementById('vibes-scroll-container');
            if (!container) return;

            container.innerHTML = '';
            const ref = agora();

            // Filtra as casas do banco de dados que possuem um vídeo associado
            const videoHouses = housesData.filter(h => h.videoUrl);

            videoHouses.forEach((house, index) => {
                const stVibe = noiteEmDestaque(house, ref);          // a noite que está rolando ou a próxima
                const prog = stVibe ? stVibe.prog : house.programacao[0];
                if (!prog) return;

                const card = document.createElement('div');
                card.className = "snap-start w-full h-full relative bg-black flex items-center justify-center overflow-hidden vibes-card";
                card.setAttribute('data-house', house.id);
                card.setAttribute('data-event', prog.id);

                let quando = '';
                if (stVibe) {
                    quando = stVibe.estado === 'agora'
                        ? `<span class="dot pulse"></span><span>Rolando agora · até ${fmtHora(stVibe.fim)}</span>`
                        : `<span>${diaRelativo(stVibe.inicio, ref)} · ${fmtHora(stVibe.inicio)} – ${fmtHora(stVibe.fim)}</span>`;
                }

                card.innerHTML = `
                    <video class="absolute inset-0 w-full h-full object-cover"
                           loop muted playsinline webkit-playsinline disablepictureinpicture
                           preload="${index === 0 ? 'auto' : 'none'}"
                           poster="logo-casas/${house.id}-poster.jpg"
                           src="logo-casas/${house.id}.mp4"></video>

                    <div class="absolute inset-0 pointer-events-none" style="background: linear-gradient(180deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 45%, rgba(0,0,0,0.92) 100%);"></div>

                    <div class="absolute inset-x-0 z-40 px-4 flex items-center justify-between" style="top: calc(env(safe-area-inset-top) + 10px);">
                        <span class="t-headline">${index === 0 ? 'Vibes' : ''}</span>
                        <button onclick="toggleVibesAudio(event)" aria-label="Ligar ou desligar o som" class="press glass icon-glass sound-toggle-btn">
                            <i data-lucide="volume-x" class="w-[18px] h-[18px] mute-icon ${isVibesMuted ? '' : 'hidden'}"></i>
                            <i data-lucide="volume-2" class="w-[18px] h-[18px] unmute-icon ${isVibesMuted ? 'hidden' : ''}"></i>
                        </button>
                    </div>

                    <div class="absolute vibes-safe-bottom inset-x-0 px-5 z-40 flex flex-col gap-4">
                        <div class="flex flex-col gap-2">
                            <div class="flex items-center gap-2 min-w-0">
                                ${logoHtml(house, 'w-7 h-7')}
                                <span class="t-sub font-semibold truncate">${nomeCasa(house)}</span>
                                <span class="t-foot text-white/60 truncate">· ${house.especialidade}</span>
                            </div>
                            <h3 class="t-title1">${nomeNoite(prog)}</h3>
                            <p class="t-sub text-white/80 max-w-[90%]">${prog.descricao}</p>
                            ${prog.djs ? `
                            <p class="flex items-center gap-1.5 t-foot text-white/70 min-w-0">
                                <i data-lucide="music" class="w-3.5 h-3.5 shrink-0"></i>
                                <span class="truncate">${titulo(prog.djs)}</span>
                            </p>` : ''}
                        </div>
                        <div class="flex items-center justify-between gap-3">
                            <span class="t-foot text-white/80 flex items-center gap-2 min-w-0">${quando}</span>
                            <button onclick="openHouseDetail('${house.id}', '${prog.id}')" class="press btn-primary sm shrink-0">Ver noite</button>
                        </div>
                    </div>
                    <div class="absolute bottom-0 left-0 right-0 h-[2px] bg-white/20">
                        <div class="h-full bg-white transition-all duration-100 ease-linear vibes-progress-bar" style="width: 0%;"></div>
                    </div>
                `;
                container.appendChild(card);
            });
            lucide.createIcons();
        }
    </script>
</body>
</html>
