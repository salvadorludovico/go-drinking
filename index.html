            } catch (e) { /* demo segue sem persistir */ }

            closeReservationModal();
            showSuccessToast(GARANTIAS[tipo].feito);
            ingressosFiltro = 'proximos';
            updateReservasUI();

            setTimeout(() => {
                switchTab('ingressos');
            }, 350);
        }

        // Aviso rápido no topo. tipo: 'sucesso' | 'erro' | 'neutro'; acao: { rotulo, fn } opcional (fica 5 s em vez de 2 s).
        function mostrarToast(msg, { tipo = 'sucesso', acao = null } = {}) {
            const toast = document.getElementById('toast-success');
            document.getElementById('toast-message').innerText = msg;
            toast.querySelectorAll('[data-toast-tipo]').forEach(i => i.classList.toggle('hidden', i.getAttribute('data-toast-tipo') !== tipo));
            const botao = document.getElementById('toast-acao');
            botao.textContent = acao ? acao.rotulo : '';
            botao.classList.toggle('hidden', !acao);
            botao.onclick = acao ? () => { clearTimeout(mostrarToast.timer); toast.classList.add('hidden'); acao.fn(); } : null;
            toast.classList.remove('hidden');
            clearTimeout(mostrarToast.timer);
            mostrarToast.timer = setTimeout(() => toast.classList.add('hidden'), acao ? 5000 : 2000);
        }

        function showSuccessToast(msg) {
            mostrarToast(msg, { tipo: 'sucesso' });
        }

        // Botão em voo: desabilita, mostra spinner + texto e devolve a função que restaura.
        function emVoo(botao, texto) {
            const original = botao.innerHTML;
            botao.disabled = true;
            botao.setAttribute('aria-busy', 'true');
            botao.innerHTML = `<span class="spinner" aria-hidden="true"></span>${texto}`;
            return () => {
                botao.innerHTML = original;
                botao.disabled = false;
                botao.removeAttribute('aria-busy');
            };
        }

        function aguardar(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // Vazio de tela inteira: círculo com ícone, título, texto e ação opcional.
        function vazioHtml({ icone, titulo, texto, acaoHtml = '' }) {
            return `
                    <div class="py-8 flex flex-col items-center text-center gap-2">
                        <span class="w-14 h-14 rounded-full bg-[var(--fill-1)] flex items-center justify-center mb-2"><i data-lucide="${icone}" class="w-6 h-6 c-2"></i></span>
                        <p class="t-headline">${titulo}</p>
                        <p class="t-sub c-2 max-w-[280px]">${texto}</p>
                        ${acaoHtml}
                    </div>`;
        }

        // Vazio dentro de uma seção: caixa agrupada com texto; título e ação opcionais.
        function vazioCompactoHtml(texto, { titulo = '', acaoHtml = '' } = {}) {
            return `
                    <div class="group-list px-4 py-8 ${titulo ? 'space-y-1' : 'space-y-2'} text-center">
                        ${titulo ? `<p class="t-headline">${titulo}</p>` : ''}
                        <p class="t-sub c-2">${texto}</p>
                        ${acaoHtml}
                    </div>`;
        }

        /* ===================================================================
           INGRESSOS
           =================================================================== */

        let ingressosFiltro = 'proximos';

        function setIngressosFiltro(f) {
            ingressosFiltro = f;
            updateReservasUI();
        }

        function janelaDaReserva(r) {
            const house = housesData.find(h => h.id === r.houseId);
            const prog = house && house.programacao.find(p => p.id === r.eventId);
            if (!r.eventDate) return { house, prog, occ: null };
            const inicio = new Date(r.eventDate);
            const fim = new Date(inicio.getTime() + (prog ? duracaoMin(prog) : 360) * 60000);
            return { house, prog, occ: { inicio, fim } };
        }

        function reservaPassou(r, ref) {
            const { occ } = janelaDaReserva(r);
            return r.status === 'cancelada' || (occ && ref >= occ.fim);
        }

        // O QR carrega a reserva inteira, não só o id: o celular da portaria não
        // tem o localStorage do cliente, então precisa ler nome, casa e noite do próprio código.
        const PREFIXO_INGRESSO = 'GD1?';

        function payloadIngresso(r) {
            return PREFIXO_INGRESSO + new URLSearchParams({
                id: r.id, h: r.houseId, e: r.eventId, d: r.eventDate || '', n: r.userName, g: r.guestsCount, t: tipoDaReserva(r)
            }).toString();
        }

        function lerPayloadIngresso(texto) {
            if (!texto || !texto.startsWith(PREFIXO_INGRESSO)) return null;
            const p = new URLSearchParams(texto.slice(PREFIXO_INGRESSO.length));
            if (!p.get('id') || !p.get('h')) return null;
            return {
                id: p.get('id'), houseId: p.get('h'), eventId: p.get('e'),
                eventDate: p.get('d') || null, userName: p.get('n') || 'Sem nome',
                guestsCount: parseInt(p.get('g'), 10) || 1,
                tipo: p.get('t') === 'mesa' ? 'mesa' : 'lista'
            };
        }

        function qrSvg(texto, tamanho) {
            if (typeof qrcode === 'undefined') return ''; // sem rede: fica o código escrito abaixo
            const qr = qrcode(0, 'L');
            qr.addData(texto);
            qr.make();
            const n = qr.getModuleCount();
            let rects = '';
            for (let r = 0; r < n; r++) {
                for (let c = 0; c < n; c++) {
                    if (qr.isDark(r, c)) rects += `<rect x="${c}" y="${r}" width="1" height="1"/>`;
                }
            }
            const t = tamanho || 180;
            return `<svg viewBox="0 0 ${n} ${n}" width="${t}" height="${t}" shape-rendering="crispEdges" role="img" aria-label="QR code da entrada"><rect width="${n}" height="${n}" fill="#fff"/><g fill="#000">${rects}</g></svg>`;
        }

        function codigoPortaria(r) {
            const d = r.id.replace(/\D/g, '').slice(-8).padStart(8, '0');
            return `GD-${d.slice(0, 4)}-${d.slice(4)}`;
        }

        function ingressoHtml(r, ref) {
            const { house, prog, occ } = janelaDaReserva(r);
            const passou = reservaPassou(r, ref);
            const cancelada = r.status === 'cancelada';

            let chip;
            if (cancelada) chip = `<span class="chip-glass bg-white/10 c-2">Cancelado</span>`;
            else if (r.status === 'presente') chip = `<span class="chip-glass chip-info"><i data-lucide="scan-line" class="w-3 h-3"></i>Entrada validada</span>`;
            else if (passou) chip = `<span class="chip-glass bg-white/10 c-2">Encerrado</span>`;
            else chip = `<span class="chip-glass chip-live"><i data-lucide="check" class="w-3 h-3"></i>Confirmado</span>`;

            const quando = occ ? `${diaRelativo(occ.inicio, ref)}, ${pad2(occ.inicio.getDate())}/${pad2(occ.inicio.getMonth() + 1)}` : r.eventDay;
            const entrada = prog && occ ? infoEntrada(prog, occ, occ.inicio).curto : '—';

            let aviso = '';
            if (!passou && prog && occ) {
                if (ref < occ.inicio) {
                    aviso = `Começa ${diaRelativo(occ.inicio, ref).toLowerCase()} às ${fmtHora(occ.inicio)}`;
                } else {
                    const ent = infoEntrada(prog, occ, ref);
                    if (ent.gratisAte && ref < ent.gratisAte) aviso = `Faltam ${fmtDuracao(ent.restam)} para o free acabar`;
                }
            }

            const mesa = tipoDaReserva(r) === 'mesa';
            const nomeEvento = prog ? nomeNoite(prog) : titulo(r.eventName);
            const casa = house ? nomeCasa(house) : titulo(r.houseName);

            return `
                <article class="card overflow-hidden ${passou ? 'opacity-60' : ''}">
                    <div class="relative h-24">
                        ${house ? midiaHtml(house, 'absolute inset-0') : ''}
                        <div class="absolute inset-0 bg-black/55"></div>
                        <div class="absolute inset-0 px-4 flex items-center justify-between gap-3">
                            <span class="flex items-center gap-3 min-w-0">
                                ${house ? logoHtml(house, 'w-9 h-9') : ''}
                                <span class="t-headline truncate">${casa}</span>
                            </span>
                            ${chip}
                        </div>
                    </div>
                    <div class="px-4 pt-4 space-y-4">
                        <h3 class="t-title2">${nomeEvento}</h3>
                        <div class="grid grid-cols-3 gap-2">
                            <div class="min-w-0"><p class="t-cap c-2">DATA</p><p class="t-sub font-semibold truncate">${quando}</p></div>
                            <div class="min-w-0"><p class="t-cap c-2">${mesa ? 'MESA' : 'LISTA'}</p><p class="t-sub font-semibold truncate">${mesa ? rotuloPessoas(r.guestsCount) : 'Individual'}</p></div>
                            <div class="min-w-0"><p class="t-cap c-2">ENTRADA</p><p class="t-sub font-semibold truncate">${entrada}</p></div>
                        </div>
                        <p class="t-foot c-2">Em nome de ${escHtml(r.userName)}</p>
                    </div>
                    ${cancelada ? '<div class="h-4"></div>' : `
                    <div class="mt-4 border-t-[1.5px] border-dashed border-[#3a3a3c]"></div>
                    <div class="px-4 pt-5 pb-4 flex flex-col items-center gap-3">
                        <div class="p-3 rounded-[14px] bg-white">${qrSvg(payloadIngresso(r))}</div>
                        <p class="t-foot c-2">Mostre na portaria · ${mesa ? `vale para ${rotuloPessoas(r.guestsCount)}` : 'vale uma entrada'}</p>
                        <p class="mono t-foot c-3 tracking-widest">${codigoPortaria(r)}</p>
                    </div>`}
                    ${aviso ? `
                    <div class="mx-4 mb-4 rounded-[14px] bg-[#2c2c2e] px-4 py-3 flex items-center gap-3">
                        <i data-lucide="clock" class="w-5 h-5 c-accent shrink-0"></i>
                        <span class="t-sub">${aviso}</span>
                    </div>` : ''}
                    ${!passou ? `
                    <div class="border-t-[0.5px] border-white/10">
                        <button onclick="cancelReserva('${r.id}')" data-cancelar="${r.id}" class="press w-full h-12 t-sub c-danger flex items-center justify-center gap-2">${GARANTIAS[tipoDaReserva(r)].desfazer}</button>
                    </div>` : ''}
                </article>`;
        }

        function updateReservasUI() {
            const ref = agora();
            const proximos = reservations.filter(r => !reservaPassou(r, ref))
                .sort((a, b) => new Date(a.eventDate) - new Date(b.eventDate));
            const passados = reservations.filter(r => reservaPassou(r, ref))
                .sort((a, b) => new Date(b.eventDate) - new Date(a.eventDate));

            document.getElementById('reservas-badge').classList.toggle('hidden', !sessao.logado || proximos.length === 0);

            const lista = document.getElementById('ingressos-lista');
            if (!lista) return;

            // Os passes são da conta: visitante não vê os de quem saiu.
            if (!sessao.logado) {
                lista.innerHTML = vazioHtml({
                    icone: 'ticket',
                    titulo: 'Seus ingressos ficam aqui',
                    texto: 'Entre com seu celular para ver as listas e mesas que você garantiu, com o QR da portaria.',
                    acaoHtml: `<button onclick="abrirLogin()" class="press btn-primary sm mt-3">Entrar com celular</button>`
                });
                lucide.createIcons();
                return;
            }
            document.getElementById('seg-proximos').setAttribute('aria-selected', ingressosFiltro === 'proximos');
            document.getElementById('seg-passados').setAttribute('aria-selected', ingressosFiltro === 'passados');

            const itens = ingressosFiltro === 'proximos' ? proximos : passados;
            if (itens.length) {
                lista.innerHTML = itens.map(r => ingressoHtml(r, ref)).join('');
            } else if (ingressosFiltro === 'proximos') {
                const noites = noitesDaSemana(ref);
                const agoraL = noites.filter(x => x.st.estado === 'agora');
                const sugestao = escolherDestaque(agoraL.length ? agoraL : noites.filter(x => x.st.estado === 'hoje'), ref);
                lista.innerHTML = `${vazioHtml({
                    icone: 'ticket',
                    titulo: 'Nenhum ingresso por enquanto',
                    texto: 'Quando você entrar numa lista, o ingresso aparece aqui com o QR da portaria.'
                })}
                    ${sugestao ? `
                    <p class="t-cap c-2 px-4 pt-4">Rolando hoje</p>
                    <button onclick="openHouseDetail('${sugestao.house.id}', '${sugestao.st.prog.id}')" class="press group-list row" style="min-height: 76px;">
                        ${midiaHtml(sugestao.house, 'w-[52px] h-[52px] rounded-xl shrink-0', 'thumb')}
                        <span class="flex-1 min-w-0 flex flex-col gap-0.5">
                            <span class="t-callout font-semibold truncate">${nomeNoite(sugestao.st.prog)}</span>
                            <span class="t-foot c-2 truncate">${nomeCasa(sugestao.house)} · ${infoEntrada(sugestao.st.prog, sugestao.st.occ, ref).principal}</span>
                        </span>
                        <i data-lucide="chevron-right" class="w-4 h-4 chevron shrink-0"></i>
                    </button>` : ''}`;
            } else {
                lista.innerHTML = `<p class="t-sub c-2 text-center py-8">Nenhuma noite passada ainda.</p>`;
            }
            lucide.createIcons();
        }

        async function cancelReserva(id) {
            const g = GARANTIAS[tipoDaReserva(reservations.find(r => r.id === id))];
            const ok = await confirmar({ titulo: g.pergunta, acao: g.confirma, perigo: true });
            if (!ok) return;
            const botao = document.querySelector(`[data-cancelar="${id}"]`);
            if (botao) {
                const restaurar = emVoo(botao, g.desfazendo);
                await aguardar(600);
                restaurar();
            }
            const rIndex = reservations.findIndex(r => r.id === id);
            if (rIndex !== -1) {
                reservations[rIndex].status = 'cancelada';
                try { localStorage.setItem('gyn_reservas', JSON.stringify(reservations)); } catch (e) { /* demo */ }
                updateReservasUI();
                showSuccessToast(g.desfeito);
            }
        }

        /* ===================================================================
           FUNDO TRAVADO E TECLADO
           Com qualquer sheet aberta a página de trás não rola nem quica.
           As sheets se empilham (login sobre a reserva, escolha sobre
           qualquer uma): guardamos quais estão abertas e só destravamos
           quando a última fecha. Vibes e Onboarding têm a trava deles.
           =================================================================== */

        const sheetsAbertas = new Set();
        let fundoY = 0;

        function travarFundo(id) {
            if (sheetsAbertas.has(id)) return;
            sheetsAbertas.add(id);
            if (sheetsAbertas.size > 1) return;
            fundoY = window.scrollY;
            const b = document.body.style;
            b.position = 'fixed';
            b.top = `-${fundoY}px`;
            b.width = '100%';
            ajustarTeclado();
        }

        function destravarFundo(id) {
            if (!sheetsAbertas.delete(id) || sheetsAbertas.size) return;
            const b = document.body.style;
            b.position = '';
            b.top = '';
            b.width = '';
            window.scrollTo(0, fundoY);
            ajustarTeclado();
        }

        // No iOS o teclado não encolhe a página: a sheet sobe o quanto ele ocupa.
        function ajustarTeclado() {
            const vv = window.visualViewport;
            if (!vv) return;
            // Com zoom de pinça o viewport visual também encolhe; aí não é teclado.
            const ocupado = sheetsAbertas.size && vv.scale <= 1.01 ? Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop)) : 0;
            document.documentElement.style.setProperty('--teclado', `${ocupado}px`);
        }

        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', ajustarTeclado);
            window.visualViewport.addEventListener('scroll', ajustarTeclado);
        }

        /* ===================================================================
           CONFIRMAR E ESCOLHER
           Nada de confirm() nem <select> do sistema: os dois sobem neste
           painel, no visual do app. confirmar() resolve true/false;
           escolher() resolve o valor escolhido ou null.
           =================================================================== */

        let resolverEscolha = null;
        const SEP_TITULO = 'style="border-bottom: 0.5px solid var(--sep);"';

        function abrirEscolha(html) {
            if (resolverEscolha) resolverEscolha(null);
            document.getElementById('escolha-corpo').innerHTML = html;
            document.getElementById('escolha-sheet').classList.remove('hidden');
            travarFundo('escolha');
            lucide.createIcons();
            return new Promise(r => { resolverEscolha = r; });
        }

        function fecharEscolha(valor) {
            const sheet = document.getElementById('escolha-sheet');
            if (sheet.classList.contains('hidden')) return false;
            sheet.classList.add('hidden');
            destravarFundo('escolha');
            const r = resolverEscolha;
            resolverEscolha = null;
            if (r) r(valor);
            return true;
        }

        function confirmar({ titulo, mensagem = '', acao = 'Confirmar', perigo = false }) {
            return abrirEscolha(`
                <div class="px-4 pt-4 pb-3 text-center" ${SEP_TITULO}>
                    <p id="escolha-titulo" class="t-foot c-2 font-semibold">${titulo}</p>
                    ${mensagem ? `<p class="t-foot c-3 pt-1">${mensagem}</p>` : ''}
                </div>
                <button type="button" onclick="fecharEscolha(true)" class="press w-full h-14 t-body ${perigo ? 'c-danger' : 'c-accent'}">${acao}</button>`)
                .then(v => v === true);
        }

        function escolher({ titulo, opcoes, atual }) {
            return abrirEscolha(`
                <p id="escolha-titulo" class="t-foot c-2 font-semibold text-center px-4 pt-4 pb-3" ${SEP_TITULO}>${titulo}</p>
                ${opcoes.map((o, i) => `
                <button type="button" onclick="fecharEscolha(${i})" ${o.valor === atual ? 'aria-current="true"' : ''} class="press row justify-between">
                    <span class="t-body">${o.rotulo}</span>
                    ${o.valor === atual ? '<i data-lucide="check" class="w-5 h-5 c-accent shrink-0"></i>' : ''}
                </button>`).join('')}`)
                .then(i => i === null ? null : opcoes[i].valor);
        }

        /* ===================================================================
           MENU DO AVATAR: conta e ferramentas de demonstração
           Ficam aqui para não disputar espaço com o conteúdo.
           =================================================================== */

        function openMenu() {
            renderMenu();
            document.getElementById('menu-sheet').classList.remove('hidden');
            travarFundo('menu');
        }

        function closeMenu() {
            document.getElementById('menu-sheet').classList.add('hidden');
            destravarFundo('menu');
        }

        function renderMenu() {
            const logado = sessao.logado;
            document.getElementById('menu-nome').innerText = logado ? sessao.nome : 'Visitante';
            document.getElementById('menu-sub').innerText = logado ? sessao.telefone : 'Você vê tudo. Para garantir entrada, entre com o celular.';
            document.getElementById('menu-sub').classList.toggle('text-center', !logado);
            document.getElementById('menu-avatar').innerHTML = avatarConteudo();
            document.getElementById('toggle-gerente').checked = isManagerMode;
            document.getElementById('seg-visitante').setAttribute('aria-selected', !logado);
            document.getElementById('seg-logado').setAttribute('aria-selected', logado);
            Object.keys(SIMULACOES).forEach(k => document.getElementById(`sim-${k}`).setAttribute('aria-selected', k === simulacaoAtual));

            const linha = (acao, texto, extra) => `
                <button onclick="${acao}" class="press row justify-between">
                    <span class="t-body ${extra || ''}">${texto}</span>
                    ${extra ? '' : '<i data-lucide="chevron-right" class="w-4 h-4 chevron"></i>'}
                </button>`;
            document.getElementById('menu-conta').innerHTML = logado
                ? linha("closeMenu(); switchTab('ingressos');", 'Meus ingressos') +
                  linha("closeMenu(); switchTab('freelas');", 'Trabalhe na noite') +
                  linha('sairDaConta()', 'Sair', 'c-danger')
                : linha('closeMenu(); abrirLogin();', 'Entrar com celular', 'c-accent') +
                  linha("closeMenu(); switchTab('freelas');", 'Trabalhe na noite');

            const casa = housesData.find(h => h.id === identidadeId);
            document.getElementById('menu-identidade').innerText = casa ? nomeCasa(casa) : 'Geral';

            lucide.createIcons();
        }

        async function escolherIdentidade() {
            const opcoes = [{ valor: 'default', rotulo: 'Geral' }, ...housesData.map(h => ({ valor: h.id, rotulo: nomeCasa(h) }))];
            const valor = await escolher({ titulo: 'Identidade visual', opcoes, atual: identidadeId });
            if (valor === null) return;
            aplicarIdentidade(valor);
            renderMenu();
        }

        // Identidade visual (white label): troca só a cor de destaque e o avatar.
        function aplicarIdentidade(houseId) {
            const house = housesData.find(h => h.id === houseId);
            identidadeId = house ? houseId : 'default';
            const cor = house && contrasteNoPreto(house.theme.primary) >= 4.5 ? house.theme.primary : '#ff9f0a';
            document.documentElement.style.setProperty('--accent', cor);
            atualizarAvatar();
            if (document.getElementById('menu-avatar')) document.getElementById('menu-avatar').innerHTML = avatarConteudo();
            if (currentTab === 'hoje') renderHoje();
        }

        function contrasteNoPreto(hex) {
            const v = parseInt((hex || '#000000').slice(1), 16);
            const canal = x => { x /= 255; return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4); };
            const L = 0.2126 * canal((v >> 16) & 255) + 0.7152 * canal((v >> 8) & 255) + 0.0722 * canal(v & 255);
            return (L + 0.05) / 0.05;
        }

        function avatarConteudo() {
            const house = housesData.find(h => h.id === identidadeId);
            if (house) return `<img src="logo-casas/${house.id}.jpg" alt="" class="w-full h-full object-cover">`;
            if (!sessao.logado) {
                // Silhueta genérica: o visitante não tem inicial
                return `<svg viewBox="0 0 24 24" width="58%" height="58%" fill="currentColor" class="c-2" aria-hidden="true"><circle cx="12" cy="8" r="4.2"/><path d="M3.5 21c.8-4.4 4.3-7 8.5-7s7.7 2.6 8.5 7z"/></svg>`;
            }
            return escHtml((sessao.nome || 'S').charAt(0).toLocaleUpperCase('pt-BR'));
        }

        function atualizarAvatar() {
            const btn = document.getElementById('avatar-btn');
            if (!btn) return;
            btn.innerHTML = `<span class="w-full h-full rounded-full overflow-hidden flex items-center justify-center">${avatarConteudo()}</span>` +
                (simulacaoAtual !== 'agora' ? `<span class="absolute -top-0.5 -right-0.5 w-2.5 h-2.5 rounded-full border-2 border-black" style="background: var(--accent);" title="Horário simulado"></span>` : '');
        }

        /* ===================================================================
           SESSÃO E LOGIN
           Telefone + código, sem senha (decisão #6). Na simulação, nenhuma
           mensagem é enviada e o código válido é CODIGO_DEMO, mostrado na tela.
           =================================================================== */

        const CODIGO_DEMO = '2468';

        let login = null;   // { etapa: telefone | codigo | nome, motivo, aoConcluir, telefone, canal, reenvioAte, timer }

        const digitos = t => (t || '').replace(/\D/g, '');

        function mascararTelefone(valor) {
            const d = digitos(valor).slice(0, 11);
            if (d.length <= 2) return d.length ? `(${d}` : '';
            if (d.length <= 7) return `(${d.slice(0, 2)}) ${d.slice(2)}`;
            return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;
        }

        function abrirLogin(opcoes) {
            opcoes = opcoes || {};
            login = {
                etapa: 'telefone',
                motivo: opcoes.motivo || 'conta',
                aoConcluir: opcoes.aoConcluir || null,
                telefone: sessao.telefone || '',
                canal: 'WhatsApp',
                reenvioAte: 0,
                timer: null
            };
            document.getElementById('login-sheet').classList.remove('hidden');
            travarFundo('login');
            renderLogin();
        }

        function fecharLogin() {
            if (login) clearInterval(login.timer);
            login = null;
            document.getElementById('login-sheet').classList.add('hidden');
            destravarFundo('login');
        }

        function voltarLogin() {
            if (!login) return;
            clearInterval(login.timer);
            login.etapa = 'telefone';
            renderLogin();
        }

        function renderLogin() {
            const caixa = document.getElementById('login-conteudo');
            document.getElementById('login-voltar').classList.toggle('invisible', login.etapa === 'telefone');
            const cabecalho = (tituloTxt, sub) => `
                <div class="space-y-2 px-1">
                    <h2 id="login-titulo" class="t-title2">${tituloTxt}</h2>
                    <p class="t-sub c-2">${sub}</p>
                </div>`;

            if (login.etapa === 'telefone') {
                caixa.innerHTML = `
                    <div class="space-y-6">
                        ${cabecalho('Entre com seu celular', login.motivo === 'reserva'
                            ? 'Pra guardar seu lugar, a casa precisa saber quem vai. Sem senha: mandamos um código pra confirmar o número.'
                            : 'Sem senha: mandamos um código pra confirmar que o número é seu.')}
                        <div>
                            <div class="group-list on-fill">
                                <label class="row">
                                    <span class="t-body c-2 shrink-0">+55</span>
                                    <input id="login-tel" type="tel" inputmode="numeric" enterkeyhint="send" autocomplete="tel-national" placeholder="(62) 99999-9999"
                                        value="${escHtml(login.telefone)}" oninput="aoDigitarTelefone(this)"
                                        onkeydown="if (event.key === 'Enter') enviarCodigo('WhatsApp')" class="bare t-body flex-1" aria-label="Número de celular com DDD">
                                </label>
                            </div>
                            <p id="login-tel-erro" role="alert" class="msg-erro px-4 pt-2 hidden"></p>
                        </div>
                        <div class="space-y-1">
                            <button id="login-enviar" onclick="enviarCodigo('WhatsApp')" class="press btn-primary w-full">
                                <i data-lucide="message-circle" class="w-[18px] h-[18px]"></i>Receber código no WhatsApp
                            </button>
                            <button id="login-sms" onclick="enviarCodigo('SMS')" class="press w-full h-11 t-sub c-accent disabled:opacity-40 inline-flex items-center justify-center gap-2">Prefiro receber por SMS</button>
                        </div>
                        <p class="t-foot c-3 text-center px-4">Simulação: nenhuma mensagem é enviada.</p>
                    </div>`;
                aoDigitarTelefone(document.getElementById('login-tel'));
                focarDepois('login-tel');
            } else if (login.etapa === 'codigo') {
                caixa.innerHTML = `
                    <div class="space-y-6">
                        ${cabecalho('Digite o código', `Enviamos 4 números pelo ${login.canal} para <span class="text-white font-semibold whitespace-nowrap">${escHtml(login.telefone)}</span>.`)}
                        <div class="space-y-3">
                            <div class="otp">
                                ${[0, 1, 2, 3].map(() => '<div class="otp-caixa" aria-hidden="true"></div>').join('')}
                                <input id="login-codigo" type="text" inputmode="numeric" enterkeyhint="done" autocomplete="one-time-code" maxlength="4"
                                    oninput="aoDigitarCodigo(this)" aria-label="Código de 4 números">
                            </div>
                            <p id="login-codigo-erro" role="alert" class="msg-erro text-center px-4 hidden"></p>
                        </div>
                        <div id="login-acoes-codigo" class="flex justify-center gap-6">
                            <button id="login-reenviar" onclick="reenviarCodigo()" class="press h-11 t-sub c-accent disabled:text-[#8e8e93]"></button>
                            <button onclick="voltarLogin()" class="press h-11 t-sub c-accent">Trocar número</button>
                        </div>
                        <p id="login-verificando" role="status" class="h-11 t-sub c-2 flex items-center justify-center gap-2 hidden"><span class="spinner" aria-hidden="true"></span>Verificando…</p>
                        <p class="t-foot c-3 text-center px-4">Simulação: o código é ${CODIGO_DEMO}.</p>
                    </div>`;
                aoDigitarCodigo(document.getElementById('login-codigo'));
                iniciarContagemReenvio();
                focarDepois('login-codigo');
            } else {
                caixa.innerHTML = `
                    <div class="space-y-6">
                        ${cabecalho('Como você quer aparecer na lista?', 'É o nome que a portaria vai procurar.')}
                        <div class="group-list on-fill">
                            <label class="row">
                                <span class="t-body shrink-0">Nome</span>
                                <input id="login-nome" type="text" autocomplete="name" enterkeyhint="done" placeholder="Nome e sobrenome"
                                    oninput="document.getElementById('login-continuar').disabled = this.value.trim().length < 2"
                                    onkeydown="if (event.key === 'Enter' && this.value.trim().length >= 2) concluirLogin(this.value)"
                                    class="bare t-body c-2 flex-1 text-right">
                            </label>
                        </div>
                        <button id="login-continuar" onclick="concluirLogin(document.getElementById('login-nome').value)" disabled class="press btn-primary w-full">Continuar</button>
                        <p class="t-foot c-3 text-center px-4">Ao continuar, você aceita os <span class="underline">Termos de uso</span> e o <span class="underline">Aviso de privacidade</span>.</p>
                    </div>`;
                focarDepois('login-nome');
            }
            lucide.createIcons();
        }

        // Espera a folha terminar de subir; focar antes faz o iOS pular a tela.
        function focarDepois(id) {
            setTimeout(() => { const el = document.getElementById(id); if (el) el.focus(); }, 380);
        }

        function aoDigitarTelefone(input) {
            input.value = mascararTelefone(input.value);
            login.telefone = input.value;
            limparErroCampo('login-tel');
            const completo = digitos(input.value).length === 11;
            document.getElementById('login-enviar').disabled = !completo;
            document.getElementById('login-sms').disabled = !completo;
        }

        async function enviarCodigo(canal) {
            if (login.enviando) return;
            if (digitos(login.telefone).length !== 11) {
                marcarErroCampo('login-tel', 'Faltam números. Celular com DDD.');
                return;
            }
            const atual = login;
            atual.enviando = true;
            document.getElementById('login-tel').disabled = true;
            document.getElementById(canal === 'SMS' ? 'login-enviar' : 'login-sms').disabled = true;
            emVoo(document.getElementById(canal === 'SMS' ? 'login-sms' : 'login-enviar'), 'Enviando…');
            await aguardar(900);
            atual.enviando = false;
            if (login !== atual || login.etapa !== 'telefone') return;   // fechou ou saiu no meio
            login.canal = canal;
            login.etapa = 'codigo';
            login.reenvioAte = Date.now() + 30000;
            renderLogin();
        }

        function iniciarContagemReenvio() {
            clearInterval(login.timer);
            const atualizar = () => {
                const btn = document.getElementById('login-reenviar');
                if (!btn || !login) return;
                const s = Math.max(0, Math.ceil((login.reenvioAte - Date.now()) / 1000));
                btn.disabled = s > 0;
                btn.innerText = s > 0 ? `Reenviar em 0:${pad2(s)}` : 'Reenviar código';
                if (s === 0) clearInterval(login.timer);
            };
            atualizar();
            login.timer = setInterval(atualizar, 1000);
        }

        function reenviarCodigo() {
            login.reenvioAte = Date.now() + 30000;
            iniciarContagemReenvio();
            showSuccessToast(`Código reenviado pelo ${login.canal}`);
        }

        function aoDigitarCodigo(input) {
            input.value = digitos(input.value).slice(0, 4);
            const v = input.value;
            limparErroCampo('login-codigo');
            document.querySelectorAll('#login-conteudo .otp-caixa').forEach((c, i) => {
                c.innerText = v[i] || '';
                c.classList.toggle('atual', i === v.length);
            });
            if (v.length === 4) verificarCodigo();
        }

        async function verificarCodigo() {
            if (!login || login.etapa !== 'codigo') return;
            const atual = login;
            const input = document.getElementById('login-codigo');
            const acoes = document.getElementById('login-acoes-codigo');
            const verificando = document.getElementById('login-verificando');
            input.disabled = true;
            acoes.classList.add('hidden');
            verificando.classList.remove('hidden');
            await aguardar(700);
            if (login !== atual || login.etapa !== 'codigo') return;   // fechou ou trocou de número no meio
            if (input.value !== CODIGO_DEMO) {
                verificando.classList.add('hidden');
                acoes.classList.remove('hidden');
                input.disabled = false;
                input.value = '';
                aoDigitarCodigo(input);
                marcarErroCampo('login-codigo', 'Código incorreto. Confira e tente de novo.');
                input.focus();
                return;
            }
            // Quem volta com o mesmo número já tem nome: pula direto para a lista.
            const conhecido = sessao.nome && digitos(sessao.telefone) === digitos(login.telefone);
            if (conhecido) return concluirLogin(sessao.nome, true);
            login.etapa = 'nome';
            renderLogin();
        }

        async function concluirLogin(nome, deVolta) {
            nome = (nome || '').trim();
            if (nome.length < 2 || login.entrando) return;
            // Na etapa do nome, "Continuar" fica em voo; quem volta já passou pelo "Verificando…".
            const botao = document.getElementById('login-continuar');
            if (botao) {
                const atual = login;
                atual.entrando = true;
                document.getElementById('login-nome').disabled = true;
                emVoo(botao, 'Entrando…');
                await aguardar(600);
                atual.entrando = false;
                if (login !== atual || login.etapa !== 'nome') return;   // fechou ou voltou no meio
            }
            sessao.logado = true;
            sessao.nome = nome;
            sessao.telefone = login.telefone;
            salvarSessao();
            const aoConcluir = login.aoConcluir;
            fecharLogin();
            atualizarAvatar();
            updateReservasUI();
            const primeiro = nome.split(' ')[0];
            showSuccessToast(deVolta ? `Que bom te ver de novo, ${primeiro}` : `Pronto, ${primeiro}`);
            if (aoConcluir) aoConcluir();
        }

        async function sairDaConta() {
            if (!await confirmar({ titulo: 'Sair da conta?', acao: 'Sair', perigo: true })) return;
            sessao.logado = false;
            salvarSessao();
            closeMenu();
            redesenharTudo();
            showSuccessToast('Você saiu da conta');
        }

        // Atalho da demonstração: troca de papel sem passar pelo código.
        function escolherSimulacao(chave) {
            simularNoite(chave);
            renderMenu();
            const sim = SIMULACOES[chave];
            showSuccessToast(sim.dia === undefined ? 'Horário real' : `${DIAS_TITULO[sim.dia]}, ${sim.hora.replace(':00', 'h').replace(':', 'h')}`);
        }

        function definirSessaoDemo(logado) {
            if (logado && !sessao.nome) Object.assign(sessao, PERFIL_DEMO);
            sessao.logado = logado;
            salvarSessao();
            redesenharTudo();
            renderMenu();
            mostrarToast(logado ? `Logado como ${sessao.nome.split(' ')[0]}` : 'Modo visitante', { tipo: logado ? 'sucesso' : 'neutro' });
        }

        /* ===================================================================
           ONBOARDING
           Três telas com dados reais da noite e uma de localização. Aparece
           na primeira visita; link direto (casa, aba, horário) vai direto ao
           conteúdo, para o "vem pro Môi hoje" e para a demo dos sócios.
           =================================================================== */

        const CHAVE_ONBOARDING = 'gyn_onboarding_visto';
        let passoOnboarding = 0;

        function deveMostrarOnboarding() {
            const p = new URLSearchParams(location.search);
            if (p.get('onboarding') === '1') return true;
            if (['casa', 'aba', 'sim'].some(k => p.has(k))) return false;
            try { return !localStorage.getItem(CHAVE_ONBOARDING); } catch (e) { return false; }
        }

        function telaOnboarding(visual, tituloTxt, texto, rotulo) {
            return `
                <section aria-label="${rotulo}">
                    <div class="flex-1 min-h-0 flex items-center justify-center py-4 overflow-hidden">${visual}</div>
                    <div class="space-y-2 pb-1">
                        <h2 class="t-title1">${tituloTxt}</h2>
                        <p class="t-callout c-2">${texto}</p>
                    </div>
                </section>`;
        }

        function abrirOnboarding() {
            const ref = agora();
            const noites = noitesDaSemana(ref);
            const agoraL = noites.filter(x => x.st.estado === 'agora');
            const hojeL = noites.filter(x => x.st.estado === 'hoje');
            const destaque = escolherDestaque(agoraL.length ? agoraL : (hojeL.length ? hojeL : noites), ref);

            // 1. A noite de verdade, não uma ilustração
            let visualNoite = '<i data-lucide="moon-star" class="w-16 h-16 c-2"></i>';
            if (destaque) {
                const { house, st } = destaque;
                const ent = infoEntrada(st.prog, st.occ, ref);
                const chip = st.estado === 'agora'
                    ? '<span class="glass chip-glass"><span class="dot pulse"></span>Rolando agora</span>'
                    : `<span class="glass chip-glass">${diaRelativo(st.inicio, ref)}, ${fmtHora(st.inicio)}</span>`;
                visualNoite = `
                    <article class="relative w-full h-full max-h-[340px] card rounded-[24px] overflow-hidden">
                        ${midiaHtml(house, 'absolute inset-0')}
                        <div class="absolute inset-0 scrim-hero"></div>
                        <div class="absolute top-4 left-4">${chip}</div>
                        <div class="absolute left-4 right-4 bottom-5 flex flex-col gap-2">
                            <div class="flex items-center gap-2 min-w-0">
                                ${logoHtml(house, 'w-6 h-6')}
                                <span class="t-foot font-semibold c-1b truncate">${nomeCasa(house)}</span>
                            </div>
                            <h3 class="t-title2">${nomeNoite(st.prog)}</h3>
                            <span class="t-headline ${ent.urgente ? 'c-accent' : ''}">${ent.principal}</span>
                        </div>
                    </article>`;
            }

            // 2. Promoções com o relógio correndo; a que acabou aparece apagada
            const ordem = [...agoraL, ...hojeL, ...noites.filter(x => x.st.estado === 'futura')];
            const promos = ordem.flatMap(({ house, st }) => promosDaNoite(st.prog, st.occ, ref).map(x => ({ house, ...x })));
            const vivas = promos.filter(x => x.st.estado !== 'expirada').slice(0, 3);
            const apagada = promos.find(x => x.st.estado === 'expirada');
            const linhasPromo = [...vivas, ...(apagada ? [apagada] : [])].map(({ house, promo, st }) => {
                const t = tempoPromo(promo, st);
                return `
                    <div class="row ${st.estado === 'expirada' ? 'opacity-40' : ''}" style="--inset: 64px;">
                        ${logoHtml(house, 'w-9 h-9')}
                        <span class="flex-1 min-w-0 flex flex-col gap-0.5">
                            <span class="t-callout font-semibold truncate">${promo.nome}</span>
                            <span class="t-foot c-2 truncate">${nomeCasa(house)}</span>
                        </span>
                        <span class="t-foot shrink-0 ${t.classe}">${t.texto}</span>
                    </div>`;
            }).join('');
            const visualPromo = linhasPromo
                ? `<div class="group-list w-full min-w-0">${linhasPromo}</div>`
                : '<i data-lucide="clock" class="w-16 h-16 c-2"></i>';

            // 3. O Passe que a pessoa vai mostrar na porta
            const casaPasse = destaque ? destaque.house : housesData[0];
            const noitePasse = destaque ? destaque.st : null;
            const visualPasse = `
                <article class="w-full max-w-[290px] card overflow-hidden">
                    <div class="px-4 pt-4 flex items-center gap-3">
                        ${logoHtml(casaPasse, 'w-8 h-8')}
                        <span class="t-headline truncate flex-1">${nomeCasa(casaPasse)}</span>
                        <span class="chip-glass chip-live"><i data-lucide="check" class="w-3 h-3"></i>Na lista</span>
                    </div>
                    ${noitePasse ? `<p class="px-4 pt-2 t-sub c-2 truncate">${nomeNoite(noitePasse.prog)} · ${infoEntrada(noitePasse.prog, noitePasse.occ, ref).curto}</p>` : ''}
                    <div class="mt-4 border-t-[1.5px] border-dashed border-[#3a3a3c]"></div>
                    <div class="py-4 flex flex-col items-center gap-2">
                        <div class="ob-qr p-2.5 rounded-[12px] bg-white">${qrSvg('onboarding')}</div>
                        <p class="t-foot c-2">Mostre na portaria</p>
                    </div>
                </article>`;

            // 4. Localização, explicada antes do pedido do sistema
            const visualLocal = visualPertoDeVoce();

            const trilho = document.getElementById('ob-trilho');
            trilho.innerHTML =
                telaOnboarding(visualNoite, 'O que rola hoje em Goiânia', 'Bares e boates num lugar só, com quanto custa entrar agora. Sem abrir seis perfis no Instagram.', '1 de 4') +
                telaOnboarding(visualPromo, 'Promoção tem hora pra acabar', 'Você vê o que ainda vale e quanto tempo falta. O que já acabou aparece apagado.', '2 de 4') +
                telaOnboarding(visualPasse, 'Seu nome na lista, sem mandar direct', 'Um toque e o QR fica no app. Na porta, é só mostrar.', '3 de 4') +
                telaOnboarding(visualLocal, 'Veja o que está perto de você', 'Com a localização, cada casa mostra a distância e o tempo de carro até lá. Usamos só enquanto o app está aberto.', '4 de 4');

            document.getElementById('onboarding').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            trilho.scrollLeft = 0;
            passoOnboarding = -1;
            mostrarPassoOnboarding(0);
        }

        // Mini-mapa da tela de localização: as casas mais próximas em volta de
        // "você", com o tempo de carro. Antes da permissão não há posição, então
        // a origem é a mesma praça que o mapa usa na demonstração.
        function visualPertoDeVoce() {
            const o = ORIGEM_DEMO;
            const kmLng = 111.32 * Math.cos(o.lat * Math.PI / 180);
            const perto = housesData.filter(h => h.geo)
                .map(h => {
                    const km = distanciaKm(o, h.geo);
                    return {
                        house: h,
                        dx: (h.geo.lng - o.lng) * kmLng,
                        dy: -(h.geo.lat - o.lat) * 110.57,
                        min: Math.max(3, Math.round(km * FATOR_RUA / VELOCIDADE_NOITE_KMH * 60) + 2)
                    };
                })
                .sort((a, b) => a.min - b.min)
                .slice(0, 4);
            if (!perto.length) return '<i data-lucide="map-pin" class="w-16 h-16 c-2"></i>';

            // Esquema, não escala: as casas ficam na direção real, mas abertas
            // pelo menos 70° entre si e a uma distância que cresce com os minutos.
            // Na escala real elas se amontoam no centro.
            perto.forEach((p, i) => { p.ang = Math.atan2(p.dy, p.dx); p.r = 22 + i * 5; });
            const porAngulo = perto.slice().sort((a, b) => a.ang - b.ang);
            const MIN_SEP = 70 * Math.PI / 180;
            for (let i = 1; i < porAngulo.length; i++) {
                porAngulo[i].ang = Math.max(porAngulo[i].ang, porAngulo[i - 1].ang + MIN_SEP);
            }
            const pos = p => ({ x: Math.min(72, Math.max(18, 50 + Math.cos(p.ang) * p.r)), y: Math.min(76, Math.max(18, 50 + Math.sin(p.ang) * p.r)) });
            const alvo = pos(perto[0]);

            // Ruas: um anel e avenidas radiais, como o centro de Goiânia
            const radiais = [0, 35, 72, 110, 148, 190, 232, 275, 318]
                .map(g => { const r = g * Math.PI / 180; return `<line x1="50" y1="50" x2="${50 + Math.cos(r) * 90}" y2="${50 + Math.sin(r) * 90}"/>`; }).join('');
            const grade = [12, 24, 37, 63, 76, 88]
                .map(v => `<line x1="${v}" y1="0" x2="${v - 8}" y2="100"/><line x1="0" y1="${v}" x2="100" y2="${v + 6}"/>`).join('');

            const pinos = perto.map((p, i) => {
                const { x, y } = pos(p);
                return `
                    <span class="pino-envelope" style="position: absolute; left: ${x}%; top: ${y}%; transform: translate(-50%, -50%); animation: fade-in 0.4s ease ${0.15 + i * 0.12}s both;">
                        <span class="pino" style="--anel: ${i === 0 ? 'var(--accent)' : '#636366'}">
                            <span class="pino-ini">${escHtml(nomeCasa(p.house).charAt(0))}</span>
                            <img src="logo-casas/${p.house.id}.jpg" alt="" onerror="this.remove()">
                        </span>
                        <span class="pino-min">${p.min} min</span>
                    </span>`;
            }).join('');

            return `
                <div class="relative rounded-[24px] overflow-hidden" style="width: min(100%, 320px, 40vh); aspect-ratio: 1; background: #14161b;" aria-hidden="true">
                    <svg viewBox="0 0 100 100" preserveAspectRatio="none" class="absolute inset-0 w-full h-full" fill="none">
                        <g stroke="#1d2027" stroke-width="0.6">${grade}</g>
                        <g stroke="#262a33" stroke-width="1.6">${radiais}</g>
                        <circle cx="50" cy="50" r="27" stroke="#262a33" stroke-width="1.6"/>
                        <line x1="50" y1="50" x2="${alvo.x}" y2="${alvo.y}" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="1 5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
                    </svg>
                    <span class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-24 h-24 rounded-full" style="background: rgba(10,132,255,0.16); animation: pulse 2.4s ease-in-out infinite;"></span>
                    <span class="eu-ponto absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2"></span>
                    ${pinos}
                    <span class="glass chip-glass absolute left-3 bottom-3 font-medium">
                        <i data-lucide="navigation" class="w-3 h-3 c-accent"></i>${escHtml(nomeCasa(perto[0].house))} a ${perto[0].min} min
                    </span>
                </div>`;
        }

        function mostrarPassoOnboarding(i) {
            if (i === passoOnboarding) return;
            passoOnboarding = i;
            const total = document.getElementById('ob-trilho').children.length;
            document.getElementById('ob-pontos').innerHTML =
                Array.from({ length: total }, (_, k) => `<span class="${k === i ? 'on' : ''}"></span>`).join('');
            document.getElementById('ob-acoes').innerHTML = i < total - 1
                ? `<button onclick="irParaPassoOnboarding(${i + 1})" class="press btn-primary w-full">Continuar</button>
                   <span class="h-11" aria-hidden="true"></span>`
                : `<button onclick="ativarLocalizacaoOnboarding()" class="press btn-primary w-full"><i data-lucide="navigation" class="w-[18px] h-[18px]"></i>Ativar localização</button>
                   <button onclick="concluirOnboarding()" class="press h-11 t-headline c-accent">Agora não</button>`;
            lucide.createIcons();
        }

        function aoRolarOnboarding() {
            const trilho = document.getElementById('ob-trilho');
            mostrarPassoOnboarding(Math.round(trilho.scrollLeft / trilho.clientWidth));
        }

        function irParaPassoOnboarding(i) {
            const trilho = document.getElementById('ob-trilho');
            const suave = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            trilho.scrollTo({ left: i * trilho.clientWidth, behavior: suave ? 'smooth' : 'auto' });
            mostrarPassoOnboarding(i);
        }

        // "Agora não" deixa a origem desconhecida: o mapa da Agenda pergunta de
        // novo quando a pessoa abrir. Um "não" no pedido do sistema é definitivo.
        function ativarLocalizacaoOnboarding() {
            concluirOnboarding();
            pedirLocalizacao();
        }

        function concluirOnboarding() {
            try { localStorage.setItem(CHAVE_ONBOARDING, '1'); } catch (e) { /* aparece de novo na próxima visita */ }
            document.getElementById('onboarding').classList.add('hidden');
            document.body.style.overflow = '';
            // Tira o ?onboarding=1 para o recarregar não repetir as boas-vindas
            const url = new URL(location.href);
            if (url.searchParams.has('onboarding')) {
                url.searchParams.delete('onboarding');
                history.replaceState(null, '', url);
            }
        }

        // --- MODO GERENTE (DASHBOARD) ---
        function sincronizarToggleGerente() {
            const t = document.getElementById('toggle-gerente');
            if (t) t.checked = isManagerMode;
        }

        function toggleManagerMode() {
            isManagerMode = !isManagerMode;
            sincronizarToggleGerente();
            if (isManagerMode) {
                closeMenu();
                showSuccessToast("Painel da casa");
                openManagerDashboard('painel');
                window.scrollTo(0, 0);
            } else {
                exitManagerMode();
            }
        }

        function exitManagerMode() {
            isManagerMode = false;
            sincronizarToggleGerente();
            switchTab('hoje');
        }

        // --- SISTEMA REELS/TIKTOK VIBES DE ALTA PERFORMANCE ---
        // Começa mutado: iOS bloqueia autoplay com áudio, e o desbloqueio só é permitido
        // dentro de um gesto do usuário (o toque no botão de som).
        let isVibesMuted = true;
        let vibesObserver = null;
        let vibesEngineInitialized = false;

        function toggleVibesAudio(event) {
            if (event) {
                event.stopPropagation();
                event.preventDefault();
            }
            
            isVibesMuted = !isVibesMuted;
            
            // Sync all video elements' mute state
            const videos = document.querySelectorAll('.vibes-card video');
            videos.forEach(vid => {
                vid.muted = isVibesMuted;
            });
            
            // Dynamic premium UI feedback for audio button
            document.querySelectorAll('.sound-toggle-btn').forEach(btn => {
                const muteIcon = btn.querySelector('.mute-icon');
                const unmuteIcon = btn.querySelector('.unmute-icon');
                if (isVibesMuted) {
                    muteIcon.classList.remove('hidden');
                    unmuteIcon.classList.add('hidden');
                } else {
                    muteIcon.classList.add('hidden');
                    unmuteIcon.classList.remove('hidden');
                }
            });
            
            mostrarToast(isVibesMuted ? "Áudio Mutado" : "Áudio Ativado", { tipo: isVibesMuted ? 'neutro' : 'sucesso' });
        }

        function initVibesEngine() {
            if (!vibesEngineInitialized) {
                renderVibes(); // Renderiza dinamicamente as mídias da base centralizada!
            }
            
            if (vibesEngineInitialized) {
                // Ensure audio icon reflects current state upon returning to the tab
                document.querySelectorAll('.sound-toggle-btn').forEach(btn => {
                    const muteIcon = btn.querySelector('.mute-icon');
                    const unmuteIcon = btn.querySelector('.unmute-icon');
                    if (isVibesMuted) {
                        muteIcon.classList.remove('hidden');
                        unmuteIcon.classList.add('hidden');
                    } else {
                        muteIcon.classList.add('hidden');
                        unmuteIcon.classList.remove('hidden');
                    }
                });
                
                // Play active video
                triggerVisibleVideoPlay();
                return;
            }
            
            vibesEngineInitialized = true;
            
            // --- 1. CONFIGURAR INTERSECTION OBSERVER (PLAY/PAUSE ON SCROLL) ---
            const cards = document.querySelectorAll('.vibes-card');
            const options = {
                root: document.getElementById('vibes-scroll-container'),
                threshold: 0.6 // Starts playing when card occupies at least 60% of viewport
            };
            
            vibesObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target.querySelector('video');
                    const bar = entry.target.querySelector('.vibes-progress-bar');
                    
                    if (!video) return;
                    
                    if (entry.isIntersecting) {
                        // Com preload="none" o iOS só busca a mídia quando pedimos explicitamente
                        if (video.preload === 'none') {
                            video.preload = 'auto';
                            video.load();
                        }

                        video.muted = isVibesMuted;

                        // Handle browser autoplay policy elegantly
                        const playPromise = video.play();
                        if (playPromise !== undefined) {
                            playPromise.catch(error => {
                                console.log("Autoplay blocked, running muted fallback:", error);
                                video.muted = true;
                                video.play().catch(e => console.error("Fallback play failed:", e));
                            });
                        }

                        // Real-time progress bar sync
                        video.ontimeupdate = () => {
                            if (video.duration) {
                                const pct = (video.currentTime / video.duration) * 100;
                                if (bar) bar.style.width = `${pct}%`;
                            }
                        };
                    } else {
                        video.pause();
                        // Só rebobina se já houver metadados; no iOS mexer em currentTime
                        // antes disso dispara InvalidStateError.
                        if (video.readyState > 0) video.currentTime = 0;
                        video.ontimeupdate = null;
                        if (bar) bar.style.width = '0%';
                    }
                });
            }, options);
            
            cards.forEach(card => vibesObserver.observe(card));

            // --- 2. DOUBLE CLICK / SINGLE TAP PARA PAUSAR E EXIBIR CORAÇÃO/PLAY ---
            cards.forEach(card => {
                const video = card.querySelector('video');
                
                card.addEventListener('click', (e) => {
                    // Ignore clicks on actionable items like buttons or svg icons
                    if (e.target.closest('button') || e.target.closest('a')) return;
                    if (!video.isConnected) return;   // vídeo indisponível: nada para pausar
                    
                    if (video.paused) {
                        video.play().catch(err => console.log("Play blocked: ", err));
                        showPlayPauseOverlay(card, 'play');
                    } else {
                        video.pause();
                        showPlayPauseOverlay(card, 'pause');
                    }
                });
            });
            
            lucide.createIcons();
        }

        // Helper triggers playing of currently visible video
        function triggerVisibleVideoPlay() {
            const container = document.getElementById('vibes-scroll-container');
            const cards = document.querySelectorAll('.vibes-card');
            cards.forEach(card => {
                const rect = card.getBoundingClientRect();
                const containerRect = container.getBoundingClientRect();
                
                // Check if card is visible inside container
                const isVisible = (rect.top >= containerRect.top - 50 && rect.bottom <= containerRect.bottom + 50);
                const video = card.querySelector('video');
                
                if (isVisible && video) {
                    video.muted = isVibesMuted;
                    video.play().catch(err => console.log("Autoplay failed on tab switch:", err));
                }
            });
        }

        // Immersive overlay animation on single-tap
        function showPlayPauseOverlay(card, type) {
            let overlay = card.querySelector('.play-pause-indicator');
            if (!overlay) {
                overlay = document.createElement('div');
                overlay.className = "play-pause-indicator absolute inset-0 flex items-center justify-center z-40 pointer-events-none opacity-0 transition-all duration-300 transform scale-50";
                overlay.innerHTML = `
                    <div class="w-16 h-16 rounded-full bg-black/60 backdrop-blur-md flex items-center justify-center text-white">
                        <i data-lucide="${type}" class="w-6 h-6"></i>
                    </div>
                `;
                card.appendChild(overlay);
                lucide.createIcons({
                    attrs: { class: 'w-6 h-6' },
                    nameAttr: 'data-lucide'
                });
            } else {
                overlay.innerHTML = `
                    <div class="w-16 h-16 rounded-full bg-black/60 backdrop-blur-md flex items-center justify-center text-white">
                        <i data-lucide="${type}" class="w-6 h-6"></i>
                    </div>
                `;
                lucide.createIcons({
                    attrs: { class: 'w-6 h-6' },
                    nameAttr: 'data-lucide'
                });
            }
            
            // Start scale up and fade in
            overlay.classList.remove('opacity-0', 'scale-50');
            overlay.classList.add('opacity-100', 'scale-110');
            
            setTimeout(() => {
                overlay.classList.remove('opacity-100', 'scale-110');
                overlay.classList.add('opacity-0', 'scale-50');
            }, 600);
        }

        // O modo gerente tem barra própria: Painel, Lista, Ler QR e Equipe.
        let abaGerente = 'painel';

        function openManagerDashboard(aba) {
            const trocouDeAba = aba && aba !== abaGerente;
            if (aba) abaGerente = aba;
            if (abaGerente !== 'qr') pararCamera();
            currentTab = 'gerente';
            mostrarView('gerente');
            ['painel', 'lista', 'qr', 'equipe'].forEach(t => {
                const btn = document.getElementById('nav-g-' + t);
                btn.classList.toggle('on', t === abaGerente);
                if (t === abaGerente) btn.setAttribute('aria-current', 'page');
                else btn.removeAttribute('aria-current');
            });

            const house = casaDoGerente();
            const view = document.getElementById('manager-dashboard-view');
            const conteudo = {
                painel: htmlPainelGerente, lista: htmlListaGerente, qr: htmlLeitorQr, equipe: h => htmlEquipeFreela(h.id)
            }[abaGerente](house);
            const subtitulo = { painel: 'Painel da casa', lista: 'Lista da portaria', qr: 'Ler QR da entrada', equipe: 'Equipe da noite' }[abaGerente];

            view.innerHTML = `
                <div class="space-y-4">
                    <div class="flex justify-end items-center h-9">
                        <button onclick="exitManagerMode()" class="press btn-secondary shrink-0">Sair</button>
                    </div>
                    <div class="space-y-1">
                        <h1 class="t-large truncate">${nomeCasa(house)}</h1>
                        <p class="t-sub c-2">${subtitulo}</p>
                    </div>
                </div>
                ${conteudo}
            `;
            lucide.createIcons();
            if (trocouDeAba) window.scrollTo(0, 0);
            if (abaGerente === 'qr') iniciarCamera();
        }

        function casaDoGerente() {
            return housesData.find(h => h.id === (activeHouseId || 'moi'));
        }

        function reservasDaCasa(houseId) {
            return reservations.filter(r => r.houseId === houseId && r.status !== 'cancelada');
        }

        function htmlPainelGerente(house) {
            const lista = reservasDaCasa(house.id);
            const pessoas = rs => rs.reduce((acc, r) => acc + r.guestsCount, 0);
            const entraram = lista.filter(r => r.status === 'presente');
            const emTurno = escalas.filter(e => e.status === 'em_turno' && contextoEscala(e).house.id === house.id).length;
            const st = noiteEmDestaque(house);

            const noite = st ? `
                <div class="group-list">
                    <div class="row" style="min-height: 64px;">
                        <span class="flex-1 min-w-0 flex flex-col gap-0.5">
                            <span class="t-foot c-2">${st.estado === 'agora' ? 'Rolando agora' : 'Próxima noite'}</span>
                            <span class="t-callout font-semibold truncate">${nomeNoite(st.prog)}</span>
                            <span class="t-foot c-2">${rotuloDia(st.inicio)} · ${fmtJanelaNoite(st)}</span>
                        </span>
                        ${st.estado === 'agora' ? '<span class="dot"></span>' : ''}
                    </div>
                </div>` : '';

            const numero = (rotulo, valor) => `
                <div class="card p-4 space-y-1">
                    <p class="t-foot c-2">${rotulo}</p>
                    <p class="t-large">${valor}</p>
                </div>`;

            const numeros = st ? `
                <div class="grid grid-cols-2 gap-3">
                    ${numero('Esperadas', pessoas(lista))}
                    ${numero('Já entraram', pessoas(entraram))}
                    ${numero('Faltam entrar', pessoas(lista) - pessoas(entraram))}
                    ${numero('Freelas em turno', emTurno)}
                </div>` : vazioCompactoHtml('Nenhuma noite publicada. Os números aparecem quando a próxima noite estiver na agenda.');

            return `
                ${noite}
                ${numeros}
                <button onclick="openManagerDashboard('qr')" class="press btn-primary w-full flex items-center justify-center gap-2">
                    <i data-lucide="scan-line" class="w-5 h-5"></i>Ler QR da entrada
                </button>
            `;
        }

        function htmlListaGerente(house) {
            const lista = reservasDaCasa(house.id);
            if (lista.length === 0) {
                return vazioCompactoHtml(`Nenhum nome na lista de ${nomeCasa(house)} ainda.`);
            }
            // Quem falta entrar vem primeiro: é o que a portaria procura.
            const ordenada = [...lista].sort((a, b) => (a.status === 'presente') - (b.status === 'presente'));
            const linhas = ordenada.map(r => {
                const acao = r.status === 'presente'
                    ? `<span class="t-foot c-live flex items-center gap-1 shrink-0"><i data-lucide="check" class="w-3.5 h-3.5"></i>Entrou</span>`
                    : `<button onclick="confirmPresence('${r.id}', this)" class="press btn-secondary claro shrink-0">Validar entrada</button>`;
                const quando = r.eventDate ? diaRelativo(new Date(r.eventDate)) : '';
                return `
                    <div class="row" style="min-height: 64px;" data-busca="${escHtml(normalizarBusca(r.userName + ' ' + (r.userPhone || '')))}">
                        <span class="flex-1 min-w-0 flex flex-col gap-0.5">
                            <span class="t-callout font-semibold truncate">${escHtml(r.userName)}</span>
                            <span class="t-foot c-2 truncate">${rotuloGarantia(r)}${r.userPhone ? ' · ' + escHtml(r.userPhone) : ''}</span>
                            ${quando ? `<span class="t-foot c-accent">${quando}</span>` : ''}
                        </span>
                        ${acao}
                    </div>`;
            }).join('');

            return `
                <div class="group-list">
                    <label class="row gap-2">
                        <i data-lucide="search" class="w-4 h-4 c-2 shrink-0"></i>
                        <input type="search" enterkeyhint="search" oninput="filtrarListaGerente(this.value); mostrarLimparBusca(this)" placeholder="Buscar nome ou WhatsApp" aria-label="Buscar na lista" class="bare t-body flex-1">
                        ${botaoLimparBuscaHtml()}
                    </label>
                </div>
                <div id="lista-gerente" class="group-list">${linhas}</div>
                <div id="lista-gerente-vazia" class="hidden"></div>
            `;
        }

        function filtrarListaGerente(termo) {
            const t = normalizarBusca(termo.trim());
            let visiveis = 0;
            document.querySelectorAll('#lista-gerente [data-busca]').forEach(el => {
                const some = !!t && !el.dataset.busca.includes(t);
                el.classList.toggle('hidden', some);
                if (!some) visiveis++;
            });
            const vazia = document.getElementById('lista-gerente-vazia');
            document.getElementById('lista-gerente').classList.toggle('hidden', visiveis === 0);
            vazia.classList.toggle('hidden', visiveis > 0);
            vazia.innerHTML = visiveis > 0 ? '' : vazioCompactoHtml(`Nenhum nome com "${escHtml(termo.trim())}".`);
        }

        function marcarPresenca(id) {
            const r = reservations.find(x => x.id === id);
            if (!r) return false;
            r.status = 'presente';
            try { localStorage.setItem('gyn_reservas', JSON.stringify(reservations)); } catch (e) { /* segue na memória */ }
            updateReservasUI();
            return true;
        }

        async function confirmPresence(id, botao) {
            const r = reservations.find(x => x.id === id);
            if (!r) return;
            const anterior = r.status;
            if (botao) {
                const restaurar = emVoo(botao, 'Validando…');
                await aguardar(500);
                restaurar();
            }
            if (marcarPresenca(id)) {
                mostrarToast('Entrada validada', { tipo: 'sucesso', acao: { rotulo: 'Desfazer', fn: () => desfazerPresenca(id, anterior) } });
                if (currentTab === 'gerente') openManagerDashboard();
            }
        }

        // Volta a reserva ao status de antes da validação (toque errado na portaria).
        function desfazerPresenca(id, anterior) {
            const r = reservations.find(x => x.id === id);
            if (!r || r.status !== 'presente') return;
            r.status = anterior;
            try { localStorage.setItem('gyn_reservas', JSON.stringify(reservations)); } catch (e) { /* segue na memória */ }
            updateReservasUI();
            mostrarToast('Entrada desfeita', { tipo: 'neutro' });
            // Não redesenha a aba Ler QR: isso reiniciaria a câmera e perderia uma leitura pendente.
            if (currentTab === 'gerente' && abaGerente !== 'qr') openManagerDashboard();
        }

        /* --- LER QR: câmera traseira + jsQR --- */

        let cameraStream = null;
        let leituraPausada = false;
        let leituraPendente = null;   // reserva lida que espera o "Confirmar entrada"

        function htmlLeitorQr(house) {
            const pendentes = reservasDaCasa(house.id).filter(r => r.status !== 'presente');
            const simular = `
                <section class="space-y-2">
                    <p class="t-cap c-2 px-4">Sem outro celular? Simule a leitura</p>
                    ${pendentes.length === 0 ? '<p class="t-foot c-3 px-4">Nenhum ingresso pendente para simular.</p>' : `
                    <div class="group-list">${pendentes.map(r => `
                        <button onclick="simularLeitura('${r.id}')" class="press row justify-between">
                            <span class="t-body truncate">${escHtml(r.userName)}</span>
                            <span class="t-foot c-2 shrink-0">${rotuloGarantia(r)}</span>
                        </button>`).join('')}
                    </div>`}
                </section>`;

            return `
                <div class="relative aspect-square card overflow-hidden">
                    <video id="qr-video" playsinline muted class="absolute inset-0 w-full h-full object-cover"></video>
                    <div class="absolute inset-[18%] rounded-[18px] border-2 border-white/80 pointer-events-none"></div>
                    <p id="qr-status" class="absolute inset-x-0 bottom-0 p-3 text-center t-foot c-2 bg-black/50">Abrindo a câmera…</p>
                </div>
                <div id="qr-resultado"></div>
                ${simular}
            `;
        }

        function simularLeitura(id) {
            processarLeitura(payloadIngresso(reservations.find(r => r.id === id)));
            document.getElementById('qr-resultado').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        async function iniciarCamera() {
            leituraPausada = false;
            leituraPendente = null;
            const status = document.getElementById('qr-status');
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof jsQR === 'undefined') {
                status.innerText = 'Câmera indisponível neste navegador.';
                return;
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
                // O gerente pode ter trocado de aba enquanto o navegador pedia permissão
                if (currentTab !== 'gerente' || abaGerente !== 'qr') { stream.getTracks().forEach(t => t.stop()); return; }
                pararCamera();
                cameraStream = stream;
                const video = document.getElementById('qr-video');
                video.srcObject = stream;
                await video.play();
                status.innerText = 'Aponte para o QR do ingresso';
                requestAnimationFrame(lerQuadro);
            } catch (e) {
                status.innerText = 'Sem acesso à câmera. Libere a permissão ou simule abaixo.';
            }
        }

        function pararCamera() {
            if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
            cameraStream = null;
        }

        const canvasQr = document.createElement('canvas');

        function lerQuadro() {
            const video = document.getElementById('qr-video');
            if (!cameraStream || !video) return;
            if (!leituraPausada && video.readyState === video.HAVE_ENOUGH_DATA) {
                // Reduz o quadro: o jsQR roda bem mais rápido e o QR continua legível
                const escala = Math.min(1, 480 / Math.max(video.videoWidth, video.videoHeight));
                canvasQr.width = Math.round(video.videoWidth * escala);
                canvasQr.height = Math.round(video.videoHeight * escala);
                const ctx = canvasQr.getContext('2d', { willReadFrequently: true });
                ctx.drawImage(video, 0, 0, canvasQr.width, canvasQr.height);
                const img = ctx.getImageData(0, 0, canvasQr.width, canvasQr.height);
                const achado = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
                if (achado && achado.data) processarLeitura(achado.data);
            }
            requestAnimationFrame(lerQuadro);
        }

        function processarLeitura(texto) {
            leituraPausada = true;
            if (navigator.vibrate) navigator.vibrate(60);
            const house = casaDoGerente();
            const lido = lerPayloadIngresso(texto);
            leituraPendente = null;

            let tipo, titulo, detalhe = '', acao = '';
            if (!lido) {
                tipo = 'erro'; titulo = 'QR inválido'; detalhe = 'Este código não é um ingresso GoDrinking.';
            } else {
                const outraCasa = housesData.find(h => h.id === lido.houseId);
                const local = reservations.find(r => r.id === lido.id);
                const r = local || lido;
                const prog = outraCasa && outraCasa.programacao.find(p => p.id === lido.eventId);
                const noite = prog ? nomeNoite(prog) : '';
                const quando = lido.eventDate ? diaRelativo(new Date(lido.eventDate)) : '';
                detalhe = `${rotuloGarantia(r)}${noite ? ' · ' + noite : ''}${quando ? ' · ' + quando : ''}`;
                titulo = escHtml(r.userName);

                if (lido.houseId !== house.id) {
                    tipo = 'erro'; titulo = 'Ingresso de outra casa';
                    detalhe = `${escHtml(r.userName)} está na lista de ${outraCasa ? nomeCasa(outraCasa) : 'outra casa'}.`;
                } else if (r.status === 'cancelada') {
                    tipo = 'erro'; detalhe = 'Reserva cancelada pelo cliente.';
                } else if (r.status === 'presente') {
                    tipo = 'aviso'; detalhe = 'Esta entrada já foi validada.';
                } else if (lido.eventDate && reservaPassou({ ...lido, status: 'confirmada' }, agora())) {
                    tipo = 'erro'; detalhe = 'A noite deste ingresso já acabou.';
                } else {
                    tipo = 'ok';
                    leituraPendente = { ...lido, ...(local || {}) };
                    acao = `<button onclick="confirmarLeitura(this)" class="press btn-primary flex-1">Confirmar entrada</button>`;
                }
            }

            const cor = { ok: 'var(--live)', aviso: 'var(--accent)', erro: 'var(--danger)' }[tipo];
            const icone = { ok: 'circle-check', aviso: 'circle-alert', erro: 'circle-x' }[tipo];
            document.getElementById('qr-status').innerText = 'Leitura pausada';
            document.getElementById('qr-resultado').innerHTML = `
                <div class="card p-4 space-y-3" style="box-shadow: inset 0 0 0 1.5px ${cor};">
                    <div class="flex items-start gap-3">
                        <i data-lucide="${icone}" class="w-7 h-7 shrink-0" style="color: ${cor};"></i>
                        <div class="min-w-0">
                            <p class="t-headline truncate">${titulo}</p>
                            <p class="t-foot c-2">${detalhe}</p>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        ${acao}
                        <button onclick="retomarLeitura()" class="press btn-secondary ${acao ? '' : 'flex-1'}">Ler outro</button>
                    </div>
                </div>`;
            lucide.createIcons();
        }

        async function confirmarLeitura(botao) {
            const r = leituraPendente;
            if (!r) return;
            if (botao) {
                const restaurar = emVoo(botao, 'Confirmando…');
                await aguardar(500);
                restaurar();
                // "Ler outro" ou troca de aba durante o voo cancela sem efeito
                if (leituraPendente !== r || currentTab !== 'gerente' || abaGerente !== 'qr') return;
            }
            // Ingresso de outro celular: entra na lista desta casa na hora da leitura
            if (!reservations.some(x => x.id === r.id)) {
