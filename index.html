<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>LUAN</title>

    <!-- PWA & Mobile Web App settings (Para instalar na tela inicial com ícone do Beat Proibido) -->
    <link rel="icon" href="favicon.jpg" type="image/jpeg">
    <link rel="apple-touch-icon" href="favicon.jpg">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Tipografia: a do sistema (SF Pro no iPhone). Geist só cobre quem não tem SF. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Mapa: Leaflet + base escura da CARTO (dados OpenStreetMap) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        theme: {
                            bg: 'var(--bg-app)',
                            card: 'var(--bg-card)',
                            border: 'var(--border-color)',
                            primary: 'var(--primary)',
                            secondary: 'var(--secondary)',
                            accent: 'var(--accent)',
                        }
                    },
                    fontFamily: {
                        heading: 'var(--font-heading)',
                        body: 'var(--font-body)',
                    }
                }
            }
        }
    </script>

    <style>
        /* ===================================================================
           SISTEMA VISUAL
           Fundo preto, uma família tipográfica, botão principal branco e uma
           única cor de destaque. A identidade de cada casa aparece só no logo
           e na imagem — nunca troca fonte nem cor do app inteiro.
           =================================================================== */
        :root {
            --bg-app: #000000;
            --bg-card: #1c1c1e;
            --border-color: #2c2c2e;
            --primary: #ffffff;
            --secondary: #98989f;
            --accent: #ff9f0a;
            --live: #30d158;
            --danger: #ff453a;
            --fill-1: #1c1c1e;
            --fill-2: #2c2c2e;
            --fill-3: #3a3a3c;
            --label-2: #98989f;
            --label-3: #8e8e93;
            --sep: rgba(255, 255, 255, 0.12);
            --font-heading: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Geist", system-ui, sans-serif;
            --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Geist", system-ui, sans-serif;
            --border-radius: 14px;
            --button-radius: 12px;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: var(--font-body);
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        /* Escala tipográfica (tamanhos do iOS) */
        .t-large { font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: -0.4px; }
        .t-title1 { font-size: 28px; line-height: 32px; font-weight: 700; letter-spacing: -0.4px; }
        .t-title2 { font-size: 22px; line-height: 28px; font-weight: 700; letter-spacing: -0.3px; }
        .t-title3 { font-size: 20px; line-height: 25px; font-weight: 700; letter-spacing: -0.2px; }
        .t-headline { font-size: 17px; line-height: 22px; font-weight: 600; }
        .t-body { font-size: 17px; line-height: 22px; }
        .t-callout { font-size: 16px; line-height: 21px; }
        .t-sub { font-size: 15px; line-height: 20px; }
        .t-foot { font-size: 13px; line-height: 18px; }
        .t-cap { font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
        .c-2 { color: var(--label-2); }
        .c-3 { color: var(--label-3); }
        .c-accent { color: var(--accent); }
        .c-live { color: var(--live); }
        .c-danger { color: var(--danger); }
        .mono { font-family: "Geist Mono", ui-monospace, SFMono-Regular, monospace; }

        /* Toque: resposta física, sem brilho */
        .press { transition: transform 0.18s ease, opacity 0.18s ease; cursor: pointer; }
        .press:active { transform: scale(0.97); opacity: 0.85; }

        /* Listas agrupadas com separador recuado */
        .group-list { background: var(--fill-1); border-radius: 16px; overflow: hidden; }
        .group-list.on-fill { background: var(--fill-2); border-radius: 14px; }
        .row { position: relative; display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 48px; width: 100%; text-align: left; }
        .row + .row::before { content: ''; position: absolute; top: 0; right: 0; left: var(--inset, 16px); height: 0.5px; background: var(--sep); }

        .btn-primary { height: 50px; padding: 0 24px; border-radius: 25px; background: #ffffff; color: #000000; font-size: 17px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; }
        .btn-primary.sm { height: 44px; padding: 0 20px; border-radius: 22px; font-size: 15px; }
        .btn-primary:disabled { background: var(--fill-2); color: var(--label-3); }
        .btn-secondary { height: 36px; padding: 0 14px; border-radius: 18px; background: var(--fill-2); color: #ffffff; font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }

        /* Materiais translúcidos */
        .glass { background: rgba(28, 28, 30, 0.7); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
        .chip-glass { height: 28px; padding: 0 10px; border-radius: 14px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
        .icon-glass { width: 40px; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; color: #ffffff; }
        .bar-bottom { background: rgba(22, 22, 24, 0.84); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); border-top: 0.5px solid rgba(255, 255, 255, 0.14); }
        .bar-top { background: rgba(22, 22, 24, 0.84); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); border-bottom: 0.5px solid rgba(255, 255, 255, 0.14); }

        .dot { width: 8px; height: 8px; border-radius: 4px; background: var(--live); display: inline-block; flex-shrink: 0; }
        .dot.idle { background: var(--fill-3); }
        .dot.pulse { animation: pulse 2s ease-in-out infinite; }
        @keyframes pulse { 50% { opacity: 0.35; } }

        .tag-agora { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; color: #000000; background: var(--accent); border-radius: 6px; padding: 2px 6px; }

        /* Mídia da casa: capa (frame do vídeo) sobre o logo. Sem capa, o logo aparece num fundo tingido. */
        .midia { position: relative; overflow: hidden; background: #1c1c1e; background: color-mix(in srgb, var(--tint, #ffffff) 20%, #1c1c1e); display: flex; align-items: center; justify-content: center; }
        .midia-logo { width: 46%; aspect-ratio: 1; border-radius: 50%; object-fit: cover; }
        .midia.thumb .midia-logo { width: 100%; height: 100%; border-radius: 0; }
        .midia-capa { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        .scrim-hero { background: linear-gradient(180deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0) 28%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.94) 100%); }
        .scrim-casa { background: linear-gradient(180deg, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0) 26%, rgba(0,0,0,0) 45%, #000000 100%); }

        .rail { display: flex; gap: 12px; overflow-x: auto; padding: 0 16px; scroll-snap-type: x mandatory; scroll-padding: 0 16px; }
        .rail > * { scroll-snap-align: start; }

        .search-field { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 12px; background: var(--fill-1); color: var(--label-3); }

        .segmented { display: flex; height: 32px; padding: 2px; border-radius: 9px; background: var(--fill-1); }
        .segmented button { flex: 1; border-radius: 7px; font-size: 13px; font-weight: 500; color: #ebebf5; transition: background 0.2s ease; }
        .segmented button[aria-selected="true"] { background: #636366; color: #ffffff; font-weight: 600; }

        .stepper { width: 36px; height: 36px; border-radius: 18px; background: var(--fill-3); display: flex; align-items: center; justify-content: center; color: #ffffff; }
        .stepper:disabled { opacity: 0.35; }

        .switch { appearance: none; -webkit-appearance: none; width: 51px; height: 31px; border-radius: 16px; background: var(--fill-3) !important; position: relative; transition: background 0.2s ease; flex-shrink: 0; cursor: pointer; }
        .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 14px; background: #ffffff; transition: transform 0.2s ease; box-shadow: 0 2px 6px rgba(0,0,0,0.25); }
        .switch:checked { background: var(--live) !important; }
        .switch:checked::after { transform: translateX(20px); }

        .tab-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding-top: 7px; height: 49px; color: var(--label-3); position: relative; }
        .tab-btn.on { color: #ffffff; }
        .tab-btn .fill-on { fill: none; }
        .tab-btn.on .fill-on { fill: currentColor; }
        .tab-btn.on .perf { stroke: #161618; }
        .tab-btn span.rotulo { font-size: 10px; font-weight: 600; }

        .grabber { width: 36px; height: 5px; border-radius: 3px; background: #48484a; margin: 0 auto; }
        .sheet { animation: sheet-in 0.38s cubic-bezier(0.32, 0.72, 0, 1); }
        .backdrop { animation: fade-in 0.25s ease; }
        .view-in { animation: fade-in 0.22s ease; }
        @keyframes sheet-in { from { transform: translateY(100%); } to { transform: none; } }
        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

        .pt-safe { padding-top: calc(env(safe-area-inset-top) + 14px); }
        /* Mapa */
        .mapa-moldura { isolation: isolate; } /* panes do Leaflet (z 400+) não passam por cima da barra inferior */
        .leaflet-container { background: #1c1c1e; font-family: var(--font-body); }
        .leaflet-control-attribution { background: rgba(0,0,0,0.55) !important; color: #8e8e93 !important; font-size: 9px; }
        .leaflet-control-attribution a { color: #aeaeb2 !important; }
        .pino { position: relative; width: 44px; height: 44px; border-radius: 22px; border: 3px solid var(--anel, #636366); background: var(--fill-2); box-shadow: 0 4px 14px rgba(0,0,0,0.6); overflow: hidden; display: flex; align-items: center; justify-content: center; transition: transform 0.2s ease; }
        .pino img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
        .pino-ini { font-size: 15px; font-weight: 700; color: #ffffff; }
        .pino-envelope { position: relative; width: 44px; height: 44px; }
        .pino-envelope.sel .pino { transform: scale(1.18); }
        .pino-envelope.apagado { opacity: 0.5; }
        .pino-nome { position: absolute; top: 48px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 11px; font-weight: 600; color: #ffffff; text-shadow: 0 1px 3px #000, 0 0 6px #000; }
        .pino-min { position: absolute; top: -8px; left: 30px; white-space: nowrap; font-size: 11px; font-weight: 700; line-height: 18px; padding: 0 6px; border-radius: 9px; background: #ffffff; color: #000000; box-shadow: 0 2px 6px rgba(0,0,0,0.5); }
        /* Rota: trilho discreto na cor do bar que se desenha da origem até a casa,
           e uma onda de luz (gradiente animado em JS) que varre o trajeto. */
        .rota-trilho { stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100; animation: rota-desenhar 0.8s cubic-bezier(.2,.8,.2,1) forwards; }
        .rota-onda { stroke-linecap: round; }
        .rota-onda.halo { filter: blur(9px); }
        .rota-onda:not(.halo) { filter: drop-shadow(0 0 3px rgba(255,255,255,0.25)); }
        @keyframes rota-desenhar { to { stroke-dashoffset: 0; } }
        .selo { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 8px; border-radius: 10px; font-size: 11px; font-weight: 700; letter-spacing: 0.02em; text-transform: uppercase; flex-shrink: 0; }
        .selo.aberto { color: var(--live); background: rgba(48, 209, 88, 0.16); }
        .selo.aberto .dot { width: 6px; height: 6px; }
        .selo.fechado { color: var(--danger); background: rgba(255, 69, 58, 0.16); }
        .eu-ponto { width: 18px; height: 18px; border-radius: 9px; background: #0a84ff; border: 3px solid #ffffff; box-shadow: 0 0 0 8px rgba(10,132,255,0.25); }
        .pb-safe { padding-bottom: calc(env(safe-area-inset-bottom) + 20px); }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }

        /* Ocultar barra de rolagem */
        .no-scrollbar::-webkit-scrollbar, .rail::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar, .rail {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Garante legibilidade total dos campos de texto (corrigindo textos invisíveis/brancos) */
        input, select, textarea {
            color: #ffffff !important;
            background-color: var(--bg-card) !important;
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--primary) !important;
            outline: none !important;
        }
        /* Campos embutidos em linhas de lista: sem caixa própria */
        .bare {
            background-color: transparent !important;
            border: 0;
            appearance: none;
            -webkit-appearance: none;
            font: inherit;
            min-width: 0;
        }
        .bare.c-2 { color: var(--label-2) !important; }
        input[type="search"]::-webkit-search-cancel-button { filter: invert(0.6); }
        option {
            background-color: #1c1c1e !important;
            color: #ffffff !important;
        }
        input::placeholder {
            color: #8e8e93 !important;
        }
        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        /* --- CORREÇÕES DE iPhone (iOS Safari) --- */

        /* A view do Vibes é flex-col, mas a classe .hidden do Tailwind sobrescreve o display.
           Sem isto, ao remover .hidden o container volta para display:block e o flex-1 não vale. */
        #tab-vibes-view:not(.hidden) {
            display: flex;
        }

        /* Respeita o notch e a barra de gestos do iPhone (junto com viewport-fit=cover) */
        .safe-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
        .vibes-safe-bottom {
            bottom: 1.5rem;
        }

        /* iOS aplica um brilho/controle nativo próprio em <video>; normaliza a superfície */
        .vibes-card video {
            background-color: #000;
        }
        .vibes-card video::-webkit-media-controls {
            display: none !important;
        }
    </style>
</head>
<body class="min-h-screen bg-black">

    <!-- Container Principal Centrado: Fica perfeito no Desktop e 100% fluido no Celular -->
    <div class="max-w-md mx-auto bg-theme-bg min-h-screen flex flex-col border-x border-[#1c1c1e] relative pb-28">

        <!-- Barra compacta: aparece quando o título grande sai da tela (padrão iOS) -->
        <div id="barra-compacta" aria-hidden="true" class="bar-top fixed top-0 inset-x-0 max-w-md mx-auto z-30 pointer-events-none opacity-0 transition-opacity duration-200" style="padding-top: env(safe-area-inset-top);">
            <div class="h-11 flex items-center justify-center px-16">
                <span id="barra-compacta-titulo" class="t-headline truncate"></span>
            </div>
        </div>

        <main class="flex-1 relative">

            <!-- HOJE: uma pergunta só — o que está rolando agora e como eu entro -->
            <section id="tab-hoje-view" class="view-in">
                <div class="pt-safe px-4 space-y-3.5">
                    <div class="flex justify-between items-center h-9">
                        <span id="hoje-data" class="t-sub c-2 font-medium"></span>
                        <button onclick="openMenu()" id="avatar-btn" aria-label="Perfil e modo demonstração" class="press relative w-9 h-9 rounded-full bg-[#2c2c2e] flex items-center justify-center t-sub font-semibold"></button>
                    </div>
                    <div class="space-y-1">
                        <h1 class="t-large">Hoje</h1>
                        <p id="hoje-resumo" class="t-sub c-2 flex items-center gap-2"></p>
                    </div>
                    <label class="search-field">
                        <i data-lucide="search" class="w-[17px] h-[17px] shrink-0"></i>
                        <input type="search" id="search-input" oninput="searchFilter()" placeholder="Casa, festa ou estilo" aria-label="Buscar casas e festas" autocomplete="off" class="bare flex-1 t-body text-white">
                    </label>
                </div>

                <div id="hoje-conteudo" class="pt-6 space-y-9">
                    <!-- Gerado via renderHoje() -->
                </div>

                <!-- Entrada do módulo Freelas (pós-MVP, ver base/07). Fica no fim de propósito:
                     quem abre o app para sair à noite não deve tropeçar em vagas de trabalho. -->
                <div class="px-4 pt-12">
                    <button onclick="switchTab('freelas')" class="press group-list row" style="min-height: 64px;">
                        <span class="w-9 h-9 rounded-[10px] bg-[#2c2c2e] flex items-center justify-center shrink-0">
                            <i data-lucide="briefcase" class="w-[18px] h-[18px]"></i>
                        </span>
                        <span class="flex-1 min-w-0 flex flex-col">
                            <span class="t-callout font-semibold">Trabalhe na noite</span>
                            <span class="t-foot c-2">Vagas de freela nas casas, com contrato no app</span>
                        </span>
                        <i data-lucide="chevron-right" class="w-4 h-4 text-[#636366] shrink-0"></i>
                    </button>
                </div>
            </section>

            <!-- AGENDA: todas as casas de um dia, com horário, entrada e promoções -->
            <section id="tab-agenda-view" class="hidden view-in">
                <div class="pt-safe px-4 space-y-0.5">
                    <h1 class="t-large pt-3">Agenda</h1>
                    <p id="agenda-resumo" class="t-sub c-2"></p>
                    <div class="segmented !mt-3" role="tablist" aria-label="Ver a agenda como">
                        <button type="button" role="tab" id="seg-agenda-lista" onclick="setAgendaModo('lista')">Lista</button>
                        <button type="button" role="tab" id="seg-agenda-mapa" onclick="setAgendaModo('mapa')">Mapa</button>
                    </div>
                </div>
                <div id="agenda-dias" class="rail pt-4" role="group" aria-label="Escolher o dia"></div>
                <div id="agenda-lista" class="px-4 pt-5 space-y-8">
                    <!-- Gerado via renderAgenda() -->
                </div>
                <div id="agenda-mapa" class="hidden px-4 pt-4">
                    <div class="mapa-moldura relative rounded-[18px] overflow-hidden bg-[#1c1c1e]" style="height: max(380px, calc(100dvh - 330px));">
                        <div id="mapa-agenda" class="absolute inset-0"></div>
                        <button type="button" onclick="centralizarMapaAgenda()" aria-label="Mostrar todas as casas e a minha localização"
                                class="press glass absolute top-3 right-3 z-[1000] w-10 h-10 rounded-full flex items-center justify-center">
                            <i data-lucide="locate-fixed" class="w-5 h-5"></i>
                        </button>
                        <div id="mapa-cartao" class="absolute left-3 right-3 bottom-3 z-[1000] hidden"></div>
                    </div>
                    <p id="mapa-rodape" class="t-foot c-3 pt-3 px-1 space-y-1"></p>
                </div>
            </section>

            <!-- TELA: TRABALHE NA NOITE (MÓDULO FREELAS) -->
            <div id="tab-freelas-view" class="pt-safe px-4 space-y-7 hidden">
                <!-- Gerado dinamicamente via renderFreelas() -->
            </div>

            <!-- INGRESSOS: a carteira de entradas -->
            <section id="tab-ingressos-view" class="hidden view-in">
                <div class="pt-safe px-4 space-y-3.5">
                    <h1 class="t-large pt-3">Ingressos</h1>
                    <div class="segmented" role="tablist" aria-label="Filtrar ingressos">
                        <button type="button" role="tab" id="seg-proximos" onclick="setIngressosFiltro('proximos')">Próximos</button>
                        <button type="button" role="tab" id="seg-passados" onclick="setIngressosFiltro('passados')">Passados</button>
                    </div>
                </div>
                <div id="ingressos-lista" class="px-4 pt-4 space-y-4">
                    <!-- Gerado via updateReservasUI() -->
                </div>
            </section>

            <!-- TELA INTERNA: DETALHE DA CASA -->
            <div id="house-detail-view" class="hidden view-in">
                <!-- Gerado dinamicamente -->
            </div>

            <!-- TELA INTERNA: DASHBOARD GERENTE -->
            <div id="manager-dashboard-view" class="pt-safe px-4 space-y-7 hidden">
                <!-- Gerado dinamicamente -->
            </div>

        </main>

        <!-- VIBES (FULLSCREEN VIDEO FEED) -->
        <div id="tab-vibes-view" class="fixed inset-x-0 top-0 bottom-[calc(49px+env(safe-area-inset-bottom))] max-w-md mx-auto bg-black hidden flex-col z-30 overflow-hidden">
            <!-- Scroll Snapping Video Container (Gerado dinamicamente via JS) -->
            <div id="vibes-scroll-container" class="flex-1 overflow-y-scroll snap-y snap-mandatory no-scrollbar w-full h-full">
                <!-- Gerado dinamicamente via JS para centralizar as cores e os dados das casas -->
            </div>
        </div>

        <!-- CASA: botões flutuantes sobre a imagem -->
        <div id="casa-topo" class="fixed top-0 inset-x-0 max-w-md mx-auto z-40 hidden pointer-events-none">
            <div class="flex justify-between px-4" style="padding-top: calc(env(safe-area-inset-top) + 2px);">
                <button onclick="backToDiscover()" aria-label="Voltar" class="press glass icon-glass pointer-events-auto">
                    <i data-lucide="chevron-left" class="w-[22px] h-[22px]"></i>
                </button>
                <button onclick="compartilharCasa()" aria-label="Compartilhar" class="press glass icon-glass pointer-events-auto">
                    <i data-lucide="share" class="w-[18px] h-[18px]"></i>
                </button>
            </div>
        </div>

        <!-- CASA: ação principal fixa no rodapé -->
        <div id="casa-cta" class="bar-bottom fixed bottom-0 inset-x-0 max-w-md mx-auto z-40 hidden">

        /* ===================================================================
           MOTOR DE TEMPO
           O cliente chega no app com tres perguntas: o que rola HOJE, quanto
           custa entrar AGORA e qual promocao ainda esta valendo. Nada disso
           pode ser texto digitado a mao - tudo abaixo e derivado do horario
           estruturado da programacao, entao os rotulos nunca envelhecem.
           =================================================================== */

        const DIAS_LONGO = ['DOMINGO', 'SEGUNDA', 'TERÇA', 'QUARTA', 'QUINTA', 'SEXTA', 'SÁBADO'];
        const DIAS_CURTO = ['DOM', 'SEG', 'TER', 'QUA', 'QUI', 'SEX', 'SÁB'];
        const MESES = ['JAN', 'FEV', 'MAR', 'ABR', 'MAI', 'JUN', 'JUL', 'AGO', 'SET', 'OUT', 'NOV', 'DEZ'];

        // Deslocamento do relogio para a demo. Guardamos offset (e nao uma data
        // fixa) para o tempo continuar correndo: as contagens regressivas se
        // movem na frente do cliente durante a apresentacao.
        let clockOffsetMs = 0;

        function agora() {
            return new Date(Date.now() + clockOffsetMs);
        }

        function minutosDe(hhmm) {
            const [h, m] = hhmm.split(':').map(Number);
            return h * 60 + m;
        }

        function pad2(n) {
            return n < 10 ? '0' + n : '' + n;
        }

        function duracaoMin(prog) {
            let d = minutosDe(prog.fim) - minutosDe(prog.inicio);
            if (d <= 0) d += 1440; // a noite virou o dia
            return d;
        }

        // Proxima ocorrencia (ou a que esta rolando). A varredura comeca em
        // ontem de proposito: as 2h da manha, a noite de ontem ainda e hoje.
        function ocorrencia(prog, ref) {
            ref = ref || agora();
            const dur = duracaoMin(prog);
            for (let off = -1; off <= 7; off++) {
                const d = new Date(ref.getFullYear(), ref.getMonth(), ref.getDate() + off);
                if (d.getDay() !== prog.diaSemana) continue;
                const inicio = new Date(d.getFullYear(), d.getMonth(), d.getDate(), ...prog.inicio.split(':').map(Number));
                const fim = new Date(inicio.getTime() + dur * 60000);
                if (fim > ref) return { inicio, fim };
            }
            return null;
        }

        // Ancora um horario "hh:mm" dentro da janela da noite, respeitando a virada.
        function ancorar(hhmm, occ) {
            const base = occ.inicio;
            let d = new Date(base.getFullYear(), base.getMonth(), base.getDate(), ...hhmm.split(':').map(Number));
            if (d < base) d = new Date(d.getTime() + 86400000);
            return d;
        }

        function statusNoite(prog, ref) {
            ref = ref || agora();
            const occ = ocorrencia(prog, ref);
            if (!occ) return null;
            const emMin = Math.round((occ.inicio - ref) / 60000);
            const restaMin = Math.round((occ.fim - ref) / 60000);
            let estado = 'futura';
            if (ref >= occ.inicio) estado = 'agora';
            else if (mesmoDia(occ.inicio, ref)) estado = 'hoje';
            return { estado, occ, inicio: occ.inicio, fim: occ.fim, emMin, restaMin, prog };
        }

        function mesmoDia(a, b) {
            return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
        }

        function janelaPromo(promo, occ) {
            return {
                inicio: promo.inicio ? ancorar(promo.inicio, occ) : occ.inicio,
                fim: promo.fim ? ancorar(promo.fim, occ) : occ.fim
            };
        }

        function statusPromo(promo, occ, ref) {
            ref = ref || agora();
            const j = janelaPromo(promo, occ);
            if (ref >= j.fim) return { estado: 'expirada', janela: j };
            if (ref < j.inicio) return { estado: 'programada', janela: j, emMin: Math.round((j.inicio - ref) / 60000) };
            return { estado: 'ativa', janela: j, restaMin: Math.round((j.fim - ref) / 60000) };
        }

        // Promocoes ordenadas pelo que importa: o que acaba primeiro vem primeiro,
        // e o que ja acabou desce para o fim da lista (mas nao some - ver nota de UX).
        function promosDaNoite(prog, occ, ref) {
            ref = ref || agora();
            const peso = { ativa: 0, programada: 1, expirada: 2 };
            return (prog.promocoes || [])
                .map(p => ({ promo: p, st: statusPromo(p, occ, ref) }))
                .sort((a, b) => (peso[a.st.estado] - peso[b.st.estado]) || (a.st.janela.fim - b.st.janela.fim));
        }

        // Faixa de entrada vigente + a proxima, para dizer "free ate 20h, depois R$10".
        function entradaVigente(prog, occ, ref) {
            ref = ref || agora();
            const faixas = prog.entrada || [];
            for (let i = 0; i < faixas.length; i++) {
                const f = faixas[i];
                if (!f.ate) return { atual: f, ate: null, proxima: null };
                const limite = ancorar(f.ate, occ);
                if (ref < limite) return { atual: f, ate: limite, proxima: faixas[i + 1] || null };
            }
            return { atual: faixas[faixas.length - 1] || null, ate: null, proxima: null };
        }

        // --- Formatadores ---

        function fmtHora(d) {
            const h = d.getHours(), m = d.getMinutes();
            return m === 0 ? `${h}h` : `${h}h${pad2(m)}`;
        }

        function fmtDuracao(min) {
            if (min < 1) return 'menos de 1 min';
            if (min < 60) return `${min} min`;
            const h = Math.floor(min / 60), m = min % 60;
            return m ? `${h}h${pad2(m)}` : `${h}h`;
        }

        function fmtPreco(faixa) {
            if (!faixa) return 'Consultar';
            return faixa.valor === 0 ? 'Free' : `R$${faixa.valor}`;
        }

        // "HOJE", "AMANHÃ" ou "SEXTA · 28.AGO" - o dia da semana sozinho nao
        // responde "qual sexta?", e o cliente pergunta isso o tempo todo.
        function rotuloDia(d, ref) {
            ref = ref || agora();
            const amanha = new Date(ref.getFullYear(), ref.getMonth(), ref.getDate() + 1);
            if (mesmoDia(d, ref)) return 'HOJE';
            if (mesmoDia(d, amanha)) return 'AMANHÃ';
            return `${DIAS_LONGO[d.getDay()]} · ${pad2(d.getDate())}.${MESES[d.getMonth()]}`;
        }

        function fmtJanelaNoite(st) {
            return `${fmtHora(st.inicio)} às ${fmtHora(st.fim)}`;
        }

        // Linha de entrada pronta para exibir. E o dado numero 1 de decisao:
        // "vale a pena sair de casa agora?" depende dele.
        function textoEntrada(prog, occ, ref) {
            const e = entradaVigente(prog, occ, ref);
            if (!e.atual) return { texto: 'Entrada a consultar', urgente: false };
            const preco = fmtPreco(e.atual);
            const nota = e.atual.nota ? ` (${e.atual.nota})` : '';
            if (!e.ate || !e.proxima) {
                const base = e.atual.valor === 0 ? 'Entrada free' : `Entrada ${preco}`;
                return { texto: base + nota, urgente: false };
            }
            const restam = Math.round((e.ate - (ref || agora())) / 60000);
            const emCurso = (ref || agora()) >= occ.inicio;
            return {
                texto: `${preco}${nota} até ${fmtHora(e.ate)} · depois ${fmtPreco(e.proxima)}`,
                urgente: emCurso && e.atual.valor === 0 && restam <= 90,
                restam
            };
        }

        // Noite a exibir no cartao da casa: a que esta rolando, ou a proxima.
        function noiteEmDestaque(house, ref) {
            ref = ref || agora();
            let melhor = null;
            (house.programacao || []).forEach(prog => {
                const st = statusNoite(prog, ref);
                if (!st) return;
                if (!melhor || st.inicio < melhor.inicio) melhor = st;
            });
            return melhor;
        }

        // Agenda da casa ordenada a partir de hoje - a semana comeca onde o
        // cliente esta, nao na segunda-feira.
        function agendaOrdenada(house, ref) {
            ref = ref || agora();
            return (house.programacao || [])
                .map(prog => statusNoite(prog, ref))
                .filter(Boolean)
                .sort((a, b) => a.inicio - b.inicio);
        }

        // --- Relogio de demonstracao ---

        function aplicarSimulacao(diaSemana, hhmm) {
            const real = new Date();
            const alvo = new Date(real.getFullYear(), real.getMonth(), real.getDate(), ...hhmm.split(':').map(Number));
            let delta = (diaSemana - alvo.getDay() + 7) % 7;
            alvo.setDate(alvo.getDate() + delta);
            clockOffsetMs = alvo - real;
            redesenharTudo();
        }

        function limparSimulacao() {
            clockOffsetMs = 0;
            redesenharTudo();
        }

        function simulacaoAtiva() {
            return Math.abs(clockOffsetMs) > 60000;
        }

        function lerSimulacaoDaUrl() {
            const p = new URLSearchParams(location.search);
            const dia = p.get('dia'), hora = p.get('hora');
            if (!hora) return;
            // "sab" e "sáb" valem igual: o link é digitado à mão, sem acento
            const semAcento = t => t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
            const idx = dia ? DIAS_CURTO.findIndex(d => semAcento(d) === semAcento(dia.slice(0, 3))) : new Date().getDay();
            aplicarSimulacao(idx >= 0 ? idx : new Date().getDay(), hora);
        }

        function redesenharTudo() {
            atualizarAvatar();
            if (currentTab === 'hoje') renderHoje();
            if (currentTab === 'agenda') renderAgenda();
            updateReservasUI();
            if (currentTab === 'casa' && activeHouseId) openHouseDetail(activeHouseId, null, { manterScroll: true });
            if (currentTab === 'freelas') renderFreelas();
        }

        // Tela que abre o app. 'agenda' é a candidata a virar a inicial.
        const ABA_INICIAL = 'hoje';

        // --- SISTEMA DE ESTADO ---
        let currentTab = ABA_INICIAL;
        let abaAnterior = 'hoje';       // para onde o "voltar" da casa leva
        let activeHouseId = null;
        let isManagerMode = false;
        let identidadeId = 'default';
        let reservations = [];
        try { reservations = JSON.parse(localStorage.getItem('gyn_reservas')) || []; } catch (e) { reservations = []; }

        // Perfil da demo. O nome e o WhatsApp usados na última lista ficam salvos.
        const USUARIO = { nome: 'Salvador', telefone: '(62) 99000-0000' };
        try { Object.assign(USUARIO, JSON.parse(localStorage.getItem('gyn_perfil')) || {}); } catch (e) { /* segue com o padrão */ }

        // Inicializar
        window.addEventListener('DOMContentLoaded', () => {
            lerSimulacaoDaUrl();          // ?dia=sex&hora=22:30 para demonstrar a noite
            aplicarIdentidade('default');
            switchTab(ABA_INICIAL);
            updateReservasUI();

            // O tempo corre na frente do cliente: as contagens regressivas
            // e o status "rolando agora" se atualizam sozinhos.
            setInterval(() => {
                if (currentTab === 'vibes') return;
                redesenharTudo();
            }, 60000);

            window.addEventListener('scroll', atualizarBarraCompacta, { passive: true });
            document.addEventListener('keydown', e => {
                if (e.key !== 'Escape') return;
                closeReservationModal();
                closeMenu();
                closeVagaModal();
            });

            abrirDestinoDaUrl();          // ?casa=moi ou ?aba=ingressos — link direto
        });

        // Link direto para uma casa ou aba. Serve para o "vem pro Môi hoje"
        // colado no direct cair na tela certa, e para a demo abrir onde precisa.
        // Os nomes antigos de aba (discover, promos, reservas) continuam valendo.
        function abrirDestinoDaUrl() {
            const p = new URLSearchParams(location.search);
            const casa = p.get('casa');
            const aba = p.get('aba');
            if (casa && housesData.some(h => h.id === casa)) {
                openHouseDetail(casa);
                return;
            }
            const diaAgenda = p.get('agenda');   // hoje | amanha | fds
            if (aba === 'agenda' && ['hoje', 'amanha', 'fds'].includes(diaAgenda)) agendaDia = diaAgenda;
            if (aba === 'agenda' && p.get('modo') === 'mapa') agendaModo = 'mapa';
            if (aba && ['hoje', 'agenda', 'vibes', 'ingressos', 'freelas', 'discover', 'promos', 'reservas'].includes(aba)) switchTab(aba);
        }

        /* ===================================================================
           TEXTO PARA A TELA
           Os dados vêm em caixa-alta (padrão de flyer). Na interface, caixa-alta
           em tudo apaga a hierarquia; convertemos para título aqui.
           =================================================================== */

        const DIAS_TITULO = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
        const DIAS_ABREV = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
        const MESES_LONGO = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
        const MESES_ABREV = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
        const SIGLAS = { DJ: 'DJ', DJS: 'DJs', B2B: 'B2B', MC: 'MC', MCS: 'MCs' };
        const MINUSCULAS = new Set(['de', 'do', 'da', 'dos', 'das', 'e', 'com', 'na', 'no', 'em']);

        function titulo(texto) {
            return (texto || '').split(' ').map((w, i) => {
                const alta = w.toLocaleUpperCase('pt-BR');
                if (SIGLAS[alta]) return SIGLAS[alta];
                if (w !== alta) return w;               // já veio com caixa mista: respeita
                const baixa = w.toLocaleLowerCase('pt-BR');
                if (i > 0 && MINUSCULAS.has(baixa)) return baixa;
                return baixa.charAt(0).toLocaleUpperCase('pt-BR') + baixa.slice(1);
            }).join(' ');
        }

        const nomeCasa = house => titulo(house.nome);
        const nomeNoite = prog => titulo(prog.nome);

        function escHtml(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        // "Hoje", "Amanhã" ou "Qua, 23 set"
        function diaRelativo(d, ref) {
            ref = ref || agora();
            const amanha = new Date(ref.getFullYear(), ref.getMonth(), ref.getDate() + 1);
            if (mesmoDia(d, ref)) return 'Hoje';
            if (mesmoDia(d, amanha)) return 'Amanhã';
            return `${DIAS_ABREV[d.getDay()]}, ${d.getDate()} ${MESES_ABREV[d.getMonth()]}`;
        }

        // "HOJE · SEX, 18 SET" — a data completa responde "qual sexta?"
        function rotuloDataNoite(d, ref) {
            const rel = diaRelativo(d, ref);
            const data = `${DIAS_ABREV[d.getDay()]}, ${d.getDate()} ${MESES_ABREV[d.getMonth()]}`;
            return (rel === data ? data : `${rel} · ${data}`).toLocaleUpperCase('pt-BR');
        }

        // Entrada em duas linhas: o que vale agora (principal) e o que muda (detalhe).
        function infoEntrada(prog, occ, ref) {
            ref = ref || agora();
            const e = entradaVigente(prog, occ, ref);
            if (!e.atual) return { principal: 'Entrada a consultar', detalhe: '', urgente: false, curto: 'Consultar' };

            const temViragem = !!(e.ate && e.proxima);
            const emCurso = ref >= occ.inicio;
            const restam = e.ate ? Math.round((e.ate - ref) / 60000) : null;
            const gratis = e.atual.valor === 0;

            let principal;
            if (temViragem) principal = `${gratis ? 'Free' : 'R$' + e.atual.valor} até ${fmtHora(e.ate)}`;
            else principal = gratis ? 'Entrada free' : `Entrada R$${e.atual.valor}`;

            const partes = [];
            if (temViragem && emCurso && restam <= 120) partes.push(`faltam ${fmtDuracao(restam)}`);
            if (temViragem) partes.push(`depois ${fmtPreco(e.proxima)}`);
            const semNota = partes.join(' · ');
            if (e.atual.nota) partes.push(e.atual.nota);

            return {
                principal,
                detalhe: partes.join(' · '),
                detalheCurto: semNota,
                curto: temViragem ? principal : (gratis ? 'Free' : `R$${e.atual.valor}`),
                badge: gratis ? 'Free' : `R$${e.atual.valor}`,
                urgente: temViragem && emCurso && restam <= 90 && e.atual.valor < e.proxima.valor,
                restam,
                gratisAte: temViragem && gratis ? e.ate : null
            };
        }

        // Linhas de entrada da noite: cada faixa de preço, com a vigente marcada.
        function faixasEntradaHtml(prog, occ, ref) {
            ref = ref || agora();
            const faixas = prog.entrada || [];
            if (!faixas.length) return `<div class="row"><span class="t-sub c-2">Entrada a consultar</span></div>`;
            const vigente = entradaVigente(prog, occ, ref).atual;
            const emCurso = ref >= occ.inicio && ref < occ.fim;

            return faixas.map((f, i) => {
                const anterior = faixas[i - 1];
                let quando;
                if (f.ate) quando = `Até ${fmtHora(ancorar(f.ate, occ))}`;
                else if (anterior && anterior.ate) quando = `Depois das ${fmtHora(ancorar(anterior.ate, occ))}`;
                else quando = 'Entrada';

                const atual = emCurso && f === vigente;
                const passou = emCurso && f.ate && ref >= ancorar(f.ate, occ);
                const valor = `${fmtPreco(f)}${f.nota ? ` <span class="c-2 font-normal">· ${f.nota}</span>` : ''}`;

                return `
                    <div class="row justify-between ${passou ? 'opacity-40' : ''}">
                        <span class="t-sub ${atual || !emCurso ? '' : 'c-2'}">${quando}</span>
                        <span class="flex items-center gap-2 text-right">
                            ${atual ? '<span class="tag-agora">AGORA</span>' : ''}
                            <span class="t-sub ${atual || !emCurso ? 'font-semibold' : 'c-2'}">${valor}</span>
                        </span>
                    </div>`;
            }).join('');
        }

        // Status de uma promoção em texto curto, com a classe de cor.
        function tempoPromo(promo, st) {
            const j = st.janela;
            if (st.estado === 'expirada') return { texto: `encerrou ${fmtHora(j.fim)}`, classe: 'c-3' };
            if (st.estado === 'programada') return { texto: `a partir de ${fmtHora(j.inicio)}`, classe: 'c-2' };
            if (!promo.fim) return { texto: 'a noite toda', classe: 'c-2' };
            if (st.restaMin <= 90) return { texto: `acaba em ${fmtDuracao(st.restaMin)}`, classe: 'c-accent font-semibold' };
            return { texto: `até ${fmtHora(j.fim)}`, classe: 'c-2' };
        }

        function iconePromo(promo) {
            const n = (promo.nome + ' ' + (promo.detalhe || '')).toLowerCase();
            if (/%|off/.test(n)) return 'percent';
            if (/chopp|cerveja|brahma/.test(n)) return 'beer';
            if (/vinho|espumante|drink|gin|caipirinha|vodka|open bar|chá/.test(n)) return 'wine';
            if (/lote/.test(n)) return 'ticket';
            if (/show|dj|jogo/.test(n)) return 'music';
            return 'sparkles';
        }

        // --- Imagens ---
        // Capa = frame do vídeo em logo-casas/<id>-capa.jpg. Sem capa, o logo
        // aparece sobre um fundo tingido com a cor da casa.
        function midiaHtml(house, classes, variante) {
            return `
                <span class="midia ${variante || ''} ${classes || ''}" style="--tint: ${house.theme.primary}">
                    <img src="logo-casas/${house.id}.jpg" alt="" class="midia-logo" onerror="this.remove()">
                    <img src="logo-casas/${house.id}-capa.jpg" alt="" class="midia-capa" loading="lazy" onerror="this.remove()">
                </span>`;
        }

        function logoHtml(house, classes) {
            return `<img src="logo-casas/${house.id}.jpg" alt="" class="${classes} rounded-full object-cover bg-[#2c2c2e] shrink-0" onerror="this.style.visibility='hidden'">`;
        }

        function secaoHtml(tituloSecao, conteudo, opts) {
            opts = opts || {};
            return `
                <section ${opts.id ? `id="${opts.id}"` : ''} class="space-y-3">
                    <div class="px-4 flex justify-between items-baseline gap-3">
                        <div class="min-w-0">
                            <h2 class="t-title2">${tituloSecao}</h2>
                            ${opts.sub ? `<p class="t-sub c-2">${opts.sub}</p>` : ''}
                        </div>
                        ${opts.acao || ''}
                    </div>
                    ${opts.semPadding ? conteudo : `<div class="px-4">${conteudo}</div>`}

        /* ===================================================================
           HOJE
           =================================================================== */

        let mostrarEncerradas = false;

        function noitesDaSemana(ref) {
            const lista = [];
            housesData.forEach(house => {
                (house.programacao || []).forEach(prog => {
                    const st = statusNoite(prog, ref);
                    if (st) lista.push({ house, st });
                });
            });
            return lista.sort((a, b) => a.st.inicio - b.st.inicio);
        }

        // O destaque é a noite em que agir agora faz diferença: free acabando
        // primeiro, depois quem tem promoção valendo, depois quem fecha mais tarde.
        function escolherDestaque(lista, ref) {
            const pontuar = ({ st }) => {
                const ent = infoEntrada(st.prog, st.occ, ref);
                const promoAtiva = promosDaNoite(st.prog, st.occ, ref).some(x => x.st.estado === 'ativa');
                let p = 0;
                if (ent.gratisAte && ent.restam > 0) p += 1000 - ent.restam;
                if (promoAtiva) p += 100;
                p += (st.fim - ref) / 3600000;
                return p;
            };
            return lista.slice().sort((a, b) => pontuar(b) - pontuar(a))[0] || null;
        }

        function atualizarCabecalhoHoje(ref, abertas, abremHoje) {
            document.getElementById('hoje-data').innerText =
                `${DIAS_TITULO[ref.getDay()]}, ${ref.getDate()} de ${MESES_LONGO[ref.getMonth()]}`;

            let resumo;
            if (abertas > 0) resumo = `<span class="dot pulse"></span><span>${abertas} ${abertas === 1 ? 'casa aberta' : 'casas abertas'} agora</span>`;
            else if (abremHoje > 0) resumo = `<span class="dot idle"></span><span>${abremHoje} ${abremHoje === 1 ? 'casa abre' : 'casas abrem'} mais tarde</span>`;
            else resumo = `<span class="dot idle"></span><span>Nenhuma casa aberta agora</span>`;
            document.getElementById('hoje-resumo').innerHTML = resumo;
        }

        function casasUnicas(lista) {
            return new Set(lista.map(x => x.house.id)).size;
        }

        function renderHoje() {
            const container = document.getElementById('hoje-conteudo');
            if (!container) return;
            const ref = agora();
            const todas = noitesDaSemana(ref);
            const agoraL = todas.filter(x => x.st.estado === 'agora');
            const hojeL = todas.filter(x => x.st.estado === 'hoje');

            atualizarCabecalhoHoje(ref, casasUnicas(agoraL), casasUnicas(hojeL));

            const busca = document.getElementById('search-input').value.trim();
            if (busca) {
                container.innerHTML = htmlBusca(busca, ref);
                lucide.createIcons();
                return;
            }

            // Preserva a rolagem horizontal do carrossel entre redesenhos
            const rail = document.getElementById('rail-abertas');
            const railScroll = rail ? rail.scrollLeft : 0;

            const destaque = escolherDestaque(agoraL.length ? agoraL : hojeL, ref);
            const semDestaque = x => !destaque || x.st.prog.id !== destaque.st.prog.id;
            let html = destaque ? heroHtml(destaque.house, destaque.st, ref) : '';

            if (agoraL.length) {
                const outras = agoraL.filter(semDestaque);
                if (outras.length) {
                    html += secaoHtml('Abertas agora',
                        `<div id="rail-abertas" class="rail">${outras.map(x => cartaoRailHtml(x.house, x.st, ref)).join('')}</div>`,
                        { semPadding: true, acao: linkAgenda('hoje', 'Ver agenda') });
                }
                html += htmlValendoAgora(agoraL, ref);
                const tarde = hojeL.filter(semDestaque);
                if (tarde.length) html += secaoHtml('Mais tarde hoje', listaNoitesHtml(tarde, ref));
            } else if (hojeL.length) {
                const outras = hojeL.filter(semDestaque);
                if (outras.length) {
                    html += secaoHtml('Mais tarde hoje',
                        `<div id="rail-abertas" class="rail">${outras.map(x => cartaoRailHtml(x.house, x.st, ref)).join('')}</div>`,
                        { semPadding: true });
                }
                html += htmlPromosMaisTarde(hojeL, ref);
            }

            const amanha = new Date(ref.getFullYear(), ref.getMonth(), ref.getDate() + 1);
            const futuras = todas.filter(x => x.st.estado === 'futura');
            const deAmanha = futuras.filter(x => mesmoDia(x.st.inicio, amanha));
            const daSemana = futuras.filter(x => !mesmoDia(x.st.inicio, amanha));

            if (deAmanha.length) html += secaoHtml('Amanhã', listaNoitesHtml(deAmanha, ref), { acao: linkAgenda('amanha', 'Ver tudo') });
            if (daSemana.length) html += secaoHtml('Nesta semana', listaNoitesHtml(daSemana, ref, true), { acao: linkAgenda('fds', 'Fim de semana') });

            container.innerHTML = html;
            const novoRail = document.getElementById('rail-abertas');
            if (novoRail) novoRail.scrollLeft = railScroll;
            lucide.createIcons();
        }

            return `<button onclick="abrirAgenda('${sel}')" class="press t-sub c-accent shrink-0">${texto}</button>`;
        }

        function heroHtml(house, st, ref) {

        function htmlValendoAgora(agoraL, ref) {
            const itens = [];
            agoraL.forEach(({ house, st }) => {
                promosDaNoite(st.prog, st.occ, ref).forEach(x => itens.push({ house, prog: st.prog, promo: x.promo, pst: x.st }));
            });
            const ativas = itens.filter(i => i.pst.estado === 'ativa').sort((a, b) => a.pst.janela.fim - b.pst.janela.fim);
            const encerradas = itens.filter(i => i.pst.estado === 'expirada');

            const linhas = ativas.map(i => linhaPromoHome(i.house, i.prog, i.promo, i.pst))
                .concat(mostrarEncerradas ? encerradas.map(i => linhaPromoHome(i.house, i.prog, i.promo, i.pst)) : [])
                .join('');

            const rodape = encerradas.length ? `
                <button onclick="mostrarEncerradas = !mostrarEncerradas; renderHoje();" class="press t-foot c-3 px-4 pt-2.5 text-left">

            const corpo = linhas

            return secaoHtml('Valendo agora', corpo + rodape, { id: 'secao-valendo', sub: 'Promoções que ainda dá tempo de pegar' });

        function htmlPromosMaisTarde(hojeL, ref) {

            hojeL.forEach(({ house, st }) => {

            if (!itens.length) return '';
            itens.sort((a, b) => a.pst.janela.inicio - b.pst.janela.inicio);
            const linhas = itens.map(i => {
                const quando = i.promo.fim ? `${fmtHora(i.pst.janela.inicio)} – ${fmtHora(i.pst.janela.fim)}` : `a partir de ${fmtHora(i.pst.janela.inicio)}`;
